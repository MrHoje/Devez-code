<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.min.css">
<style>
  /* 앱 UI 폰트 — 안내 문구를 Pretendard 로 (터미널 모노/Malgun 대신). */
  @font-face {
    font-family: 'Pretendard';
    src: url('Pretendard-Regular.ttf') format('truetype');
    font-weight: 400; font-display: swap;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0C0C0C; }
  .term-container { position: absolute; inset: 0; padding: 6px 0 6px 22px; display: none; }
  /* opencode 세션: 좌우 여백을 더 줄인다 — 패딩 0 + 컨테이너 경계를 바깥으로 밀어(좌 8 / 우 17) 여백 제거 */
  .term-container.agent-opencode { padding: 6px 0 12px 0; left: 6px; right: -9px; bottom: -22px; }
  /* 가재코드(gjc) 인라인 TUI — 입력창이 바닥에 딱 붙지 않게 하단 여백 + 우측 여백 8px 확보. */
  .term-container.agent-gajae { padding-bottom: 14px; padding-right: 1px; }
  .term-container.active { display: block; }
  .term-container .xterm { height: 100%; }
  /* 스크롤바 숨김 (휠 스크롤은 동작) */
  .xterm .xterm-viewport { scrollbar-width: none; }
  .xterm .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; display: none; }

  /* IME 조합 미리보기 스타일 — Windows Terminal 과 동일하게 터미널 배경 위에
     전경색 글자 + 밑줄. (배경을 불투명하게 둬야 아래 깔린 블록커서(반전 셀)가
     비치지 않는다.)
     주의: display:none 으로 숨기면 조합용 textarea 크기가 0이 되어
     IME 조합 자체가 끊긴다(한글 입력 불가) — 절대 숨기지 말 것. */
  .xterm .composition-view {
    background: var(--term-bg, #0C0C0C);
    color: var(--term-fg, #CCCCCC);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* IME 조합 위치 고정: claude 같은 TUI는 하드웨어 커서를 입력 캐럿이 아닌
     화면 끝에 파킹해서 조합 글자가 엉뚱한 곳에 뜬다. 조합 중(ime-fixed)에는
     조합 글자와 textarea(후보창 기준점)를 입력란 블록커서 위치로 강제한다.
     xterm 은 0ms 루프로 인라인 left/top 을 계속 되돌리므로 — 인라인보다
     우선하는 !important CSS 변수로 무력화한다. */
  .term-container.ime-fixed .composition-view,
  .term-container.ime-fixed .xterm-helper-textarea {
    left: var(--ime-left) !important;
    top: var(--ime-top) !important;
  }

  /* ── 터미널 내 검색창 (Ctrl+Shift+F) — Windows Terminal 검색바 정합 ── */
  #search-bar {
    position: absolute; top: 8px; right: 12px; z-index: 10;
    display: none; align-items: center; gap: 6px;
    padding: 6px 8px; border-radius: 8px;
    background: var(--term-bg, #1b1b1b);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-size: 12px;
    color: var(--term-fg, #CCCCCC);
  }
  #search-bar.open { display: flex; }
  #search-input {
    width: 200px; padding: 4px 6px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.25); color: var(--term-fg, #CCCCCC);
    font-size: 12px; outline: none;
  }
  #search-input:focus { border-color: rgba(120,170,255,0.8); }
  #search-count { min-width: 54px; text-align: center; opacity: 0.7; font-variant-numeric: tabular-nums; }
  #search-bar button {
    width: 24px; height: 24px; padding: 0; cursor: pointer;
    border: none; border-radius: 5px; background: transparent;
    color: var(--term-fg, #CCCCCC); font-size: 13px; line-height: 1;
  }
  #search-bar button:hover { background: rgba(255,255,255,0.12); }

  /* ── 세션 로딩 스피너 (테마 변경 재시작·세션 진입 중) ──────────────
     WebView2 는 HwndHost 라 항상 WPF 위에 그려진다 → WPF 오버레이로는 터미널을
     덮을 수 없으므로 스피너를 웹 레이어 안에 둔다. 배경은 --term-bg 라 테마를 따라간다. */
  #loading-overlay {
    position: absolute; inset: 0; z-index: 50;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--term-bg, #0C0C0C);
  }
  #loading-overlay.on { display: flex; }

  /* 전환 커튼 — 분할 열림/닫힘으로 패널이 리사이즈될 때 그 리플로우를 감추는 단색(터미널 배경색) 덮개.
     WebView2 는 HwndHost 라 WPF 오버레이로 못 덮으므로 웹 레이어 안에서 처리한다. 커버 즉시 → 레이아웃
     확정·fit 후 fade-out. (로딩 스피너 z-50 아래에 둬 신규 세션 스피너는 커튼 위에 보인다.) */
  #xfer-cover {
    position: absolute; inset: 0; z-index: 45;
    display: none; opacity: 0; pointer-events: none;
    background: var(--term-bg, #0C0C0C);
  }
  /* devez 최초 실행 스피너와 동일: PrimaryBrush 점선 링(28 10) 회전, 0.85s, 두께 3. */
  #loading-overlay .ring {
    width: 36px; height: 36px;
    animation: dz-spin 0.85s linear infinite;
  }
  #loading-overlay .ring circle {
    fill: none;
    stroke: var(--term-accent, #2563eb);
    stroke-width: 3;
    stroke-dasharray: 74 30;
  }
  #loading-overlay .label {
    margin-top: 14px; font-size: 13px; opacity: 0.85;
    color: var(--term-fg, #CCCCCC);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
  }
  @keyframes dz-spin { to { transform: rotate(360deg); } }

  /* 복사 토스트 — 우리가 직접 복사(copy-on-select/Ctrl+C/우클릭)할 때 우측 하단에 잠깐.
     claude 의 자체 "copied N chars" 와 동일 위치/문구. (claude 는 OSC52 라 이 토스트 안 탐) */
  #copy-toast {
    position: absolute; right: 16px; bottom: 14px; z-index: 60;
    padding: 9px 17px; border-radius: 9px;
    background: var(--term-bg, #1b1b1b); color: var(--term-fg, #CCCCCC);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-size: 16px;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.15s ease, transform 0.15s ease; pointer-events: none;
  }
  #copy-toast.on { opacity: 1; transform: translateY(0); }
</style>
<script src="xterm.min.js"></script>
<script src="addon-fit.min.js"></script>
<script src="addon-search.min.js"></script>
<script src="addon-webgl.min.js"></script>
</head>
<body>
<div id="loading-overlay"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16.5"/></svg><div class="label">세션 여는 중…</div></div>
<div id="xfer-cover"></div>
<div id="copy-toast"></div>
<div id="search-bar">
  <input id="search-input" type="text" placeholder="검색" spellcheck="false" />
  <span id="search-count"></span>
  <button id="search-prev" title="이전 (Shift+Enter)">&#8593;</button>
  <button id="search-next" title="다음 (Enter)">&#8595;</button>
  <button id="search-close" title="닫기 (Esc)">&#10005;</button>
</div>
<script>
(function () {
  'use strict';

  // roomId → { term, fit, el, dead }
  const terms = {};
  let cfg = { theme: {}, fontFamily: 'Cascadia Mono', fontSize: 16 };
  let activeRoomId = null;
  let _scrollSuppress = 0; // >0이면 출력 쓰기 후 스크롤 복원
  let _scrollSuppressTimer = 0; // suppress 잔여 누수 방지용 타임아웃
  let _pinBottomUntil = 0; // 이 시각(ms)까지 출력 쓰기 후 항상 맨 아래로(인라인 TUI resume 재페인트 스크롤 튐 방지)
  let _xferCoverTimer = 0; // 전환 커튼 안전 자동해제 타이머(reveal 누락 대비)
  let _xferGen = 0; // 전환 세대 — cover/resync 시작마다 증가. 빠른 연속 전환 시 이전 전환의 지연 타이머(fade/step)를 무효화해 커튼이 엉뚱한 시점에 걷히는 깜빡임을 막는다.
  let _fitSuppressed = false; // 전환(커버) 중 true — 컨테이너가 전체폭→절반으로 줄어드는 중간 폭에서 fit 하면
                              // TUI 가 그 폭으로 그렸다 다시 리플로우돼 깨진다. 억제했다가 reveal 이 안정된 최종 폭에서 한 번만 fit.

  function post(msg) { window.chrome.webview.postMessage(msg); }

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // ── 동기화 업데이트(DECSET 2026) 배칭 ────────────────────────────────
  // gjc(멀티플렉서 모드)는 응답 한 줄이 추가될 때마다 변경 구간(새 줄~하단 입력창)을
  // \x1b[2K(줄 지움)+다시그리기로 repaint 하고 그 전체를 \x1b[?2026h … \x1b[?2026l 로
  // 감싸 "한 프레임에 원자적으로 그려라"고 지시한다. 그러나 번들된 xterm 5.5.0 은
  // ?2026 을 지원하지 않고, C# PTY 출력은 chunk 단위로 쪼개 보내므로 repaint 가 여러
  // term.write() 로 나뉘어 입력창이 지워졌다 다시 그려지는 중간 상태가 노출된다(튐).
  // → 여기서 open~close 사이 바이트를 모아 close 가 올 때 한 번의 write 로 흘려보낸다.
  const SYNC_OPEN  = [0x1b, 0x5b, 0x3f, 0x32, 0x30, 0x32, 0x36, 0x68]; // ESC[?2026h
  const SYNC_CLOSE = [0x1b, 0x5b, 0x3f, 0x32, 0x30, 0x32, 0x36, 0x6c]; // ESC[?2026l

  function indexOfSeq(buf, seq, from) {
    outer: for (let i = from; i + seq.length <= buf.length; i++) {
      for (let j = 0; j < seq.length; j++) if (buf[i + j] !== seq[j]) continue outer;
      return i;
    }
    return -1;
  }
  // buf 의 끝이 seq 의 진부분 접두사이면(=마커가 chunk 경계에서 잘림) 그 시작 인덱스, 없으면 -1.
  function trailingPrefixStart(buf, seq) {
    const maxLen = Math.min(seq.length - 1, buf.length);
    for (let len = maxLen; len > 0; len--) {
      let ok = true;
      for (let j = 0; j < len; j++) if (buf[buf.length - len + j] !== seq[j]) { ok = false; break; }
      if (ok) return buf.length - len;
    }
    return -1;
  }
  function concatBytes(a, b) {
    const r = new Uint8Array(a.length + b.length); r.set(a, 0); r.set(b, a.length); return r;
  }
  function concatAll(arr) {
    let n = 0; for (let i = 0; i < arr.length; i++) n += arr[i].length;
    const r = new Uint8Array(n); let o = 0;
    for (let i = 0; i < arr.length; i++) { r.set(arr[i], o); o += arr[i].length; }
    return r;
  }

  // bytes 를 동기화 마커 기준으로 처리. sync 밖은 즉시 flush, open~close 는 모아 한 번에 flush.
  // 마커가 chunk 경계에서 잘릴 수 있어 끝의 부분 접두사는 entry.syncCarry 로 다음 chunk 까지 보류.
  function feedSync(entry, bytes, flush) {
    let buf = bytes;
    if (entry.syncCarry && entry.syncCarry.length) { buf = concatBytes(entry.syncCarry, bytes); entry.syncCarry = null; }
    let pos = 0;
    while (pos < buf.length) {
      if (!entry.inSync) {
        const open = indexOfSeq(buf, SYNC_OPEN, pos);
        if (open === -1) {
          const pre = trailingPrefixStart(buf, SYNC_OPEN);
          if (pre >= pos) { if (pre > pos) flush(buf.subarray(pos, pre)); entry.syncCarry = buf.slice(pre); }
          else flush(buf.subarray(pos));
          return;
        }
        if (open > pos) flush(buf.subarray(pos, open)); // open 이전은 즉시
        entry.inSync = true;
        entry.syncChunks = [buf.subarray(open, open + SYNC_OPEN.length)]; // 마커도 버퍼에(xterm 무시)
        pos = open + SYNC_OPEN.length;
      } else {
        const close = indexOfSeq(buf, SYNC_CLOSE, pos);
        if (close === -1) {
          const pre = trailingPrefixStart(buf, SYNC_CLOSE);
          if (pre >= pos) { if (pre > pos) entry.syncChunks.push(buf.subarray(pos, pre)); entry.syncCarry = buf.slice(pre); }
          else entry.syncChunks.push(buf.subarray(pos));
          return;
        }
        const end = close + SYNC_CLOSE.length;
        entry.syncChunks.push(buf.subarray(pos, end));
        flush(concatAll(entry.syncChunks)); // open~close 전체를 한 번에
        entry.syncChunks = [];
        entry.inSync = false;
        pos = end;
      }
    }
  }

  // pin/suppress 정책을 적용해 실제 term 에 쓴다(기존 output 분기 로직을 함수화).
  function writeOut(t, bytes) {
    // 비활성(display:none) 탭은 스크롤 위치 계산이 무의미하고, scrollHeight 읽기가 강제 레이아웃을
    // 유발해 5세션 동시 출력 시 큰 비용이 된다. write 만 하고 끝낸다(탭 전환 show 시 scrollToBottom 처리).
    if (!activeRoomId || terms[activeRoomId] !== t) { t.term.write(bytes); return; }
    if (Date.now() < _pinBottomUntil) {
      t.term.write(bytes);
      requestAnimationFrame(function () { try { t.term.scrollToBottom(); } catch (e) {} });
    } else if (_scrollSuppress > 0) {
      _scrollSuppress--;
      const vp = t.term.element.querySelector('.xterm-viewport');
      const saved = vp ? vp.scrollTop : 0;
      t.term.write(bytes);
      if (vp) requestAnimationFrame(function () { vp.scrollTop = saved; });
    } else {
      // near-bottom sticky follow — 쓰기 직전 바닥에서 2줄 이내면 쓴 뒤 맨 아래로 붙인다.
      // xterm 은 "정확히 바닥"일 때만 새 출력을 자동 추종하는데, gjc 고빈도 재페인트 중 사용자가
      // 위로 올렸다 바닥 근처까지 내리면 몇 줄 모자라 추종이 끊긴다(맨 아래로 안 붙고 PageDown 필요).
      // 바닥 근처면 추종을 재개해 일반 터미널처럼 동작. 위로 올려 읽는 중(임계값 밖)엔 개입 안 함.
      const vp = t.term.element && t.term.element.querySelector('.xterm-viewport');
      let stick = false;
      if (vp) {
        const cell = (vp.clientHeight / t.term.rows) || 16;
        stick = (vp.scrollHeight - vp.clientHeight - vp.scrollTop) <= cell * 2 + 2;
      }
      t.term.write(bytes);
      if (stick) requestAnimationFrame(function () { try { t.term.scrollToBottom(); } catch (e) {} });
    }
  }

  // ── 마우스 모드 그대로 전달 ──────────────────────────────────────────
  // claude 등 TUI 가 켜는 마우스 트래킹(DECSET ?1000/1002/1003/1006)을 막지 않는다
  // → xterm 이 마우스 모드로 들어가 휠 스크롤/클릭/드래그가 앱으로 직접 전달(일반 WT 정합).
  // 마우스 모드 중 드래그하면 claude 가 자체 선택 후 OSC 52 로 복사한다 — 이를 클립보드에
  // 반영하는 처리는 createTerm 의 registerOscHandler(52) 참고. 마우스 모드를 안 쓰는 일반
  // 셸/화면에서는 xterm 로컬 드래그 선택 + copy-on-select(mouseup) 로 복사된다.
  // WT 스킴 → xterm ITheme (WT의 purple == ANSI magenta)
  function toXtermTheme(s) {
    const t = {
      background: s.background, foreground: s.foreground,
      cursor: s.cursorColor, cursorAccent: s.background,
      black: s.black, red: s.red, green: s.green, yellow: s.yellow,
      blue: s.blue, magenta: s.purple, cyan: s.cyan, white: s.white,
      brightBlack: s.brightBlack, brightRed: s.brightRed,
      brightGreen: s.brightGreen, brightYellow: s.brightYellow,
      brightBlue: s.brightBlue, brightMagenta: s.brightPurple,
      brightCyan: s.brightCyan, brightWhite: s.brightWhite,
    };
    if (s.selectionBackground) t.selectionBackground = s.selectionBackground;
    return t;
  }

  // gjc 전용 드래그 선택색 — claude 선택색(#267F78)과 동일하게. gjc 는 xterm 로컬 선택을
  // 쓰므로(마우스 모드 swallow) 방별로 selectionBackground 만 덮어쓴다. selectionForeground 는
  // 안 건다(단색 고정 시 색-기반 볼드 사라짐) — 원래 글자색/볼드 유지. 셸/타 에이전트는 기본색.
  // 테마별 gjc 선택색(배경색으로 현재 테마 판별 — soft/minimal 은 라이트, 기본은 dark).
  function gjcSelectionBg() {
    const bg = ((cfg.theme && cfg.theme.background) || '').toLowerCase();
    if (bg === '#f2ede6') return '#C2D8B0'; // soft
    if (bg === '#f8fafc') return '#C5D8F8'; // minimal(심플)
    return '#264F78';                        // dark
  }
  function themeFor(agent) {
    const t = toXtermTheme(cfg.theme);
    if (agent === 'gajae') t.selectionBackground = gjcSelectionBg();
    return t;
  }

  // ── IME 조합 위치 고정 ──────────────────────────────────────────────
  // claude 의 입력 캐럿 = 자체 블록 커서(반전 영상의 빈 셀, ESC[7m space).
  // 조합 시작 시 버퍼에서 이를 찾아 CSS 변수로 위치를 고정한다 (.ime-fixed).
  function setupImeCaretFix(term, el) {
    const ta = el.querySelector('.xterm-helper-textarea');
    if (!ta) return;

    function findBlockCursor() {
      const buf = term.buffer.active;
      // 입력란은 화면 하단부 → 아래에서 위로 스캔 (맨 아래 1줄=상태바 제외)
      for (let row = term.rows - 2; row >= 0; row--) {
        const line = buf.getLine(buf.baseY + row);
        if (!line) continue;
        for (let x = 0; x < term.cols; x++) {
          const cell = line.getCell(x);
          if (!cell || !cell.isInverse()) continue;
          const ch = cell.getChars();
          if (ch === '' || ch === ' ') return { row: row, col: x };
        }
      }
      return null;
    }

    function apply() {
      const caret = findBlockCursor();
      if (!caret) return;
      const screen = el.querySelector('.xterm-screen');
      if (!screen) return;
      const cw = screen.clientWidth / term.cols;
      const chh = screen.clientHeight / term.rows;
      el.style.setProperty('--ime-left', Math.round(caret.col * cw) + 'px');
      el.style.setProperty('--ime-top', Math.round(caret.row * chh) + 'px');
      el.classList.add('ime-fixed');
    }

    ta.addEventListener('compositionstart', function () {
      apply();
      setTimeout(apply, 60); // 직전 확정 글자가 TUI에 반영된 뒤 위치 재계산
    });
    ta.addEventListener('compositionupdate', function () { setTimeout(apply, 0); });
    ta.addEventListener('compositionend', function () {
      el.classList.remove('ime-fixed'); // 조합 종료 → xterm 기본 동작 복귀
      // 조합 중 Ctrl+Enter 가 눌렸으면 — 확정 글자가 PTY로 전송된 뒤(setTimeout 0)
      // 줄바꿈을 보낸다. 순서를 보장해 마지막 글자가 새 줄로 내려가지 않게 한다.
      if (pendingComposeNewline) {
        const pending = pendingComposeNewline;
        pendingComposeNewline = null;
        setTimeout(function () { post({ type: 'input', roomId: pending.roomId, data: pending.data }); }, 0);
      }
    });
  }

  // Ctrl+Enter 가 조합 중에 눌리면 조합 글자 확정 후(compositionend) 보낼 줄바꿈 대상.
  let pendingComposeNewline = null;
  // 한글 IME 조합 확정 Enter 는 keydown 이 2번 온다(229=조합중, 직후 13=확정된 Enter).
  // 229 처리 시각을 적어두고, 직후 따라오는 비조합 Enter keydown 을 흡수해 줄바꿈 중복을 막는다.
  let composeEnterAt = 0;

  // ── 키보드 단축키 (Windows Terminal 정합) ─────────────────────────────
  // attachCustomKeyEventHandler 규약: false 반환 = xterm 이 처리하지 않음(PTY 전송 차단),
  // true 반환 = 평소대로 셸/claude 로 키 전달. 우리가 가로채는 키만 false.
  function ctrlEnterNewlineData(entry) {
    // Gajae TUI 는 \x1b\r 을 Alt+Enter(queue) 로 볼 수 있다. 줄바꿈은 raw LF 를 사용한다.
    // Claude/OpenCode 는 기존 Windows Terminal 정합 시퀀스(\x1b\r)를 유지한다.
    return entry && entry.agent === 'gajae' ? '\n' : '\x1b\r';
  }

  function handleKey(e, entry, roomId) {
    if (e.type !== 'keydown') return true;
    // Ctrl+Enter: 줄바꿈 삽입(제출 X). 조합 중에도 동작해야 한다 — 단, isComposing 가드보다
    // 먼저 처리하되 조합 중이면 줄바꿈을 compositionend 로 미룬다. (먼저 보내면 줄바꿈이
    // 조합 글자 확정보다 앞서 PTY에 도달해 마지막 글자가 새 줄로 따라 내려간다.)
    if (e.ctrlKey && !e.shiftKey && !e.altKey &&
        (e.code === 'Enter' || e.code === 'NumpadEnter' || e.key === 'Enter' || e.keyCode === 13)) {
      if (entry.dead) return true;
      e.preventDefault();
      if (e.isComposing || e.keyCode === 229) {
        // 조합 중 — 글자 확정(compositionend) 후 줄바꿈 전송. keydown 2번째(확정 Enter) 흡수 준비.
        pendingComposeNewline = { roomId: roomId, data: ctrlEnterNewlineData(entry) };
        composeEnterAt = Date.now();
        return false;
      }
      // 비조합 Enter — 직전 조합 확정의 트레일링 keydown 이면 흡수(줄바꿈 한 번만 나가게).
      if (Date.now() - composeEnterAt < 200) { composeEnterAt = 0; return false; }
      post({ type: 'input', roomId: roomId, data: ctrlEnterNewlineData(entry) });
      return false;
    }
    if (e.isComposing || e.keyCode === 229) return true; // IME 조합 중엔 개입 금지
    if (e.getModifierState && e.getModifierState('AltGraph')) return true; // AltGr = 문자 입력, 가로채지 않음

    const term = entry.term;
    const ctrl = e.ctrlKey, shift = e.shiftKey, alt = e.altKey;
    const key = e.key;
    const hasSel = term.hasSelection();

    // ── 복사 / 붙여넣기 ──
    // Ctrl+C: 선택이 있으면 복사(+선택 해제), 없으면 그대로 SIGINT 전달 (WT 동작)
    if (ctrl && !shift && !alt && (key === 'c' || key === 'C')) {
      if (hasSel) { e.preventDefault(); doCopy(term); return false; }
      // gjc 는 생성 중 고빈도 풀 재페인트(\x1b[2J)가 xterm 선택을 지운다 → 드래그 직후 Ctrl+C 가
      // 선택을 못 보고 \x03(SIGINT)로 빠져 gjc 가 중단됨. 최근 선택(grace)이 있으면 그걸 복사하고
      // SIGINT 를 억제한다. 한 번 더(또는 grace 밖) 누르면 lastSel 이 비어 정상 인터럽트.
      if (entry.agent === 'gajae' && entry.lastSelText && (Date.now() - entry.lastSelAt) < 800) {
        e.preventDefault();
        post({ type: 'copy', data: entry.lastSelText });
        showCopyToast(Array.from(entry.lastSelText).length);
        entry.lastSelText = '';
        return false;
      }
      return true; // 선택 없음 → \x03(인터럽트) 통과
    }
    // Ctrl+Shift+C / Ctrl+Insert: 복사 (선택이 없으면 가로채지 않고 PTY 로 통과)
    if ((ctrl && shift && !alt && (key === 'c' || key === 'C')) ||
        (ctrl && !shift && !alt && key === 'Insert')) {
      if (hasSel) { e.preventDefault(); doCopy(term); return false; }
      return true;
    }
    // Ctrl+V / Ctrl+Shift+V / Shift+Insert: 붙여넣기 (WT 기본 = Ctrl+V 도 붙여넣기)
    if ((ctrl && !alt && (key === 'v' || key === 'V')) ||
        (shift && !ctrl && !alt && key === 'Insert')) {
      e.preventDefault(); post({ type: 'requestPaste', roomId: roomId }); return false;
    }

    // ── 검색 (Ctrl+Shift+F) ──
    if (ctrl && shift && !alt && (key === 'f' || key === 'F')) {
      e.preventDefault(); openSearch(); return false;
    }
    // ── 전체 선택 (Ctrl+Shift+A) ──
    if (ctrl && shift && !alt && (key === 'a' || key === 'A')) {
      e.preventDefault(); term.selectAll(); return false;
    }

    // ── 폰트 크기 (Ctrl +/-/0) ──
    if (ctrl && !alt) {
      if (key === '=' || key === '+' || key === 'Add')      { e.preventDefault(); post({ type:'action', name:'fontInc' });   return false; }
      if (key === '-' || key === '_' || key === 'Subtract') { e.preventDefault(); post({ type:'action', name:'fontDec' });   return false; }
      if (key === '0')                                       { e.preventDefault(); post({ type:'action', name:'fontReset' }); return false; }
    }

    // ── 스크롤 ──
    if (ctrl && shift && !alt && key === 'ArrowUp')   { e.preventDefault(); term.scrollLines(-1); return false; }
    if (ctrl && shift && !alt && key === 'ArrowDown') { e.preventDefault(); term.scrollLines(1);  return false; }
    if (shift && !alt && key === 'PageUp')   { e.preventDefault(); term.scrollPages(-1); return false; }
    if (shift && !alt && key === 'PageDown') { e.preventDefault(); term.scrollPages(1);  return false; }
    if (ctrl && shift && !alt && key === 'Home') { e.preventDefault(); term.scrollToTop();    return false; }
    if (ctrl && shift && !alt && key === 'End')  { e.preventDefault(); term.scrollToBottom(); return false; }

    // ── 세션(탭) 관리 — C# 으로 위임 ──
    if (ctrl && shift && !alt && (key === 't' || key === 'T' || key === 'd' || key === 'D')) {
      e.preventDefault(); post({ type:'action', name:'newSession' }); return false;
    }
    if (ctrl && shift && !alt && (key === 'w' || key === 'W')) {
      e.preventDefault(); post({ type:'action', name:'closeSession' }); return false;
    }
    if (ctrl && !alt && key === 'Tab') {
      e.preventDefault(); post({ type:'action', name: shift ? 'prevSession' : 'nextSession' }); return false;
    }
    // Ctrl+Alt+1..9: N번째 세션 직접 이동 (9 = 마지막) — WT switchToTab 정합.
    // 레이아웃 비의존을 위해 물리 키(e.code=Digit1..9) 기준. (AltGr 입력은 위에서 이미 통과)
    if (ctrl && alt && !shift && /^Digit[1-9]$/.test(e.code)) {
      const n = +e.code.slice(5);
      e.preventDefault();
      post({ type:'action', name:'gotoSession', index: n === 9 ? -1 : (n - 1) });
      return false;
    }

    return true;
  }

  // 복사 토스트 — claude 의 "copied N chars to clipboard" 와 동일 문구/위치. gjc·셸 등 우리가
  // 직접 복사하는 경로에서만 표시(claude 네이티브 복사는 OSC52 라 여기 안 탐 → 중복 없음).
  const copyToastEl = document.getElementById('copy-toast');
  let copyToastTimer = 0;
  function showCopyToast(n) {
    if (!copyToastEl || !n) return;
    copyToastEl.textContent = 'copied ' + n + ' chars to clipboard';
    copyToastEl.classList.add('on');
    clearTimeout(copyToastTimer);
    copyToastTimer = setTimeout(function () { copyToastEl.classList.remove('on'); }, 1400);
  }

  function doCopy(term) {
    const sel = term.getSelection();
    if (sel) { post({ type: 'copy', data: sel }); showCopyToast(Array.from(sel).length); }
    term.clearSelection();
  }

  // copy-on-select: 선택이 있으면 복사하되 선택은 유지(무엇을 복사했는지 보이게). Ctrl+C 와 달리 clear 안 함.
  function doCopyKeep(term) {
    const sel = term.getSelection();
    if (sel) { post({ type: 'copy', data: sel }); showCopyToast(Array.from(sel).length); }
  }

  // ── 검색바 ──────────────────────────────────────────────────────────
  const searchBar   = document.getElementById('search-bar');
  const searchInput = document.getElementById('search-input');
  const searchCount = document.getElementById('search-count');
  const SEARCH_OPTS = {
    decorations: {
      matchOverviewRuler: '#7a7a32', activeMatchColorOverviewRuler: '#d8b400',
      matchBackground: '#5a4a00', activeMatchBackground: '#c8a000',
    },
  };

  function openSearch() {
    searchBar.classList.add('open');
    searchInput.focus();
    searchInput.select();
    if (searchInput.value) runSearch('next');
  }
  function closeSearch() {
    searchBar.classList.remove('open');
    const a = terms[activeRoomId];
    if (a) { try { a.search.clearDecorations(); } catch (e) {} a.term.focus(); }
  }
  function runSearch(dir) {
    const a = terms[activeRoomId];
    if (!a) return;
    const q = searchInput.value;
    if (!q) { a.search.clearDecorations(); searchCount.textContent = ''; return; }
    if (dir === 'prev') a.search.findPrevious(q, SEARCH_OPTS);
    else                a.search.findNext(q, SEARCH_OPTS);
  }
  function updateSearchCount(r) {
    if (!r || r.resultCount === undefined) { searchCount.textContent = ''; return; }
    if (r.resultCount < 0) { searchCount.textContent = '많음'; return; }
    if (r.resultCount === 0) { searchCount.textContent = '0/0'; return; }
    searchCount.textContent = (r.resultIndex >= 0 ? r.resultIndex + 1 : 0) + '/' + r.resultCount;
  }

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter')       { e.preventDefault(); runSearch(e.shiftKey ? 'prev' : 'next'); }
    else if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
  });
  searchInput.addEventListener('input', function () { runSearch('next'); });
  document.getElementById('search-next').addEventListener('click', function () { runSearch('next'); searchInput.focus(); });
  document.getElementById('search-prev').addEventListener('click', function () { runSearch('prev'); searchInput.focus(); });
  document.getElementById('search-close').addEventListener('click', closeSearch);

  // ── Ctrl+휠: 폰트 확대/축소 (WT 정합). capture+passive:false 로 xterm 스크롤보다 먼저 가로챔 ──
  document.addEventListener('wheel', function (e) {
    if (e.getModifierState && e.getModifierState('AltGraph')) return;
    if (!e.target || !e.target.closest) return;
    var inTerm = e.target.closest('.term-container');
    if (!inTerm) return; // 터미널 위에서만(검색창 제외)

    if (e.ctrlKey && !e.altKey && !e.shiftKey && e.deltaY !== 0) {
      e.preventDefault();
      post({ type: 'action', name: e.deltaY < 0 ? 'fontInc' : 'fontDec' });
      return;
    }
    // 사용자가 휠로 직접 스크롤 → 프로그램적 스크롤 억제(_scrollSuppress)를 즉시 해제.
    // (/model·/effort 후 남은 잔여 suppress 카운트가 사용자의 스크롤을 되돌리는 것 방지.)
    _scrollSuppress = 0;
    // 일반 휠은 xterm 기본 동작(스크롤백 스크롤)에 맡긴다. gjc 는 풀 재페인트의 스크롤백
    // 클리어(CSI 3 J)를 파서에서 삼켜 스크롤백을 보존하므로 휠로 과거 대화를 스크롤할 수 있다.

    // 아래로 굴려 바닥 근처까지 내려오면 ybase 로 스냅 — idle 상태에서 위로 올렸다 내려올 때
    // xterm 줄 스냅이 1~3줄 모자라 입력창이 잘리는 현상 방지(휠론 ybase 에 정확히 못 닿음).
    // 아래 방향(deltaY>0)일 때만 개입 → 위로 읽는 중엔 절대 끌어내리지 않는다.
    if (e.deltaY > 0) {
      const t = activeRoomId ? terms[activeRoomId] : null;
      const vp = t && t.term.element && t.term.element.querySelector('.xterm-viewport');
      if (vp) requestAnimationFrame(function () {
        const cell = (vp.clientHeight / t.term.rows) || 16;
        const rest = vp.scrollHeight - vp.clientHeight - vp.scrollTop;
        // 바닥 근처면 nudge(위 1줄→맨 아래)로 스냅 — 단순 scrollToBottom 은 gjc 인라인
        // TUI 에서 ybase 에 1~3줄 못 닿아 입력창이 잘림. 위로 1줄 굴려 강제 리렌더 후 붙인다.
        if (rest > 0 && rest <= cell * 6) {
          try { t.term.scrollLines(-1); } catch (e) {}
          requestAnimationFrame(function () { try { t.term.scrollToBottom(); } catch (e) {} });
        }
      });
    }
  }, { passive: false, capture: true });

  // WebView2 는 별도 HWND 라 WPF 부모의 PreviewMouseDown 이 터미널 클릭을 보지 못한다.
  // 터미널을 클릭하면 호스트 패널을 포커스 패널로 승격해 사이드바/파일탐색기 선택을 맞춘다.
  // ── 우클릭: 누르는 즉시(mousedown) 선택 있으면 복사, 없으면 붙여넣기 — Windows Terminal 정합 ──
  // 누름 시점 1회 처리 → 빠른 클릭·꾹 눌러도 즉시 붙여넣기, 뗄 때 추가 붙여넣기 없음.
  // (우버튼 SGR 마우스 리포트는 onData 에서 걸러 TUI 의 자체 붙여넣기 중복을 막는다)
  document.addEventListener('mousedown', function (e) {
    post({ type: 'interact' });
    if (e.button !== 2) return;
    const t = activeRoomId ? terms[activeRoomId] : null;
    if (!t || t.dead) return;
    if (t.term.hasSelection()) { doCopy(t.term); return; }
    post({ type: 'requestPaste', roomId: activeRoomId });
  }, { capture: true });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function createTerm(roomId, agent) {
    const el = document.createElement('div');
    el.className = 'term-container' + (agent ? ' agent-' + agent : '');
    document.body.appendChild(el);

    const term = new Terminal({
      theme: themeFor(agent),
      // 한글 폴백: 기본 모노스페이스 폰트에는 한글 글리프가 없어 IME 조합 표시가 깨진다
      fontFamily: cfg.fontFamily + ", Cascadia Mono, Consolas, 'D2Coding', 'NanumGothicCoding', 'Malgun Gothic', monospace",
      fontSize: cfg.fontSize,
      cursorBlink: true,
      allowProposedApi: true,
      scrollback: 5000,
      // ConPTY 백엔드 명시 → Windows 줄바꿈/와이드(CJK) 문자 휴리스틱 적용
      windowsPty: { backend: 'conpty', buildNumber: cfg.windowsBuild || 0 },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    const search = new SearchAddon.SearchAddon();
    term.loadAddon(search);
    term.open(el);

    const entry = { term, fit, el, search, webgl: null, agent: agent || '', dead: false, ro: null, inSync: false, syncChunks: [], syncCarry: null, lastSelText: '', lastSelAt: 0, needCreate: false };
    terms[roomId] = entry;

    // WebGL 렌더러(GPU) — 글자 그리기를 CPU(DOM) 대신 GPU 로 올려 활성 탭 렌더 비용을 낮춘다(WT 정합).
    // 원격/소프트웨어 렌더링(enableWebgl=false)에선 SwiftShader 로 오히려 느려져 비활성화한다.
    // GPU 컨텍스트 로스(드라이버 리셋/탭 과다) 시 dispose → xterm 기본 DOM 렌더러로 자동 폴백.
    // 소수 배율(125/150% 등)에선 WebGL 커서 렌더 버그가 있어 DOM 렌더러를 쓴다(위 disposeWebglIfFractional 참고).
    if (cfg.enableWebgl && !fractionalDpr() && typeof WebglAddon !== 'undefined') {
      try {
        const webgl = new WebglAddon.WebglAddon();
        webgl.onContextLoss(function () { try { webgl.dispose(); } catch (e) {} entry.webgl = null; });
        term.loadAddon(webgl);
        entry.webgl = webgl;
      } catch (e) { /* WebGL 미지원 환경 → DOM 렌더러 유지 */ }
    }

    // ── 파일경로 링크: 터미널 출력에서 파일 경로를 Ctrl+클릭 → 에디터 탭으로 열기 ──
    try {
      term.registerLinkProvider({
        provideLinks: function (line, callback) {
          var text = term.buffer.active.getLine(line)?.translateToString();
          if (!text) { callback(undefined); return; }

          var re = /[\w\-.]*(?:[\/\\][\w\-.]+)+\.(md|markdown|cs|ts|tsx|js|jsx|py|go|rs|java|kt|kts|swift|rb|php|c|cpp|cc|h|hpp|m|mm|dart|lua|r|pl|sh|bash|zsh|ps1|psm1|bat|cmd|sql|json|xml|yaml|yml|toml|ini|conf|cfg|config|properties|csv|log|txt|html|htm|css|scss|less|vue|svelte|xaml|razor|cshtml|vb|fs|gradle|groovy|scala|sln|csproj|props|targets|gitignore|editorconfig|env|dockerfile|makefile)/gi;
          var links = [];
          var match;
          while ((match = re.exec(text)) !== null) {
            let path = match[0];
            if (/^[\s.]+$/.test(path)) continue;
            let startCol = match.index;
            let endCol = match.index + path.length - 1;
            links.push({
              range: [startCol, endCol],
              text: path,
              activate: function (e, uri) {
                if (!e.ctrlKey && !e.metaKey) return;
                post({ type: 'openFile', path: path });
              }
            });
          }
          callback(links.length > 0 ? { links: links } : undefined);
        }
      });
    } catch (e) { /* linkProvider 미지원 xterm 버전 */ }

    // OSC 52 클립보드 쓰기 — claude/gjc 등 TUI 가 마우스 선택 후 "ESC]52;c;<base64>" 로 복사하면
    // (우측 하단 "copied N chars" 토스트) 이를 실제 Windows 클립보드에 반영한다. 번들 xterm 은
    // OSC 52 를 기본 무시(토스트만 뜨고 클립보드 미기록 = WT 와 달리 복사 안 됨)하므로 직접 처리.
    // 클립보드 '읽기' 질의(payload '?')는 보안상 무시하고 '쓰기'만 honor 한다.
    try {
      term.parser.registerOscHandler(52, function (raw) {
        const semi = raw.indexOf(';');
        const payload = semi === -1 ? raw : raw.slice(semi + 1);
        if (!payload || payload === '?') return true;
        try {
          const bin = atob(payload);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const text = new TextDecoder('utf-8').decode(bytes);
          if (text) post({ type: 'copy', data: text });
        } catch (e) { /* base64/디코드 실패 무시 */ }
        return true; // 처리됨 — xterm 기본 무시 동작 차단
      });
    } catch (e) { /* 구버전 등 parser 미지원 시 무시 */ }

    // gjc 드래그 선택/복사 — gjc(tui)는 마우스 트래킹(?1000;?1006)을 무조건 켜는데 자체 텍스트
    // 선택 렌더는 없다(WT 의 하이라이트는 WT 자체 로컬 선택). xterm 은 앱 마우스 모드면 드래그를
    // 앱으로 넘기고 로컬 선택을 안 해 → gjc 에선 하이라이트도 복사도 안 된다. gjc 방에 한해 마우스
    // 모드 진입 DECSET 을 파서 단계에서 삼켜(xterm 이 무시) 항상 xterm 로컬 선택을 쓰게 한다
    // → 드래그 하이라이트 + copy-on-select 복사. 휠 스크롤은 xterm 스크롤백이 처리.
    if ((agent || '') === 'gajae') {
      const MOUSE_MODES = [1000, 1001, 1002, 1003, 1005, 1006, 1015, 1016];
      const swallowMouse = function (params) {
        const arr = params && params.params ? params.params : params;
        const len = params && params.length !== undefined ? params.length : (arr ? arr.length : 0);
        for (let i = 0; i < len; i++) if (MOUSE_MODES.indexOf(arr[i]) !== -1) return true; // 삼킴
        return false; // 마우스 외 DECSET(?2004/?2026/?25/?1049 등)은 xterm 기본 처리로 통과
      };
      // 스크롤백 클리어(CSI 3 J) 삼킴 — gjc 는 멀티플렉서가 아니면 풀 재페인트 때 \x1b[3J 로
      // 스크롤백을 비운다. 이게 첫 휠 시 뷰포트를 맨 위로 튕기고 과거 대화 스크롤을 지운다.
      // param==3 만 삼키고 ED 0/1/2(화면 지움)는 xterm 기본 처리로 통과 → 스크롤백 보존.
      const swallowScrollbackClear = function (params) {
        const arr = params && params.params ? params.params : params;
        const len = params && params.length !== undefined ? params.length : (arr ? arr.length : 0);
        for (let i = 0; i < len; i++) if (arr[i] === 3) return true; // 삼킴
        return false; // ED 0/1/2 통과
      };
      try {
        term.parser.registerCsiHandler({ prefix: '?', final: 'h' }, swallowMouse);
        term.parser.registerCsiHandler({ prefix: '?', final: 'l' }, swallowMouse);
        term.parser.registerCsiHandler({ final: 'J' }, swallowScrollbackClear);
      } catch (e) { /* parser 미지원 무시 */ }
    }

    // 컨테이너 실제 픽셀 박스가 바뀔 때마다 재-fit. window resize 만으로는
    // WebView2 HWND 크기는 그대로인데 CSS 박스만 변하는 경우(시작 시 레이아웃이
    // 최종 폭에 닿기 전 fit, 폰트 로드 후 셀 폭 재계산, 패널 토글 등)를 놓쳐
    // 그리드가 컨테이너보다 좁게 굳는다 → 오른쪽에 빈 띠가 남는다.
    // 컨테이너 픽셀 박스가 바뀔 때마다 다음 프레임에 재-fit (스플리터 드래그 시 실시간 추종).
    let roPending = false;
    const ro = new ResizeObserver(function () {
      if (roomId !== activeRoomId) return;          // 비활성 방은 0폭 → fit 금지
      if (_fitSuppressed) return;                   // 전환 중 — 중간 폭 fit 억제(reveal 이 최종 폭에서 fit)
      if (el.clientWidth < 2 || el.clientHeight < 2) return;
      if (roPending) return;
      roPending = true;
      requestAnimationFrame(function () {
        roPending = false;
        if (roomId === activeRoomId) { try { entry.fit.fit(); } catch (e) {} }
      });
    });
    ro.observe(el);
    entry.ro = ro;

    setupImeCaretFix(term, el);
    term.attachCustomKeyEventHandler(function (e) { return handleKey(e, entry, roomId); });

    // 마지막 비어있지 않은 선택을 기억(텍스트+시각) — gjc 재페인트가 선택을 지운 직후의
    // Ctrl+C 복사 grace 판정에 쓴다(handleKey 참고). 빈 선택(clear)일 땐 갱신 안 해 보존.
    try {
      term.onSelectionChange(function () {
        const s = term.getSelection();
        if (s) { entry.lastSelText = s; entry.lastSelAt = Date.now(); }
      });
    } catch (e) {}

    // copy-on-select: 드래그 선택(마우스 뗄 때) 자동 복사 → Ctrl+C 없이 복사. xterm 이 선택을
    // 확정한 뒤 읽도록 다음 프레임에 조회. (TUI 마우스 모드에선 Shift+드래그로 선택해야 함)
    el.addEventListener('mouseup', function () {
      if (entry.dead) return;
      setTimeout(function () { if (term.hasSelection()) doCopyKeep(term); }, 0);
    });

    // 검색 결과 카운트 갱신 — 활성 방일 때만 검색바에 반영
    try {
      search.onDidChangeResults(function (r) {
        if (roomId === activeRoomId && searchBar.classList.contains('open')) updateSearchCount(r);
      });
    } catch (e) {}

    term.onData(function (data) {
      if (entry.dead) {
        if (data === '\r') post({ type: 'restart', roomId: roomId }); // Enter로 재시작
        return;
      }
      // 우클릭은 호스트에서 복사/붙여넣기로 처리한다. 마우스 트래킹(TUI) 모드에선 xterm 이
      // 우버튼 SGR 리포트(ESC[<2..M/m)도 PTY 로 보내는데, claude 등 TUI 가 이를 받아 자체
      // 붙여넣기를 또 수행 → 붙여넣기 2회. 우버튼 리포트만 걸러 PTY 로 전달하지 않는다.
      // (b&3)===2 = 우버튼, b<64 = 휠 제외. 좌/중/휠/모션은 그대로 전달(선택 등 보존).
      if (data.indexOf('\x1b[<') !== -1) {
        data = data.replace(/\x1b\[<(\d+);\d+;\d+[Mm]/g, function (seq, b) {
          b = +b; return ((b & 3) === 2 && b < 64) ? '' : seq;
        });
        if (!data) return;
      }
      post({ type: 'input', roomId: roomId, data: data });
    });
    term.onResize(function (size) {
      post({ type: 'resize', roomId: roomId, cols: size.cols, rows: size.rows });
      // fit 으로 그리드가 바뀌면 스크롤백이 리플로우되며 스크롤이 점프한다. pin 윈도우(인라인 TUI resume)
      // 동안엔 리사이즈 후에도 맨 아래로 고정해 위/아래 튐을 막는다.
      if (Date.now() < _pinBottomUntil)
        requestAnimationFrame(function () { try { term.scrollToBottom(); } catch (e) {} });
    });
    return entry;
  }

  function show(roomId, agent) {
    let entry = terms[roomId];
    const isNew = !entry;
    if (isNew) entry = createTerm(roomId, agent);

    if (searchBar.classList.contains('open')) closeSearch(); // 방 전환 시 검색바 닫기
    for (const id in terms) terms[id].el.classList.toggle('active', id === roomId);
    activeRoomId = roomId;
    // returnResync 가 다른 방 전환으로 중단돼 투명(opacity:0)하게 남았을 수 있음 — 표시 시 복원.
    entry.el.style.transition = 'none';
    entry.el.style.opacity = '';

    if (!_fitSuppressed) entry.fit.fit(); // 전환(커버) 중이면 중간 폭 fit 억제 → reveal 이 최종 폭에서 fit
    entry.term.focus();
    if (isNew) {
      if (_fitSuppressed) {
        // 전환 중 — ConPTY 생성을 reveal(최종 폭 확정)로 미룬다. 지금 만들면 중간(전체) 폭으로 만들어져
        // claude 등이 그 폭으로 히스토리를 그렸다가 최종 폭으로 리플로우돼 깨진다(좌측 세션 깨짐의 실제 원인).
        entry.needCreate = true;
      } else {
        // C#이 이 크기로 ConPTY 세션을 만든다
        post({ type: 'created', roomId: roomId, cols: entry.term.cols, rows: entry.term.rows });
      }
    }
    // 웹폰트(터미널 폰트)가 늦게 로드되면 셀 폭이 바뀌어 그리드가 컨테이너보다
    // 좁아질 수 있다 — 로드 완료 후 한 번 더 fit (ResizeObserver 는 컨테이너 박스가
    // 안 변하면 안 뜨므로 폰트 로드는 별도로 처리).
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        if (_fitSuppressed) return; // 전환 중 — reveal 이 최종 폭에서 fit
        if (roomId === activeRoomId && terms[roomId]) { try { terms[roomId].fit.fit(); } catch (e) {} }
      });
    }
    // 지연 재-fit: 분할 패널 재진입/토글처럼 show 시점엔 WebView2 컨테이너가 아직 최종
    // 픽셀 폭에 도달하지 않은 경우, 위 첫 fit 은 잘못된(좁은) cols 로 굳어 내용이 오른쪽에서
    // 잘려 보인다. 레이아웃이 안정된 다음 프레임/짧은 지연 후 다시 측정해 fit 하면 실제 폭으로
    // 교정되고, onResize 가 정확한 크기를 ConPTY 로 보내 alt-screen TUI(claude 등)가 풀폭 재렌더한다.
    refitSoon(roomId);
  }

  // show/재진입 직후 레이아웃이 안정되길 기다려 여러 번 재측정 fit. 활성 방일 때만.
  function refitSoon(roomId) {
    function tryFit() {
      const t = terms[roomId];
      if (!t || roomId !== activeRoomId) return;
      if (_fitSuppressed) return;                                // 전환 중 — reveal 이 최종 폭에서 fit
      if (t.el.clientWidth < 2 || t.el.clientHeight < 2) return; // 아직 0폭이면 다음 타이밍에
      try { t.fit.fit(); } catch (e) {}
    }
    requestAnimationFrame(function () { requestAnimationFrame(tryFit); });
    setTimeout(tryFit, 60);
    setTimeout(tryFit, 180);
  }

  // 화면에 표시하지 않고 xterm 인스턴스+ConPTY 세션만 미리 생성(백그라운드 로드).
  // 컨테이너는 display:none(.active 없음) 상태라 xterm 기본 크기(80x24)로 만들고,
  // 실제 크기 보정(fit→resize)은 나중에 show 될 때 일어난다.
  function preload(roomId, agent) {
    if (terms[roomId]) return; // 이미 생성됨
    const entry = createTerm(roomId, agent);
    post({ type: 'created', roomId: roomId, cols: entry.term.cols, rows: entry.term.rows });
  }

  // 소수 배율(devicePixelRatio 가 정수 아님 — 예: 125%→1.25, 150%→1.5)에선 xterm WebGL
  // 렌더러가 셀 픽셀 위치를 잘못 반올림해 커서가 입력 위치에서 사라지고 텍스트 위에 얇은
  // 가로선으로 깜빡이는 아티팩트가 생긴다(특히 전체화면). DOM 렌더러는 소수 배율을 정상
  // 처리하므로, 이 경우 WebGL 을 dispose 해 DOM 렌더러로 폴백한다.
  function fractionalDpr() { return !Number.isInteger(window.devicePixelRatio); }

  function disposeWebglIfFractional(entry) {
    if (entry && entry.webgl && fractionalDpr()) {
      try { entry.webgl.dispose(); } catch (e) {}
      entry.webgl = null; // → 이후 xterm 기본 DOM 렌더러
    }
  }

  // 배율 변경 감지(다른 배율 모니터로 이동/배율 조정). matchMedia 는 1회성이라 발화마다 재구독.
  function watchDevicePixelRatio() {
    const mq = window.matchMedia('(resolution: ' + window.devicePixelRatio + 'dppx)');
    const onChange = function () {
      for (const id in terms) disposeWebglIfFractional(terms[id]);
      if (activeRoomId && terms[activeRoomId]) { try { terms[activeRoomId].fit.fit(); } catch (e) {} }
      watchDevicePixelRatio(); // 새 배율 기준으로 재구독
    };
    try { mq.addEventListener('change', onChange, { once: true }); }
    catch (e) { try { mq.addListener(onChange); } catch (e2) {} }
  }
  watchDevicePixelRatio();

  window.addEventListener('resize', function () {
    if (activeRoomId && terms[activeRoomId]) terms[activeRoomId].fit.fit();
  });

  window.chrome.webview.addEventListener('message', function (e) {
    const msg = e.data;
    switch (msg.type) {
      case 'init':
        cfg = { theme: msg.theme, fontFamily: msg.fontFamily, fontSize: msg.fontSize, windowsBuild: msg.windowsBuild, enableWebgl: !!msg.enableWebgl };
        document.body.style.background = msg.theme.background || '#0C0C0C';
        // IME 조합 글자(composition-view)가 body 폰트를 상속 — 명시적으로 일치시킴
        document.body.style.fontFamily = msg.fontFamily + ", Cascadia Mono, Consolas, 'D2Coding', 'NanumGothicCoding', 'Malgun Gothic', monospace";
        document.body.style.fontSize = msg.fontSize + 'px';
        // 조합 글자 위치가 입력 박스를 따라가지 않도록 CSS 변수 설정
        document.documentElement.style.setProperty('--term-bg', msg.theme.background || '#0C0C0C');
        document.documentElement.style.setProperty('--term-fg', msg.theme.foreground || '#CCCCCC');
        if (msg.accent) document.documentElement.style.setProperty('--term-accent', msg.accent);
        break;
      case 'theme':
        // 라이브 테마 전환 — 열린 모든 xterm 의 색을 갱신하고 CSS 변수·body 배경도 맞춘다
        cfg.theme = msg.theme;
        for (const id in terms) {
          const ent = terms[id];
          if (ent && ent.term) {
            const tObj = themeFor(ent.agent); // gjc 는 selectionBackground 오버라이드 유지
            try { ent.term.setOption('theme', tObj); } catch (e) { ent.term.options.theme = tObj; }
            // 기존 셀까지 새 색으로 다시 칠하도록 강제 리프레시
            try { ent.term.refresh(0, ent.term.rows - 1); } catch (e) {}
          }
        }
        document.body.style.background = msg.theme.background || '#0C0C0C';
        document.documentElement.style.setProperty('--term-bg', msg.theme.background || '#0C0C0C');
        document.documentElement.style.setProperty('--term-fg', msg.theme.foreground || '#CCCCCC');
        if (msg.accent) document.documentElement.style.setProperty('--term-accent', msg.accent);
        break;
      case 'suppressScroll':
        // 프로그램적 입력(/model·/effort) 후 몇 번의 출력 쓰기 동안 스크롤 위치 유지.
        // 출력이 카운트보다 적게 와 잔여가 남으면 나중 스크롤을 되돌리므로 1.5s 후 강제 0.
        _scrollSuppress = msg.count || 5;
        clearTimeout(_scrollSuppressTimer);
        _scrollSuppressTimer = setTimeout(function () { _scrollSuppress = 0; }, 1500);
        break;
      case 'pinBottom':
        _pinBottomUntil = Date.now() + (msg.ms || 2000);
        break;
      case 'xferCover': {
        // 분할 열림/닫힘·프로젝트 전환 직전: 단색 커튼으로 즉시 덮어 이후 리사이즈/전환 깜빡임을 감춘다.
        // 새 세대(_xferGen)를 부여해, 아직 안 끝난 이전 전환의 지연 타이머(fade 등)를 무효화한다.
        const gen = ++_xferGen;
        _fitSuppressed = true; // 전환 동안 중간(전체) 폭 fit 억제 — reveal 이 최종 폭에서 한 번만 fit
        const cov = document.getElementById('xfer-cover');
        cov.style.transition = 'none';
        cov.style.display = 'block';
        cov.style.opacity = '1';
        clearTimeout(_xferCoverTimer);
        _xferCoverTimer = setTimeout(function () { // 안전장치: reveal 이 안 와도 2s 뒤 자동 해제
          if (gen !== _xferGen) return;            // 더 최근 전환이 시작됨 — 무시
          _fitSuppressed = false;
          var a = activeRoomId ? terms[activeRoomId] : null; // 미뤄둔 ConPTY 생성 폴백
          if (a && a.needCreate) { a.needCreate = false; try { a.fit.fit(); } catch (e) {} post({ type: 'created', roomId: activeRoomId, cols: a.term.cols, rows: a.term.rows }); }
          cov.style.transition = 'opacity 0.14s ease'; cov.style.opacity = '0';
          setTimeout(function () { if (gen === _xferGen) cov.style.display = 'none'; }, 200);
        }, 2000);
        break;
      }
      case 'xferReveal': {
        // 폭이 '안정된 최종 값'이 될 때까지 기다렸다가(=전체→절반 전환의 중간 전체폭은 건너뜀) fit 억제를
        // 풀고 한 번만 fit 한다 → TUI 가 최종 폭에서만 그려 리플로우 깨짐이 없다. 이후 커튼 fade-out.
        // gen 검사: 이 reveal 이 속한 전환이 아직 최신일 때만 진행(빠른 재전환 시 낡은 타이머 폐기).
        clearTimeout(_xferCoverTimer);
        const gen = _xferGen; // 직전 xferCover 와 같은 세대
        const cov = document.getElementById('xfer-cover');
        const room = msg.roomId;
        const kick = !!msg.kick;
        const expectW = msg.expectWidth || 0; // C# 이 확정한 최종 목표 폭(px). clientWidth 가 여기 근접할 때까지 대기.
        const fadeOut = function () {
          if (gen !== _xferGen) return;
          requestAnimationFrame(function () {
            if (gen !== _xferGen) return;
            cov.style.transition = 'opacity 0.14s ease';
            cov.style.opacity = '0';
            setTimeout(function () { if (gen === _xferGen) cov.style.display = 'none'; }, 200);
          });
        };
        const finish = function (e) {
          _fitSuppressed = false;                 // 억제 해제 후 최종 폭에서 한 번만 fit
          try { e.fit.fit(); } catch (err) {}
          if (e.needCreate) {
            // 미뤄둔 ConPTY 생성을 지금(최종 폭)에서 수행 → claude 가 처음부터 최종 폭으로 그려 리플로우 없음.
            e.needCreate = false;
            post({ type: 'created', roomId: room, cols: e.term.cols, rows: e.term.rows });
          } else if (kick && e.term.cols > 2 && e.term.rows > 1) {
            // 재배선 세션(분할 보기): ConPTY 를 xterm 현재 크기로 강제 재동기(xterm 미변경 → 스크롤백
            // 리플로우 없음). 늦게 오는 WireSession resize 와의 경쟁에서 이 값이 마지막이 되고 SIGWINCH 로 재렌더.
            post({ type: 'resize', roomId: room, cols: e.term.cols, rows: e.term.rows });
          }
          setTimeout(fadeOut, 80);
        };
        let waited = 0;
        const step = function () {
          if (gen !== _xferGen) return;                             // 더 최근 전환 시작 — 폐기(커버 유지)
          const e = room ? terms[room] : null;
          if (!e || room !== activeRoomId) {                        // 세션없음/방전환 — 억제 풀고 걷기
            _fitSuppressed = false;
            if (e && e.needCreate) { e.needCreate = false; try { e.fit.fit(); } catch (err) {} post({ type: 'created', roomId: room, cols: e.term.cols, rows: e.term.rows }); } // 미생성 세션 폴백 생성
            fadeOut(); return;
          }
          const w = e.el.clientWidth;
          // clientWidth 가 C# 목표 폭(expectW)에 근접(±20%)했는지 — 근접해야 '최종 폭 도달'로 본다.
          // 전체폭→절반 전환 중 HWND 가 아직 전체폭이면 목표(절반)와 크게 달라 여기서 대기 → 중간 전체폭 fit 회피.
          const near = expectW <= 10 ? (w >= 2) : (w >= 2 && Math.abs(w - expectW) <= expectW * 0.2);
          if ((w < 2 || e.el.clientHeight < 2 || !near) && waited < 1500) {
            waited += 40; setTimeout(step, 40); return;
          }
          finish(e);                                                // 목표 폭 도달(또는 폴백) — 억제 해제 후 fit
        };
        step();
        break;
      }
      case 'returnResync': {
        // Collapsed 였다 되살아난(preserve) 패널: 틀어진 중간 프레임을 안 보이게 컨테이너를 잠깐 투명
        // (opacity:0, 아래 body 배경색=--term-bg 만 노출)으로 덮은 뒤, 폭이 최종값으로 확정될 때까지 기다려
        // fit + resize-kick(cols-1→cols)으로 ConPTY 를 xterm 의 실제 cols 로 재동기(SIGWINCH→TUI 재렌더)하고,
        // 안정되면 부드럽게 fade-in 한다. gen 검사로 빠른 재전환 시 낡은 타이머를 폐기(폐기 시 opacity 복원).
        const gen = ++_xferGen;
        const room = msg.roomId || activeRoomId;
        const first = terms[room];
        if (!first) break;
        first.el.style.transition = 'none';
        first.el.style.opacity = '0';
        const reveal = function (e) {
          requestAnimationFrame(function () {
            if (gen !== _xferGen) return;
            e.el.style.transition = 'opacity 0.12s ease';
            e.el.style.opacity = '1';
          });
        };
        let waited = 0, kicks = 0;
        const step = function () {
          if (gen !== _xferGen) { first.el.style.transition = 'none'; first.el.style.opacity = ''; return; } // 재전환 — 복원 후 폐기
          const e = terms[room];
          if (!e || room !== activeRoomId) { first.el.style.opacity = ''; return; } // 다른 방 전환 — 복원(show 도 복원)
          if (e.el.clientWidth < 2 || e.el.clientHeight < 2) {  // 아직 최종 폭 미확정 — 잠깐 더 대기
            if (waited < 800) { waited += 40; setTimeout(step, 40); } else reveal(e);
            return;
          }
          try { e.fit.fit(); } catch (err) {}
          const c = e.term.cols, r = e.term.rows;
          if (c > 2 && r > 1) { try { e.term.resize(Math.max(2, c - 1), r); e.term.resize(c, r); } catch (err) {} }
          kicks++;
          if (kicks < 3) { setTimeout(step, 70); } // 폭 확정 후 몇 번 재확정(TUI 재렌더 안정)
          else setTimeout(function () { reveal(e); }, 70);
        };
        step();
        break;
      }
      case 'nudgeScroll': {
        // 재생 후 어긋난 viewport 를 강제 리렌더(위 1줄 → 맨 아래)로 고친다. 사용자가 수동으로
        // 스크롤 올렸다 내리면 정상화되던 것을 자동화 — 인라인 TUI(gjc) resume 직후 호출.
        const t = terms[msg.roomId];
        if (t) {
          try {
            t.term.scrollLines(-1);
            requestAnimationFrame(function () { try { t.term.scrollToBottom(); } catch (e) {} });
          } catch (e) {}
        }
        break;
      }
      case 'show':
        show(msg.roomId, msg.agent);
        break;
      case 'preload':
        preload(msg.roomId, msg.agent);
        break;
      case 'output': {
        const t = terms[msg.roomId];
        if (t) {
          // 동기화 업데이트(?2026) 구간을 한 번의 write 로 모아 흘려 입력창 튐을 막는다.
          // pin/suppress 정책은 flush 시점(writeOut)에 적용.
          feedSync(t, b64ToBytes(msg.data), function (out) { writeOut(t, out); });
        }
        break;
      }
      case 'exited': {
        const t = terms[msg.roomId];
        if (t && !t.dead) {
          t.dead = true;
          t.term.write('\r\n\x1b[90m[세션 종료됨 — Enter로 재시작]\x1b[0m\r\n');
        }
        break;
      }
      case 'restarted': {
        const t = terms[msg.roomId];
        if (t) {
          t.dead = false;
          t.inSync = false; t.syncChunks = []; t.syncCarry = null; // 잔여 sync 버퍼 폐기
          t.term.reset();
          t.fit.fit();
          post({ type: 'resize', roomId: msg.roomId, cols: t.term.cols, rows: t.term.rows });
        }
        break;
      }
      case 'loading': {
        // 세션 로딩 스피너 토글(테마 재시작·세션 진입 중). 웹 레이어라 터미널 위에 항상 보인다.
        document.getElementById('loading-overlay').classList.toggle('on', !!msg.on);
        break;
      }
      case 'focus': {
        const t = terms[msg.roomId || activeRoomId];
        if (t) t.term.focus();
        break;
      }
      case 'paste': {
        const t = terms[msg.roomId || activeRoomId];
        if (t && !t.dead) t.term.paste(msg.data || '');
        break;
      }
      case 'adjustFontSize': {
        cfg.fontSize = msg.size;
        const active = terms[activeRoomId];
        if (active) {
          active.term.options.fontSize = msg.size;
          active.fit.fit();
        }
        break;
      }
      case 'dispose': {
        // 방 삭제 시 — xterm 인스턴스·DOM·버퍼 해제 (메모리 회수)
        const t = terms[msg.roomId];
        if (t) {
          try { t.ro && t.ro.disconnect(); } catch (e) {}
          try { t.webgl && t.webgl.dispose(); } catch (e) {} // GPU 컨텍스트 즉시 반납
          try { t.term.dispose(); } catch (e) {}
          try { t.el.remove(); } catch (e) {}
          delete terms[msg.roomId];
          if (activeRoomId === msg.roomId) {
            if (searchBar.classList.contains('open')) { searchBar.classList.remove('open'); searchCount.textContent = ''; }
            activeRoomId = null;
          }
        }
        break;
      }
    }
  });

  post({ type: 'pageReady' });
})();
</script>
</body>
</html>
