<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.min.css">
<style>
  /* 앱 UI 폰트 — 안내 문구를 Pretendard 로 (터미널 모노/Malgun 대신). */
  @font-face {
    font-family: 'Pretendard';
    src: url('Pretendard-Regular.ttf') format('truetype');
    font-weight: 400; font-display: swap;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0C0C0C; }
  .term-container { position: absolute; inset: 0; padding: 6px 0 6px 22px; display: none; }
  .term-container.external-mirror { overflow: hidden; }
  /* Devez Vibe가 마지막 터미널 셀을 자체적으로 보호한다. 호스트에서 우측
     안전영역을 한 번 더 빼면 컴포저 경계가 본문보다 일찍 끝난다. */
  .term-container.agent-devezvibe { padding-bottom: 12px; }
  /* opencode 세션: 좌우 여백을 더 줄인다 — 패딩 0 + 컨테이너 경계를 바깥으로 밀어(좌 8 / 우 17) 여백 제거 */
  .term-container.agent-opencode { padding: 6px 0 12px 0; left: 6px; right: -9px; bottom: -22px; }
  /* 가재코드(gjc) 인라인 TUI — 입력창이 바닥에 딱 붙지 않게 하단 여백 + 우측 여백 8px 확보. */
  .term-container.agent-gajae { padding-bottom: 14px; padding-right: 1px; }
  .term-container.active { display: block; }
  .term-container .xterm { height: 100%; }
  /* Alt 로 xterm 이 column-select 상태를 표시해도, 세션에서는 텍스트 선택 커서를 유지한다. */
  .term-container .xterm.column-select.focus { cursor: default; }
  /* 스크롤바 숨김 (휠 스크롤은 동작) */
  .xterm .xterm-viewport { scrollbar-width: none; }
  .xterm .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; display: none; }
  /* codex·devezvibe(xterm 6.x)는 별도 오버레이 스크롤바를 쓴다. 6.1의 .xterm-scrollbar와
     이전 .scrollbar/.shadow 모두 위 네이티브 스크롤바 숨김 규칙에 안 걸리므로 별도로 숨긴다. */
  /* BEGIN xterm6-scrollbar-hide */
  .term-container.agent-codex .xterm-scrollable-element > .xterm-scrollbar,
  .term-container.agent-codex .xterm-scrollable-element > .scrollbar,
  .term-container.agent-codex .xterm-scrollable-element > .shadow,
  .term-container.agent-devezvibe .xterm-scrollable-element > .xterm-scrollbar,
  .term-container.agent-devezvibe .xterm-scrollable-element > .scrollbar,
  .term-container.agent-devezvibe .xterm-scrollable-element > .shadow { display: none !important; }
  /* END xterm6-scrollbar-hide */
  /* 하단 검정 줄 = 6.x 뷰포트의 background-color:#000 이 콘텐츠(테마 배경) 아래로 노출된 것.
     codex 뷰포트/스크롤영역 배경을 투명으로 눌러 터미널 테마 배경만 보이게 한다. */
  .term-container.agent-codex .xterm .xterm-viewport,
  .term-container.agent-codex .xterm-scrollable-element,
  .term-container.agent-devezvibe .xterm .xterm-viewport,
  .term-container.agent-devezvibe .xterm-scrollable-element { background-color: transparent !important; }

  /* IME 조합 미리보기 스타일 — Windows Terminal 과 동일하게 터미널 배경 위에
     전경색 글자 + 밑줄. (배경을 불투명하게 둬야 아래 깔린 블록커서(반전 셀)가
     비치지 않는다.)
     주의: display:none 으로 숨기면 조합용 textarea 크기가 0이 되어
     IME 조합 자체가 끊긴다(한글 입력 불가) — 절대 숨기지 말 것. */
  .xterm .composition-view {
    background: var(--term-bg, #0C0C0C);
    color: var(--term-fg, #CCCCCC);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* IME 조합 위치 고정: TUI 는 리페인트 중 하드웨어 커서를 입력 캐럿이 아닌 출력영역/
     statusLine 으로 왕복시켜 조합 글자가 엉뚱한 곳에 뜬다. 조합 중(ime-fixed)에는
     조합 글자와 textarea(후보창 기준점)를 조합 시작 시 잡은 입력 캐럿 좌표로 강제한다.
     xterm 은 0ms 루프로 인라인 left/top 을 계속 되돌리므로 — 인라인보다
     우선하는 !important CSS 변수로 무력화한다. */
  .term-container.ime-fixed .composition-view,
  .term-container.ime-fixed .xterm-helper-textarea {
    left: var(--ime-left) !important;
    top: var(--ime-top) !important;
  }

  /* 네이티브 캐럿 원천 차단: 조합 중 xterm 은 textarea 를 화면 밖(-9999em)이 아니라
     실좌표·실크기로 옮긴다(IME 후보창 앵커링). 그 상태에서 opacity:0 이 어떤 이유로든
     무력화되면 브라우저 캐럿이 조합 위치(= "입력 글자 왼쪽")에서 깜빡인다 — codex 커서
     미숨김 고착 증상의 용의자. xterm 은 네이티브 캐럿을 쓸 일이 전혀 없으므로 항상 투명. */
  .xterm-helper-textarea { caret-color: transparent !important; }

  /* [커서숨김 — DOM 렌더러 경로] 2026-07-22 확진: xterm6 DOM 렌더러는 테마 스타일시트가
     화면에 반영되지 않는 고착이 생긴다(ThemeService 색은 위장(#배경색)인데 페인트는 생성
     시점의 원본 커서색 #FFFFFF — state 스냅샷 실측). 테마 색 교체는 그 스타일시트를 경유
     하므로 고착에 무력 → 커서 DOM 요소를 우리 정적 CSS 로 직접 무력화한다(재생성이 없어
     고착 불가능). 글자(color)는 남기고 블록/바/밑줄 장식과 블링크 애니메이션만 제거 —
     opacity:0 으로 통째 숨기면 커서 밑 글자까지 사라진다(중간 편집 시 글자 증발 회귀).
     선택자는 렌더러 자체 규칙(.xterm-dom-renderer-owner-N …, !important 포함)보다 구체도가
     높아야 함. 블링크 키프레임의 background-color 는 !important 선언이 이긴다(cascade 규칙).
     WebGL 렌더러는 canvas 라 CSS 무효 — 테마 위장(hideHwCursor)이 계속 담당(서비스 색 직독이라 고착 무관). */
  .term-container.ime-hide-cursor .xterm .xterm-cursor.xterm-cursor-block {
    background-color: transparent !important;
    color: inherit !important;
    animation: none !important;
  }
  .term-container.ime-hide-cursor .xterm .xterm-cursor.xterm-cursor-outline { outline: none !important; }
  .term-container.ime-hide-cursor .xterm .xterm-cursor.xterm-cursor-bar { box-shadow: none !important; animation: none !important; }
  .term-container.ime-hide-cursor .xterm .xterm-cursor.xterm-cursor-underline { border-bottom: none !important; animation: none !important; }

  /* IME 확정 직후 PTY echo 도착 전까지 확정 글자를 미리 그리는 고스트(연타 깜빡임 제거).
     배경 투명 — echo 가 같은 글리프를 그리는 순간 이음새 없이 겹쳐졌다가 제거된다. */
  .ime-echo-ghost {
    position: absolute; z-index: 1; display: none;
    color: var(--term-fg, #CCCCCC); background: transparent;
    white-space: pre; pointer-events: none;
  }

  /* ── 세션 로딩 스피너 (테마 변경 재시작·세션 진입 중) ──────────────
     WebView2 는 HwndHost 라 항상 WPF 위에 그려진다 → WPF 오버레이로는 터미널을
     덮을 수 없으므로 스피너를 웹 레이어 안에 둔다. 배경은 --term-bg 라 테마를 따라간다.
     스피너 카드(.box)는 %-중앙이 아니라 C# 이 준 최종 레이아웃 크기의 px 좌표에 앵커한다 —
     HWND 리사이즈가 렌더러에 늦게 반영되는 동안(stale 뷰포트, 좌상단 고정 클리핑) %-중앙은
     '옛 크기의 중앙'에 그려져 스피너가 옆/아래로 튀었다 돌아온다. px 앵커는 stale 프레임에서도
     화면상 같은 지점이라 안 튄다. */
  #loading-overlay {
    position: absolute; inset: 0; z-index: 50;
    display: none;
    background: var(--term-bg, #0C0C0C);
  }
  #loading-overlay.on { display: block; }
  #loading-overlay .box {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
  }

  /* 외부 터미널 인계 중: xterm 화면은 그대로 두고 입력만 차단한다.
     WebView2 HWND 위에는 WPF 오버레이가 올라올 수 없으므로 반드시 같은 웹 레이어에서 그린다. */
  #external-session-overlay {
    position: absolute; inset: 0; z-index: 80;
    display: none; align-items: flex-start; justify-content: center;
    box-sizing: border-box; padding: 14px;
    background: rgba(0,0,0,0.14);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    color: var(--term-fg, #CCCCCC);
    user-select: none; outline: none;
  }
  #external-session-overlay.on { display: flex; }
  #external-session-overlay .external-card {
    display: flex; align-items: center;
    max-width: min(420px, calc(100% - 24px));
    padding: 9px 12px; box-sizing: border-box;
    border-radius: 9px;
    background: var(--term-bg, #0C0C0C);
    background: color-mix(in srgb, var(--term-bg, #0C0C0C) 88%, transparent);
    border: 1px solid color-mix(in srgb, var(--term-fg, #CCCCCC) 22%, transparent);
    box-shadow: 0 4px 14px rgba(0,0,0,0.24);
    text-align: left;
  }
  #external-session-overlay svg {
    flex: 0 0 auto; width: 17px; height: 17px; margin-right: 10px;
    fill: none; stroke: var(--term-accent, #2563eb); stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #external-session-overlay .external-copy { min-width: 0; }
  #external-session-overlay .external-title { font-size: 13px; font-weight: 600; }
  #external-session-overlay .external-desc { margin-top: 2px; font-size: 11px; opacity: 0.7; line-height: 1.35; }

  /* 전환 커튼 — 분할 열림/닫힘으로 패널이 리사이즈될 때 그 리플로우를 감추는 단색(터미널 배경색) 덮개.
     WebView2 는 HwndHost 라 WPF 오버레이로 못 덮으므로 웹 레이어 안에서 처리한다. 커버 즉시 → 레이아웃
     확정·fit 후 fade-out. (로딩 스피너 z-50 아래에 둬 신규 세션 스피너는 커튼 위에 보인다.) */
  #xfer-cover {
    position: absolute; inset: 0; z-index: 45;
    display: none; opacity: 0; pointer-events: none;
    background: var(--term-bg, #0C0C0C);
  }
  /* devez 최초 실행 스피너와 동일: PrimaryBrush 점선 링(28 10) 회전, 0.85s, 두께 3. */
  #loading-overlay .ring {
    width: 36px; height: 36px;
    animation: dz-spin 0.85s linear infinite;
  }
  #loading-overlay .ring circle {
    fill: none;
    stroke: var(--term-accent, #2563eb);
    stroke-width: 3;
    stroke-dasharray: 74 30;
  }
  #loading-overlay .label {
    margin-top: 14px; font-size: 13px; opacity: 0.85;
    color: var(--term-fg, #CCCCCC);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    white-space: pre-line; text-align: center; line-height: 1.5; /* label 의 \n 을 줄바꿈으로 렌더 */
  }
  @keyframes dz-spin { to { transform: rotate(360deg); } }

  /* 복사 토스트 — 우리가 직접 복사(copy-on-select/Ctrl+C/우클릭)할 때 우측 하단에 잠깐.
     claude 의 자체 "copied N chars" 와 동일 위치/문구. (claude 는 OSC52 라 이 토스트 안 탐) */
  #copy-toast {
    position: absolute; right: 16px; bottom: 14px; z-index: 60;
    padding: 9px 17px; border-radius: 9px;
    background: var(--term-bg, #1b1b1b); color: var(--term-fg, #CCCCCC);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-size: 16px;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.15s ease, transform 0.15s ease; pointer-events: none;
  }
  #copy-toast.on { opacity: 1; transform: translateY(0); }

  /* 세션 단축키 힌트 오버레이 — Ctrl+Shift 누르면 터미널 우상단(우/상 각 15px)에 표시.
     애니메이션은 opacity fade 만 쓴다: transform(translateY) 을 쓰면 서브픽셀 이동으로 텍스트가
     흐려지므로 위치는 고정하고 opacity 만 전환 → 선명 유지. visibility 로 숨김 시 완전히 비활성.
     색은 --term-bg/--term-fg 기반 + 회색 반투명이라 라이트/다크 모두 대응. */
  #shortcut-hint {
    opacity: 0; visibility: hidden;
    transition: opacity 0.14s ease, visibility 0s linear 0.14s;
    position: absolute; right: 15px; top: 15px; z-index: 70;
    padding: 12px 14px; border-radius: 12px;
    background: var(--term-bg, #1b1b1b); color: var(--term-fg, #CCCCCC);
    border: 1px solid rgba(128,128,128,0.32);
    box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    pointer-events: none;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  #shortcut-hint.on { opacity: 1; visibility: visible; transition: opacity 0.14s ease; }
  #shortcut-hint .sh-title { font-size: 12px; font-weight: 600; color: var(--term-fg, #CCCCCC); margin: 0 2px 9px; }
  #shortcut-hint .sh-row { display: flex; align-items: center; margin-top: 6px; }
  #shortcut-hint .sh-row:first-of-type { margin-top: 0; }
  #shortcut-hint .sh-key {
    display: inline-block; min-width: 104px; text-align: center; box-sizing: border-box;
    padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--term-fg, #CCCCCC);
    background: rgba(128,128,128,0.18); border: 1px solid rgba(128,128,128,0.34); margin-right: 10px;
  }
  #shortcut-hint .sh-label { font-size: 13px; color: var(--term-fg, #CCCCCC); }
</style>
<script src="xterm.min.js"></script>
<script src="addon-fit.min.js"></script>
<script src="addon-webgl.min.js"></script>
<!-- codex·devezvibe 전용 xterm 6.1 beta — 공유 WebGL 아틀라스의 병합·용량 초과·초기화 시
     다른 렌더러가 낡은 글리프 좌표를 쓰는 상류 버그 수정이 포함된 짝 버전을 고정한다.
     core=6.1.0-beta.302, fit=0.12.0-beta.299, webgl=0.20.0-beta.298.
     다른 에이전트는 기존 5.5 유지(6.x 뷰포트/스크롤바 개편의 회귀 회피).
     로드 순서상 6.1 스크립트가 window.Terminal 등 전역을 덮으므로, 6.1 을 *6 전역으로 스냅샷한 뒤
     기본 전역(window.Terminal/FitAddon/…)은 5.5 로 되돌린다 → 기존 코드는 그대로 5.5 를 쓴다. -->
<script>window.__t5 = { Terminal: window.Terminal, FitAddon: window.FitAddon, WebglAddon: window.WebglAddon };</script>
<script src="xterm6.min.js"></script>
<script src="addon-fit6.min.js"></script>
<script src="addon-webgl6.min.js"></script>
<script>
  window.__xterm6Versions = { core: '6.1.0-beta.302', fit: '0.12.0-beta.299', webgl: '0.20.0-beta.298' };
  window.Terminal6 = window.Terminal; window.FitAddon6 = window.FitAddon;
  window.WebglAddon6 = window.WebglAddon;
  // 기본 전역을 5.5 로 복원 (codex·devezvibe 외 모든 경로는 5.5 사용)
  window.Terminal = window.__t5.Terminal; window.FitAddon = window.__t5.FitAddon;
  window.WebglAddon = window.__t5.WebglAddon;
</script>
</head>
<body>
<div id="loading-overlay"><div class="box"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16.5"/></svg><div class="label">세션 여는 중…</div></div></div>
<div id="xfer-cover"></div>
<div id="external-session-overlay" tabindex="-1" aria-live="polite">
  <div class="external-card">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 3h6v6"/><path d="M10 14 21 3"/>
      <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
    </svg>
    <div class="external-copy">
      <div class="external-title">외부 터미널에서 실행 중</div>
      <div class="external-desc">외부 터미널 탭을 닫으면 이 세션으로 돌아옵니다.</div>
    </div>
  </div>
</div>
<div id="copy-toast"></div>
<div id="shortcut-hint">
  <div class="sh-title">세션 단축키</div>
  <div class="sh-row"><span class="sh-key">Ctrl+Shift+T</span><span class="sh-label">새 세션</span></div>
  <div class="sh-row"><span class="sh-key">Ctrl+Shift+N</span><span class="sh-label">이름 바꾸기</span></div>
  <div class="sh-row"><span class="sh-key">Ctrl+Shift+H</span><span class="sh-label">세션 숨기기</span></div>
  <div class="sh-row"><span class="sh-key">Ctrl+Shift+W</span><span class="sh-label">세션 닫기</span></div>
  <div class="sh-row"><span class="sh-key">Ctrl+Shift+Del</span><span class="sh-label">세션 삭제</span></div>
</div>
<script>
(function () {
  'use strict';

  // roomId → { term, fit, el, dead }
  const terms = {};
  const disposeGen = {}; // roomId → dispose 세대. 유예된 preload 재시도가 '그 사이 삭제된' 방을 좀비로
                         // 재생성하지 않게, 재시도는 시작 세대를 캡처하고 세대가 바뀌면 폐기한다.
