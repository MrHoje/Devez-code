      if (key === '0')                                       { e.preventDefault(); post({ type:'action', name:'fontReset' }); return false; }
    }

    // ── 스크롤 ──
    // 인라인 TUI(codex/gjc): 키보드 스크롤도 follow(추종 의도)를 갱신 —
    // 위로/맨위=중단, 아래/맨아래=재개.
    const tracksFollow = entry && (entry.agent === 'codex' || entry.agent === 'gajae');
    // 아래 방향 스크롤로 바닥에 닿으면 추종 재개(휠 핸들러와 동일 판정 — scrollLines/Pages 는 동기 반영).
    const resumeFollowIfBottom = function () {
      if (!tracksFollow) return;
      const b = term.buffer.active;
      if (b.viewportY >= b.baseY) entry.follow = true;
    };
    if (ctrl && shift && !alt && key === 'ArrowUp')   { e.preventDefault(); if (tracksFollow) entry.follow = false; term.scrollLines(-1); return false; }
    if (ctrl && shift && !alt && key === 'ArrowDown') { e.preventDefault(); term.scrollLines(1); resumeFollowIfBottom(); return false; }
    if (shift && !alt && key === 'PageUp')   { e.preventDefault(); if (tracksFollow) entry.follow = false; term.scrollPages(-1); return false; }
    if (shift && !alt && key === 'PageDown') { e.preventDefault(); term.scrollPages(1); resumeFollowIfBottom(); return false; }
    if (ctrl && shift && !alt && key === 'Home') { e.preventDefault(); if (tracksFollow) entry.follow = false; term.scrollToTop();    return false; }
    if (ctrl && shift && !alt && key === 'End')  { e.preventDefault(); if (tracksFollow) entry.follow = true;  term.scrollToBottom(); return false; }

    // ── 세션(탭) 관리 — C# 으로 위임 (Ctrl+Shift 조합) ──
    if (ctrl && shift && !alt) {
      if (key === 't' || key === 'T' || key === 'd' || key === 'D') { e.preventDefault(); post({ type:'action', name:'newSession' }); return false; }
      if (key === 'w' || key === 'W') { e.preventDefault(); post({ type:'action', name:'closeSession' }); return false; }
      if (key === 'h' || key === 'H') { e.preventDefault(); post({ type:'action', name:'hideSession' }); return false; }
      if (key === 'n' || key === 'N') { e.preventDefault(); post({ type:'action', name:'renameSession' }); return false; }
      if (key === 'Delete' || e.code === 'Delete') { e.preventDefault(); post({ type:'action', name:'deleteSession' }); return false; }
    }
    if (ctrl && !alt && key === 'Tab') {
      e.preventDefault(); post({ type:'action', name: shift ? 'prevSession' : 'nextSession' }); return false;
    }
    // Ctrl+1..9 (Alt 유무 무관, 상시): N번째 세션 직접 이동 (9 = 마지막) — WT switchToTab 정합.
    // 레이아웃 비의존을 위해 물리 키(e.code=Digit1..9) 기준. (AltGr 입력은 위에서 이미 통과)
    if (ctrl && !shift && /^Digit[1-9]$/.test(e.code)) {
      const n = +e.code.slice(5);
      e.preventDefault();
      post({ type:'action', name:'gotoSession', index: n === 9 ? -1 : (n - 1) });
      return false;
    }

    return true;
  }

  // 복사 토스트 — claude 의 "copied N chars to clipboard" 와 동일 문구/위치. gjc·셸 등 우리가
  // 직접 복사하는 경로에서만 표시(claude 네이티브 복사는 OSC52 라 여기 안 탐 → 중복 없음).
  const copyToastEl = document.getElementById('copy-toast');
  let copyToastTimer = 0;
  function showCopyToast(n) {
    if (!copyToastEl || !n) return;
    copyToastEl.textContent = 'copied ' + n + ' chars to clipboard';
    copyToastEl.classList.add('on');
    clearTimeout(copyToastTimer);
    copyToastTimer = setTimeout(function () { copyToastEl.classList.remove('on'); }, 1400);
  }

  function selectionJoinSeparator(left, right) {
    if (!left || !right) return '';
    const cjk = /[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/;
    if (cjk.test(left.slice(-1)) || cjk.test(right.charAt(0))) return '';
    if (/^[,.;:!?…)\]}]/.test(right) || /[(\[{\/-]$/.test(left)) return '';
    return ' ';
  }

  // Devez Vibe가 OSC 777로 남긴 행 메타데이터를 사용해 UI 전용 marker/indent를 복사에서
  // 제외하고, 화면 폭 때문에 생긴 줄바꿈만 다시 이어 붙인다. 실제 Enter는 그대로 보존한다.
  function normalizedSelection(entry) {
    const term = entry.term;
    const position = term.getSelectionPosition();
    if (!position) return term.getSelection();
    const rows = entry.devezCopyRows;
    const firstMeta = rows && rows.get(position.start.y);
    if (firstMeta && firstMeta.markerSkip > position.start.x) {
      const startX = firstMeta.markerSkip;
      const length = (position.end.y - position.start.y) * term.cols + position.end.x - startX;
      if (length <= 0) {
        term.clearSelection();
        return '';
      }
      term.select(startX, position.start.y, length);
    }

    const adjusted = term.getSelectionPosition();
    const raw = term.getSelection();
    if (!adjusted || !raw || !rows || !rows.size) return raw;
    const lines = raw.split(/\r?\n/);
    const output = [];
    for (let i = 0; i < lines.length; i++) {
      const row = adjusted.start.y + i;
      const previous = i > 0 ? rows.get(row - 1) : null;
      const current = rows.get(row);
      let line = lines[i];
      if (previous && previous.joinNext) {
        const strip = current ? current.prefixWidth : 0;
        if (strip > 0) line = line.slice(strip);
        const last = output.length ? output[output.length - 1] : '';
        output[output.length - 1] = last + selectionJoinSeparator(last, line) + line;
      } else {
        output.push(line);
      }
    }
    return output.join('\n');
  }

  function doCopy(entry) {
    const term = entry.term;
    const sel = normalizedSelection(entry);
    if (sel) { post({ type: 'copy', data: sel }); showCopyToast(Array.from(sel).length); }
    term.clearSelection();
  }

  // copy-on-select: 선택이 있으면 복사하되 선택은 유지(무엇을 복사했는지 보이게). Ctrl+C 와 달리 clear 안 함.
  function doCopyKeep(entry) {
    const sel = normalizedSelection(entry);
    if (sel) { post({ type: 'copy', data: sel }); showCopyToast(Array.from(sel).length); }
  }

  // ── Ctrl+휠: 폰트 확대/축소 (WT 정합). capture+passive:false 로 xterm 스크롤보다 먼저 가로챔 ──
  document.addEventListener('wheel', function (e) {
    if (e.getModifierState && e.getModifierState('AltGraph')) return;
    if (!e.target || !e.target.closest) return;
    var inTerm = e.target.closest('.term-container');
    if (!inTerm) return; // 터미널 위에서만(검색창 제외)

    if (e.ctrlKey && !e.altKey && !e.shiftKey && e.deltaY !== 0) {
      e.preventDefault();
      post({ type: 'action', name: e.deltaY < 0 ? 'fontInc' : 'fontDec' });
      return;
    }
    // 사용자가 휠로 직접 스크롤 → 프로그램적 스크롤 억제(_scrollSuppress)를 즉시 해제.
    // (/model·/effort 후 남은 잔여 suppress 카운트가 사용자의 스크롤을 되돌리는 것 방지.)
    _scrollSuppress = 0;

    // 인라인 TUI(codex/gjc): 사용자 스크롤 의도(follow)를 갱신 — 위로 올리면 xterm 의
    // 기본 휠 처리가 반영되기 전 즉시 추종을 끊고, 바닥으로 내려오면 재개한다.
    // writeOut 은 이 플래그만 보고 추종하므로 첫 휠과 baseY 출렁임에 흔들리지 않는다.
    {
      const _ct = activeRoomId ? terms[activeRoomId] : null;
      if (_ct && (_ct.agent === 'codex' || _ct.agent === 'gajae')) {
        if (e.deltaY < 0) _ct.follow = false;
        else if (e.deltaY > 0) requestAnimationFrame(function () {
          const b = _ct.term.buffer.active;
          if (b.viewportY >= b.baseY) _ct.follow = true;
        });
      }
    }
    // 일반 휠은 xterm 기본 동작(스크롤백 스크롤)에 맡긴다. gjc 는 풀 재페인트의 스크롤백
    // 클리어(CSI 3 J)를 파서에서 삼켜 스크롤백을 보존하므로 휠로 과거 대화를 스크롤할 수 있다.

    // 아래로 굴려 바닥 근처까지 내려오면 ybase 로 스냅 — idle 상태에서 위로 올렸다 내려올 때
    // xterm 줄 스냅이 1~3줄 모자라 입력창이 잘리는 현상 방지(휠론 ybase 에 정확히 못 닿음).
    // 아래 방향(deltaY>0)일 때만 개입 → 위로 읽는 중엔 절대 끌어내리지 않는다.
    if (e.deltaY > 0) {
      const t = activeRoomId ? terms[activeRoomId] : null;
      const vp = t && t.term.element && t.term.element.querySelector('.xterm-viewport');
      if (vp) requestAnimationFrame(function () {
        // 스냅 판정은 반드시 xterm 논리 줄 간격(baseY-viewportY)으로 한다. DOM 뷰포트
        // scrollTop(rest)으로 판정하면 안 된다 — codex 는 재페인트가 잦아 DOM scrollTop 이
        // 논리 ydisp 와 크게 어긋난다(위로 200줄 올려도 DOM 은 물리 바닥 rest==0). 그 상태에서
        // rest 로 판정하면 200줄 위에서도 nudge 가 발동해 바닥으로 강제 착지된다
        // ("아래로는 한 번에 바닥"의 진짜 원인. 실측: vpY=460, baseY=672, rest=0).
        const buf = t.term.buffer.active;
        const gap = buf.baseY - buf.viewportY;      // 논리적으로 바닥에서 몇 줄 위인가
        // 바닥 1~3줄 이내(입력창 잘림 보정 구간)에서만 스냅 — idle 상태에서 위로 올렸다
        // 내려올 때 xterm 줄 스냅이 1~3줄 모자라 입력창이 잘리는 것만 보정. 그 이상 벌어져
        // 있으면 사용자가 위를 읽는 중이므로 절대 끌어내리지 않는다. gap<=0(이미 논리 바닥)도 개입 안 함.
        if (gap > 0 && gap <= 3) {
          try { t.term.scrollLines(-1); } catch (e) {}
          requestAnimationFrame(function () {
            try {
              t.term.scrollToBottom();
              if (t.agent === 'codex' || t.agent === 'gajae') t.follow = true;
            } catch (e) {}
          });
        }
      });
    }
  }, { passive: false, capture: true });

  // WebView2 는 별도 HWND 라 WPF 부모의 PreviewMouseDown 이 터미널 클릭을 보지 못한다.
  // 터미널을 클릭하면 호스트 패널을 포커스 패널로 승격해 사이드바/파일탐색기 선택을 맞춘다.
  // ── 우클릭: 누르는 즉시(mousedown) 선택 있으면 복사, 없으면 붙여넣기 — Windows Terminal 정합 ──
  // 누름 시점 1회 처리 → 빠른 클릭·꾹 눌러도 즉시 붙여넣기, 뗄 때 추가 붙여넣기 없음.
  // (우버튼 SGR 마우스 리포트는 onData 에서 걸러 TUI 의 자체 붙여넣기 중복을 막는다)
  document.addEventListener('mousedown', function (e) {
    post({ type: 'interact' });
    const t = activeRoomId ? terms[activeRoomId] : null;
    if (t && t.external) { e.preventDefault(); e.stopPropagation(); return; }
    if (!t || t.dead) return;
    // 좌클릭은 원래 xterm 마우스 처리(선택/TUI 클릭)를 그대로 통과시킨다. 복구 함수도
    // 좌상단 고착이 확정된 경우에만 조합 상태를 비우므로 정상 클릭에는 아무 영향이 없다.
    if (e.button === 0 && e.target && e.target.closest &&
        e.target.closest('.term-container') === t.el &&
        t.el && typeof t.el._recoverStaleImeOnPointerDown === 'function')
      t.el._recoverStaleImeOnPointerDown();
    if (e.button !== 2) return;
    if (t.term.hasSelection()) { doCopy(t); return; }
    post({ type: 'requestPaste', roomId: activeRoomId });
  }, { capture: true });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // 바탕화면/탐색기 파일 드롭. WebView2 는 별도 HWND라 WPF Drop 이벤트가 닿지 않으므로
  // DOM File을 AdditionalObjects 로 보내 호스트에서 원본 절대경로를 얻는다.
  let lastFileDragEnterPost = 0;
  document.addEventListener('dragenter', function (e) {
    const t = activeRoomId ? terms[activeRoomId] : null;
    if (t && t.external) { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; return; }
    if (!e.dataTransfer || !Array.from(e.dataTransfer.items || []).some(function (item) { return item.kind === 'file'; })) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    const now = Date.now();
    if (now - lastFileDragEnterPost >= 250) {
      lastFileDragEnterPost = now;
      post({ type: 'fileDragEnter' });
    }
  }, { capture: true });
  document.addEventListener('dragover', function (e) {
    const t = activeRoomId ? terms[activeRoomId] : null;
    if (t && t.external) { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; return; }
    if (!e.dataTransfer || !Array.from(e.dataTransfer.items || []).some(function (item) { return item.kind === 'file'; })) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  }, { capture: true });
  document.addEventListener('drop', function (e) {
    const t = activeRoomId ? terms[activeRoomId] : null;
    if (t && t.external) { e.preventDefault(); e.stopPropagation(); return; }
    const files = e.dataTransfer ? Array.from(e.dataTransfer.files || []) : [];
    if (!files.length) return;
    e.preventDefault();
    e.stopPropagation();
    window.chrome.webview.postMessageWithAdditionalObjects({ type: 'fileDrop' }, files);
  }, { capture: true });

  function createTerm(roomId, agent, fontSizeOverride) {
    const el = document.createElement('div');
    el.className = 'term-container' + (agent ? ' agent-' + agent : '');
    document.body.appendChild(el);

    // codex 만 xterm 6.0 엔진(+짝 addon)으로 생성 — 6.0 은 ?2026 동기화 출력을 렌더러 레벨에서
    // 네이티브 지원해 codex 리페인트 티어링을 근본 차단한다. 나머지 에이전트는 5.5 기본 전역 사용.
    const use6 = (agent === 'codex') && window.Terminal6;
    const TerminalCtor = use6 ? window.Terminal6 : window.Terminal;
    const FitNS       = use6 ? window.FitAddon6 : window.FitAddon;
    const WebglNS     = use6 ? window.WebglAddon6 : window.WebglAddon;

    const termOptions = {
      theme: themeFor(agent),
      // 한글 폴백: 기본 모노스페이스 폰트에는 한글 글리프가 없어 IME 조합 표시가 깨진다
      fontFamily: cfg.fontFamily + ", Cascadia Mono, Consolas, 'D2Coding', 'NanumGothicCoding', 'Malgun Gothic', monospace",
      fontSize: fontSizeOverride || cfg.fontSize,
      cursorBlink: true,
      allowProposedApi: true,
      scrollback: 5000,
      // ConPTY 백엔드 명시 → Windows 줄바꿈/와이드(CJK) 문자 휴리스틱 적용
      windowsPty: { backend: 'conpty', buildNumber: cfg.windowsBuild || 0 },
    };
    // Claude/Codex가 OSC 8 링크를 출력하면 xterm 기본 동작은 WebView 내부 confirm + window.open이다.
    // 기본 브라우저 실행은 호스트에 위임해 xterm 보안 확인창과 앱 내부 탐색을 막는다.
    termOptions.linkHandler = {
      activate: function (event, url) {
        event?.preventDefault?.();
        // stopImmediatePropagation 금지: xterm 5/6의 같은 mouseup 이벤트에 등록된 선택 서비스가
        // 좌버튼 상태를 해제해야 한다. 이를 막으면 브라우저가 열린 뒤 포인터 이동이 계속 선택 드래그가 된다.
        dlog('terminalUrl linkHandler ' + url);
        requestOpenExternalUrl(url);
      }
    };
    const term = new TerminalCtor(termOptions);
    const fit = new FitNS.FitAddon();
    term.loadAddon(fit);
    term.open(el);

    const entry = { term, fit, el, webgl: null, agent: agent || '', dead: false, ro: null, inSync: false, syncChunks: [], syncCarry: null, lastSelText: '', lastSelAt: 0, needCreate: false, follow: true, roomId: roomId, devezCopyRows: new Map() };
    terms[roomId] = entry;
    // Devez Vibe 전용 copy metadata. 현재 버퍼의 절대 행에 marker 폭과 soft-wrap 여부를 기록한다.
    // 다른 CLI의 OSC는 건드리지 않으며, clear 신호에서 오래된 행 정보를 함께 비운다.
    try {
      entry.copyOsc = term.parser.registerOscHandler(777, function (data) {
        if (data === 'devez-copy-clear') {
          entry.devezCopyRows.clear();
          return true;
        }
        const match = /^devez-copy-v1;(\d+);([01]);(\d+)$/.exec(data || '');
        if (!match) return false;
        const buffer = term.buffer.active;
        const row = buffer.baseY + buffer.cursorY;
        entry.devezCopyRows.set(row, {
          markerSkip: Number(match[1]),
          joinNext: match[2] === '1',
          prefixWidth: Number(match[3])
        });
        return true;
      });
    } catch (e) {}
    // 외부 미러 중에는 일반 레이아웃 경로의 fit이 프록시 ConPTY 크기를 덮어쓰면 안 된다.
    // 기존 호출부를 모두 건드리지 않고 FitAddon 진입점 하나에서 차단한다.
    const nativeFit = fit.fit.bind(fit);
    entry.nativeFit = nativeFit;
    fit.fit = function () {
      if (entry.external) { layoutExternalMirror(entry); return; }
      return nativeFit();
    };

    // WebGL 렌더러(GPU) — 글자 그리기를 CPU(DOM) 대신 GPU 로 올려 활성 탭 렌더 비용을 낮춘다(WT 정합).
    // 원격/소프트웨어 렌더링(enableWebgl=false)에선 SwiftShader 로 오히려 느려져 비활성화한다.
    // GPU 컨텍스트 로스(드라이버 리셋/탭 과다) 시 dispose → xterm 기본 DOM 렌더러로 자동 폴백.
    // 소수 배율(125/150% 등)에선 WebGL 커서 렌더 버그가 있어 DOM 렌더러를 쓴다(위 disposeWebglIfFractional 참고).
    if (cfg.enableWebgl && !fractionalDpr() && typeof WebglNS !== 'undefined') {
      try {
        const webgl = new WebglNS.WebglAddon();
        webgl.onContextLoss(function () { try { webgl.dispose(); } catch (e) {} entry.webgl = null; });
        term.loadAddon(webgl);
        entry.webgl = webgl;
      } catch (e) { /* WebGL 미지원 환경 → DOM 렌더러 유지 */ }
    }

    // ── URL/경로 링크: URL은 기본 브라우저, 파일은 Ctrl+클릭 시 에디터 탭, 폴더는 Explorer ──
    try {
      term.registerLinkProvider({
        provideLinks: function (line, callback) {
          // link provider의 line은 1-기준, 공개 buffer API의 getLine은 0-기준.
          var bufferLine = term.buffer.active.getLine(line - 1);
          var text = bufferLine?.translateToString();
          if (!text) { callback(undefined); return; }

          var urlRe = /https?:\/\/[^\s<>"'`]+/gi;
          var sourceLocationRe = /((?:[A-Za-z]:[\\/]|\.{1,2}[\\/])[^:\s<>"'`]+|[\w\-.]*(?:[\/\\][\w\-.]+)+\.[\w-]+):(\d+)(?::(\d+))?/g;
          var quotedPathRe = /"((?:[A-Za-z]:[\\/]|\.{1,2}[\\/])[^\"]+)"/g;
          var absolutePathRe = /[A-Za-z]:[\\/][^\s<>"'`]+/g;
          var relativePathRe = /(?:^|[\s(])((?:\.{1,2}[\\/])[^\s<>"'`]+)/g;
          var filePathRe = /[\w\-.]*(?:[\/\\][\w\-.]+)+\.(md|markdown|cs|ts|tsx|js|jsx|py|go|rs|java|kt|kts|swift|rb|php|c|cpp|cc|h|hpp|m|mm|dart|lua|r|pl|sh|bash|zsh|ps1|psm1|bat|cmd|sql|json|xml|yaml|yml|toml|ini|conf|cfg|config|properties|csv|log|txt|html|htm|css|scss|less|vue|svelte|xaml|razor|cshtml|vb|fs|gradle|groovy|scala|sln|csproj|props|targets|gitignore|editorconfig|env|dockerfile|makefile)/gi;
          var links = [];
          var match;
          function overlapsExisting(startCol, endCol) {
            return links.some(function (link) {
              return startCol < link.range.end.x && endCol >= link.range.start.x - 1;
            });
          }
          function hasOscLink(startCol, length) {
            if (!bufferLine) return false;
            for (var col = startCol; col < startCol + length && col < bufferLine.length; col++) {
              var cell = bufferLine.getCell(col);
              if (cell?.hasExtendedAttrs?.() && cell.extended?.urlId) return true;
            }
            return false;
          }
          function addPathLink(path, startCol, sourceLine, sourceColumn, displayText) {
            if (!path) return;
            var label = displayText || path;
            var endCol = startCol + label.length - 1;
            if (overlapsExisting(startCol, endCol)) return;
            links.push({
              range: {
                start: { x: startCol + 1, y: line },
                end: { x: endCol + 1, y: line }
              },
              text: label,
              activate: function (e) {
                if (!e.ctrlKey && !e.metaKey) return;
                post({ type: 'openFile', path: path, line: sourceLine, column: sourceColumn });
              }
            });
          }
          while ((match = urlRe.exec(text)) !== null) {
            let url = match[0].replace(/[),.;:!?]+$/, '');
            if (!url) continue;
            let startCol = match.index;
            let endCol = match.index + url.length - 1;
            // OSC 8이면 xterm 내장 provider(linkHandler)가 담당. 아래 일반 provider를 더하면 중복 열린다.
            if (hasOscLink(startCol, url.length)) continue;
            if (overlapsExisting(startCol, endCol)) continue;
            links.push({
              range: {
                start: { x: startCol + 1, y: line },
                end: { x: endCol + 1, y: line }
              },
              text: url,
              activate: function (event) {
                event?.preventDefault?.();
                // xterm의 나머지 mouseup 리스너는 통과시켜 내부 선택/버튼 상태를 반드시 해제한다.
                dlog('terminalUrl provider ' + url);
                requestOpenExternalUrl(url);
              }
            });
          }
          while ((match = sourceLocationRe.exec(text)) !== null) {
            addPathLink(match[1], match.index, Number(match[2]), match[3] ? Number(match[3]) : undefined, match[0]);
          }
          while ((match = quotedPathRe.exec(text)) !== null) {
            let path = match[1].replace(/[),.;:!?]+$/, '');
            addPathLink(path, match.index + 1);
          }
          while ((match = absolutePathRe.exec(text)) !== null) {
            let path = match[0].replace(/[),.;:!?]+$/, '');
            addPathLink(path, match.index);
          }
          while ((match = relativePathRe.exec(text)) !== null) {
            let path = match[1].replace(/[),.;:!?]+$/, '');
            let startCol = match.index + match[0].length - match[1].length;
            addPathLink(path, startCol);
          }
          while ((match = filePathRe.exec(text)) !== null) {
            let path = match[0];
            if (/^[\s.]+$/.test(path)) continue;
            addPathLink(path, match.index);
          }
          // xterm LinkProvider 콜백은 ILink[] 배열을 직접 받는다. 객체로 감싸면 내부의 map 호출이
          // 실패해 일반 URL provider가 비활성화되고 OSC 8 기본 링크 처리만 남는다.
          callback(links.length > 0 ? links : undefined);
        }
      });
    } catch (e) { /* linkProvider 미지원 xterm 버전 */ }

    // OSC 52 클립보드 쓰기 — claude/gjc 등 TUI 가 마우스 선택 후 "ESC]52;c;<base64>" 로 복사하면
    // (우측 하단 "copied N chars" 토스트) 이를 실제 Windows 클립보드에 반영한다. 번들 xterm 은
    // OSC 52 를 기본 무시(토스트만 뜨고 클립보드 미기록 = WT 와 달리 복사 안 됨)하므로 직접 처리.
    // 클립보드 '읽기' 질의(payload '?')는 보안상 무시하고 '쓰기'만 honor 한다.
    try {
      term.parser.registerOscHandler(52, function (raw) {
        const semi = raw.indexOf(';');
        const payload = semi === -1 ? raw : raw.slice(semi + 1);
        if (!payload || payload === '?') return true;
        try {
          const bin = atob(payload);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const text = new TextDecoder('utf-8').decode(bytes);
          if (text) post({ type: 'copy', data: text });
        } catch (e) { /* base64/디코드 실패 무시 */ }
        return true; // 처리됨 — xterm 기본 무시 동작 차단
      });
    } catch (e) { /* 구버전 등 parser 미지원 시 무시 */ }

    // gjc 드래그 선택/복사 — gjc(tui)는 마우스 트래킹(?1000;?1006)을 무조건 켜는데 자체 텍스트
    // 선택 렌더는 없다(WT 의 하이라이트는 WT 자체 로컬 선택). xterm 은 앱 마우스 모드면 드래그를
    // 앱으로 넘기고 로컬 선택을 안 해 → gjc 에선 하이라이트도 복사도 안 된다. gjc 방에 한해 마우스
    // 모드 진입 DECSET 을 파서 단계에서 삼켜(xterm 이 무시) 항상 xterm 로컬 선택을 쓰게 한다
    // → 드래그 하이라이트 + copy-on-select 복사. 휠 스크롤은 xterm 스크롤백이 처리.
    if ((agent || '') === 'gajae') {
      const MOUSE_MODES = [1000, 1001, 1002, 1003, 1005, 1006, 1015, 1016];
      const swallowMouse = function (params) {
        const arr = params && params.params ? params.params : params;
        const len = params && params.length !== undefined ? params.length : (arr ? arr.length : 0);
        for (let i = 0; i < len; i++) if (MOUSE_MODES.indexOf(arr[i]) !== -1) return true; // 삼킴
        return false; // 마우스 외 DECSET(?2004/?2026/?25/?1049 등)은 xterm 기본 처리로 통과
      };
      // 스크롤백 클리어(CSI 3 J) 삼킴 — gjc 는 멀티플렉서가 아니면 풀 재페인트 때 \x1b[3J 로
      // 스크롤백을 비운다. 이게 첫 휠 시 뷰포트를 맨 위로 튕기고 과거 대화 스크롤을 지운다.
      // param==3 만 삼키고 ED 0/1/2(화면 지움)는 xterm 기본 처리로 통과 → 스크롤백 보존.
      const swallowScrollbackClear = function (params) {
        const arr = params && params.params ? params.params : params;
        const len = params && params.length !== undefined ? params.length : (arr ? arr.length : 0);
        for (let i = 0; i < len; i++) if (arr[i] === 3) return true; // 삼킴
        return false; // ED 0/1/2 통과
      };
      try {
        term.parser.registerCsiHandler({ prefix: '?', final: 'h' }, swallowMouse);
        term.parser.registerCsiHandler({ prefix: '?', final: 'l' }, swallowMouse);
        term.parser.registerCsiHandler({ final: 'J' }, swallowScrollbackClear);
      } catch (e) { /* parser 미지원 무시 */ }
    }

    // 컨테이너 실제 픽셀 박스가 바뀔 때마다 재-fit. window resize 만으로는
    // WebView2 HWND 크기는 그대로인데 CSS 박스만 변하는 경우(시작 시 레이아웃이
    // 최종 폭에 닿기 전 fit, 폰트 로드 후 셀 폭 재계산, 패널 토글 등)를 놓쳐
    // 그리드가 컨테이너보다 좁게 굳는다 → 오른쪽에 빈 띠가 남는다.
    // 컨테이너 픽셀 박스가 바뀔 때마다 다음 프레임에 재-fit (스플리터 드래그 시 실시간 추종).
    let roPending = false;
    const ro = new ResizeObserver(function () {
      if (roomId !== activeRoomId) return;          // 비활성 방은 0폭 → fit 금지
      if (_fitSuppressed) return;                   // 전환 중 — 중간 폭 fit 억제(reveal 이 최종 폭에서 fit)
      if (el.clientWidth < 2 || el.clientHeight < 2) return;
      if (roPending) return;
      roPending = true;
      requestAnimationFrame(function () {
        roPending = false;
        if (roomId === activeRoomId) fitKeepBottom(entry, roomId); // 바닥 추종 보존(스플리터 드래그 등)
      });
    });
    ro.observe(el);
    entry.ro = ro;

    setupImeCaretFix(term, el, agent, roomId);
    term.attachCustomKeyEventHandler(function (e) { return handleKey(e, entry, roomId); });

    // 마지막 비어있지 않은 선택을 기억(텍스트+시각) — gjc 재페인트가 선택을 지운 직후의
    // Ctrl+C 복사 grace 판정에 쓴다(handleKey 참고). 빈 선택(clear)일 땐 갱신 안 해 보존.
    try {
      term.onSelectionChange(function () {
        const s = term.getSelection();
        if (s) { entry.lastSelText = s; entry.lastSelAt = Date.now(); }
      });
    } catch (e) {}

    // copy-on-select: 드래그 선택(마우스 뗄 때) 자동 복사 → Ctrl+C 없이 복사. xterm 이 선택을
    // 확정한 뒤 읽도록 다음 프레임에 조회. (TUI 마우스 모드에선 Shift+드래그로 선택해야 함)
    el.addEventListener('mouseup', function () {
      if (entry.dead) return;
      setTimeout(function () { if (term.hasSelection()) doCopyKeep(entry); }, 0);
    });

    term.onData(function (data) {
      if (entry.external) return;
      if (entry.dead) {
        if (data === '\r') post({ type: 'restart', roomId: roomId }); // Enter로 재시작
        return;
      }
      // 우클릭은 호스트에서 복사/붙여넣기로 처리한다. 마우스 트래킹(TUI) 모드에선 xterm 이
      // 우버튼 SGR 리포트(ESC[<2..M/m)도 PTY 로 보내는데, claude 등 TUI 가 이를 받아 자체
      // 붙여넣기를 또 수행 → 붙여넣기 2회. 우버튼 리포트만 걸러 PTY 로 전달하지 않는다.
      // (b&3)===2 = 우버튼, b<64 = 휠 제외. 좌/중/휠/모션은 그대로 전달(선택 등 보존).
      if (data.indexOf('\x1b[<') !== -1) {
        data = data.replace(/\x1b\[<(\d+);\d+;\d+[Mm]/g, function (seq, b) {
          b = +b; return ((b & 3) === 2 && b < 64) ? '' : seq;
        });
        if (!data) return;
      }
      // codex: 타이핑 = 추종(follow) 재개 + 바닥 정렬 — 위로 올려 읽다가도 입력하는 순간 입력창으로
      // 복귀(WT scrollOnUserInput 정합). 마우스 리포트(\x1b[<)는 위에서 처리/식별됨 — 휠 스크롤이
      // 여기 걸리면 위로 굴릴 때마다 바닥으로 끌려와 스크롤이 불가능해지므로 반드시 제외.
      // 포커스 리포트(?1004: \x1b[I/\x1b[O)도 타이핑이 아님(클릭/포커스 전환) — 제외.
      // 이미 바닥이면 scrollToBottom 은 no-op(상태 변경 없음)이라 키당 비용은 무시 가능.
      if (entry.agent === 'codex' && data.indexOf('\x1b[<') === -1
          && data !== '\x1b[I' && data !== '\x1b[O') {
        entry.follow = true;
        // 상하좌우 화살표에서만 커서 표시 창을 연다 — 화살표 이동은 캐럿 위치가 의미 있어 보여야 하지만
        // Enter/Backspace/타이핑은 codex 가 캐럿을 알아서 정상 표시하므로 제외한다.
        // 일반(ESC[A-D)·애플리케이션 커서 모드(ESC O A-D)·수정키 조합(ESC[1;5C 등) 모두 커버.
        // applyCodexCursorPolicy 가 이 창 안에선 커서를 강제로 숨기지 않고 codex 의사를 따른다.
        if (/^\x1b(\[[0-9;]*|O)[ABCD]$/.test(data)) entry._lastInputAt = Date.now();
        try { term.scrollToBottom(); } catch (e) {}
      }
      post({ type: 'input', roomId: roomId, data: data });
    });
    term.onResize(function (size) {
      if (entry.external) return;
      post({ type: 'resize', roomId: roomId, cols: size.cols, rows: size.rows });
      // fit 으로 그리드가 바뀌면 스크롤백이 리플로우되며 스크롤이 점프한다. pin 윈도우(인라인 TUI resume)
      // 동안엔 리사이즈 후에도 맨 아래로 고정해 위/아래 튐을 막는다.
      if (Date.now() < _pinBottomUntil)
        requestAnimationFrame(function () { try { term.scrollToBottom(); } catch (e) {} });
    });
    return entry;
  }

  function show(roomId, agent, fontSizeOverride, reemit) {
    let entry = terms[roomId];
    const isNew = !entry;
    if (isNew) entry = createTerm(roomId, agent, fontSizeOverride);

    for (const id in terms) terms[id].el.classList.toggle('active', id === roomId);
    activeRoomId = roomId;
    syncExternalOverlay();
    // returnResync 가 다른 방 전환으로 중단돼 투명(opacity:0)하게 남았을 수 있음 — 표시 시 복원.
    entry.el.style.transition = 'none';
    entry.el.style.opacity = '';

    const preCols = entry.term.cols, preRows = entry.term.rows; // settle 바운스 판단용(이 show 에서 크기가 바뀌었나)
    const plainShow = !_fitSuppressed; // 전환(커버) 중 show 는 reveal 이 fit·재동기·커버로 처리 — 바운스 제외
    dlog('show ' + agent + ' room=' + roomId + ' isNew=' + isNew + ' reemit=' + !!reemit + ' plainShow=' + plainShow
      + ' pre=' + preCols + 'x' + preRows + ' client=' + entry.el.clientWidth + 'x' + entry.el.clientHeight);
    if (!_fitSuppressed) entry.fit.fit(); // 전환(커버) 중이면 중간 폭 fit 억제 → reveal 이 최종 폭에서 fit
    if (!_fitSuppressed) dlog('show afterFit room=' + roomId + ' now=' + entry.term.cols + 'x' + entry.term.rows
      + ' client=' + entry.el.clientWidth + 'x' + entry.el.clientHeight);
    if (typeof entry.el._prepareImeCaret === 'function') entry.el._prepareImeCaret();
    entry.term.focus();
    if (isNew && typeof entry.el._resetImeOnInitialFocus === 'function')
      entry.el._resetImeOnInitialFocus();
    if (isNew) {
      if (_fitSuppressed) {
        // 전환 중 — ConPTY 생성을 reveal(최종 폭 확정)로 미룬다. 지금 만들면 중간(전체) 폭으로 만들어져
        // claude 등이 그 폭으로 히스토리를 그렸다가 최종 폭으로 리플로우돼 깨진다(좌측 세션 깨짐의 실제 원인).
        entry.needCreate = true;
      } else {
        // C#이 이 크기로 ConPTY 세션을 만든다
        post({ type: 'created', roomId: roomId, cols: entry.term.cols, rows: entry.term.rows });
      }
    }
    // 웹폰트(터미널 폰트)가 늦게 로드되면 셀 폭이 바뀌어 그리드가 컨테이너보다
    // 좁아질 수 있다 — 로드 완료 후 한 번 더 fit (ResizeObserver 는 컨테이너 박스가
    // 안 변하면 안 뜨므로 폰트 로드는 별도로 처리).
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        if (_fitSuppressed) return; // 전환 중 — reveal 이 최종 폭에서 fit
        if (roomId === activeRoomId && terms[roomId]) { try { terms[roomId].fit.fit(); } catch (e) {} }
      });
    }
    // 지연 재-fit: 분할 패널 재진입/토글처럼 show 시점엔 WebView2 컨테이너가 아직 최종
    // 픽셀 폭에 도달하지 않은 경우, 위 첫 fit 은 잘못된(좁은) cols 로 굳어 내용이 오른쪽에서
    // 잘려 보인다. 레이아웃이 안정된 다음 프레임/짧은 지연 후 다시 측정해 fit 하면 실제 폭으로
    // 교정되고, onResize 가 정확한 크기를 ConPTY 로 보내 alt-screen TUI(claude 등)가 풀폭 재렌더한다.
    refitSoon(roomId);
    // 숨김(display:none) 동안 출력이 쌓이면 xterm 이 DOM 뷰포트를 동기화하지 못해 scrollTop 이
    // 낡은(작은) 값으로 남는다 → 복귀 후 첫 휠에서 낡은 scrollTop 기준으로 위치가 계산돼
    // 한 칸 휠에 과거로 크게 점프. 표시 직후 버퍼 위치에 맞춰 scrollTop 재동기.
    requestAnimationFrame(function () { requestAnimationFrame(function () { resyncViewportScroll(roomId); }); });
    setTimeout(function () { resyncViewportScroll(roomId); }, 220); // refitSoon(180ms) 리플로우 이후 한 번 더
    // settle 바운스 — 숨겨진 사이 패널 폭이 바뀐(분할 열림 등) 방을 처음 열면 fit→resize 로 conhost
    // 재방출과 TUI(claude) 재렌더가 '동시에' 흘러들며 간헐적으로 하단 줄/입력영역이 어긋난 채 굳는다.
    // 추가 출력이 없으면(idle) 재방출 계기가 없어 탭 전환으로도 안 돌아오고, 사용자가 스플리터로
    // 실제 크기를 바꿔야(=ConPTY 재방출 유도) 회복되던 증상. → 그 수동 회복을 자동화한다:
    // 크기 변화가 있었던 plain show 에 한해, 초기 재방출이 가라앉은 뒤 ConPTY 만 rows-1→rows 로
    // 바운스해 깨끗한 전체 재방출을 1회 유도한다. xterm 그리드는 안 건드려(버퍼 클리핑 없음),
    // cols 바운스와 달리 줄바꿈 reflow 왕복도 없다. 크기가 안 바뀐 일반 탭 전환에선 발동하지 않는다.
    // reemit: 브라우저/파일 탭에서 codex 등 세션으로 복귀(터미널 호스트가 off-screen 주차됐다 복귀)한 경우.
    // 폭은 안 바뀌지만 주차 중 도착한 출력·렌더가 스로틀돼 하단 입력영역이 tear 된 채 고착될 수 있다
    // (§6.6: 실제 리사이즈 없이는 재방출 계기가 없어 회복 불가). → 크기 무변화라도 재방출 1회 강제.
    if (!isNew && plainShow) {
      setTimeout(function () {
        const t = terms[roomId];
        if (!t) return;
        const sizeChanged = !(t.term.cols === preCols && t.term.rows === preRows);
        if (!sizeChanged && !reemit) return; // 크기 무변화 & 재방출 요청 없음(세션↔세션 전환) — 불필요
        scheduleSettleBounce(roomId, 0); // 가드(활성/dead/억제)는 헬퍼가 재확인
      }, 450);
    }
    if (!isNew && plainShow) {
      entry._dbgUntil = Date.now() + 5000; entry._dbgCount = 0; // writeOut 프레임 캡처 창
      dumpBuf(roomId, 'show');
      setTimeout(function () { dumpBuf(roomId, '+300'); }, 300);
      setTimeout(function () { dumpBuf(roomId, '+900'); }, 900);
      setTimeout(function () { dumpBuf(roomId, '+1500'); }, 1500);
      setTimeout(function () { dumpBuf(roomId, '+2500'); }, 2500);
      setTimeout(function () { dumpBuf(roomId, '+4000'); }, 4000);
    }
  }

  // DOM 뷰포트 scrollTop 을 xterm 버퍼 위치(viewportY)에 맞춘다. 값이 이미 맞으면 no-op.
  function resyncViewportScroll(roomId) {
    const t = terms[roomId];
    if (!t || roomId !== activeRoomId) return;
    const vp = t.term.element && t.term.element.querySelector('.xterm-viewport');
    if (!vp || vp.scrollHeight <= vp.clientHeight) return;
    const buf = t.term.buffer.active;
    const total = buf.baseY + t.term.rows;
    if (total <= 0) return;
    const target = (buf.viewportY >= buf.baseY)
      ? vp.scrollHeight - vp.clientHeight                  // 바닥 추종 중이었으면 정확히 맨 아래로
      : buf.viewportY * (vp.scrollHeight / total);         // 위로 읽던 중이면 그 줄 위치로
    if (Math.abs(vp.scrollTop - target) > 1) vp.scrollTop = target;
  }

  // fit 전 논리적 바닥(viewportY>=baseY) 여부를 기억했다가, fit 리플로우로 뷰포트가 밀렸으면
  // 바닥 추종을 복원한다(WT 정합: 바닥에서 리사이즈하면 리사이즈 후에도 바닥). 위로 읽는 중이거나
  // suppressScroll 진행 중이면 개입 안 함. 비커버 리사이즈(창 드래그·Aero snap·스플리터)용 —
  // 커버 전환은 _xferWasAtBottom 이 같은 역할을 한다.
  function fitKeepBottom(entry, roomId) {
    let atBottom = false;
    try { const b = entry.term.buffer.active; atBottom = b.viewportY >= b.baseY; } catch (e) {}
    try { entry.fit.fit(); } catch (e) {}
    if (atBottom && _scrollSuppress <= 0)
      requestAnimationFrame(function () {
        try { entry.term.scrollToBottom(); } catch (e) {}
        resyncViewportScroll(roomId);
      });
  }

  // settle 바운스(§6.6 공용 헬퍼) — 크기가 바뀐 fit 뒤엔 conhost 전체 재방출과 TUI 재렌더가
  // 인터리브되며 간헐적으로 어긋난 화면이 고착될 수 있다(idle 이면 재방출 계기가 없어 회복 불가).
  // 안정 후 ConPTY 만 rows-1→rows 로 바운스해 깨끗한 전체 재방출을 1회 유도한다.
  // xterm 그리드는 건드리지 않는다(버퍼 클리핑·레이아웃 흔들림 없음).
  function scheduleSettleBounce(roomId, delay) {
    setTimeout(function () {
      const t = terms[roomId];
      if (!t || roomId !== activeRoomId || t.dead || _fitSuppressed) return;
      if (t.term.cols <= 2 || t.term.rows <= 2) return;
      dlog('settleBounce room=' + roomId + ' ' + t.term.cols + 'x' + t.term.rows + ' client=' + t.el.clientWidth + 'x' + t.el.clientHeight);
      post({ type: 'resize', roomId: roomId, cols: t.term.cols, rows: t.term.rows - 1 });
      post({ type: 'resize', roomId: roomId, cols: t.term.cols, rows: t.term.rows });
    }, delay == null ? 450 : delay); // 0 도 유효한 지연(호출부가 이미 대기한 경우)
  }

  // show/재진입 직후 레이아웃이 안정되길 기다려 여러 번 재측정 fit. 활성 방일 때만.
  function refitSoon(roomId) {
    function tryFit(sync) {
      const t = terms[roomId];
      if (!t || roomId !== activeRoomId) return;
      if (_fitSuppressed) return;                                // 전환 중 — reveal 이 최종 폭에서 fit
      if (t.el.clientWidth < 2 || t.el.clientHeight < 2) return; // 아직 0폭이면 다음 타이밍에
      const bc = t.term.cols, br = t.term.rows;
      fitKeepBottom(t, roomId); // 재진입 fit 리플로우로 바닥 추종이 끊기지 않게 보존
      dlog('refitSoon(' + (sync ? 'sync' : 'async') + ') room=' + roomId + ' ' + bc + 'x' + br + '->' + t.term.cols + 'x' + t.term.rows
        + ' client=' + t.el.clientWidth + 'x' + t.el.clientHeight);
      // 마지막 패스: 그리드가 안 변해 onResize 가 안 떠도 ConPTY 를 현재 그리드 크기로 재동기.
      // 숨겨진 다른 패널의 낡은 방 등이 ConPTY 만 딴 크기로 바꿔놓은 경우(그리드↔ConPTY 어긋남 =
      // TUI 가 좁은 폭으로 그림) 탭을 열 때마다 여기서 자가치유된다. 같은 크기면 C# 이 no-op.
      if (sync && !t.dead && t.term.cols > 2 && t.term.rows > 1)
        post({ type: 'resize', roomId: roomId, cols: t.term.cols, rows: t.term.rows });
    }
    requestAnimationFrame(function () { requestAnimationFrame(function () { tryFit(false); }); });
    setTimeout(function () { tryFit(false); }, 60);
    setTimeout(function () { tryFit(true); }, 180);
  }

  // 화면에 표시하지 않고 xterm 인스턴스+ConPTY 세션만 미리 생성(백그라운드 로드).
  // 컨테이너는 display:none(.active 없음)이라 xterm 은 기본 80x24 로 만들어지는데, 그 크기로
  // ConPTY 를 만들면 claude/gjc resume 히스토리가 80컬럼으로 그려지고, 80폭에서 하드랩된
  // 스크롤백은 나중에 show 의 fit 리사이즈로도 풀리지 않아 '안 보고 있던 세션'이 좁게 깨져
  // 보인다. → 생성 직후 컨테이너를 visibility:hidden 으로 잠깐 레이아웃만 시켜(페인트 없음 =
  // 무깜빡) 실제 크기로 fit 한 뒤 ConPTY 를 만든다. 전환(커버) 중이면 폭이 유동적이므로
  // 억제가 풀릴 때까지 프리로드 자체를 미룬다(최대 ~5s 후 폴백 진행).
  function preload(roomId, agent, fontSizeOverride, tries, gen) {
    if (terms[roomId]) return; // 이미 생성됨
    if (gen === undefined) gen = disposeGen[roomId] || 0;   // 첫 호출 — 현재 세대 캡처
    else if (gen !== (disposeGen[roomId] || 0)) return;      // 유예 중 dispose 발생 — 좀비 재생성 방지
    if (_fitSuppressed && (tries || 0) < 25) {
      setTimeout(function () { preload(roomId, agent, fontSizeOverride, (tries || 0) + 1, gen); }, 200);
      return;
    }
    const entry = createTerm(roomId, agent, fontSizeOverride);
    try {
      entry.el.style.visibility = 'hidden';
      entry.el.style.display = 'block';
      if (entry.el.clientWidth >= 2 && entry.el.clientHeight >= 2) entry.fit.fit();
    } catch (e) {}
    entry.el.style.display = '';    // 측정 불가(0폭)였으면 기본 80x24 폴백 유지
    entry.el.style.visibility = '';
    post({ type: 'created', roomId: roomId, cols: entry.term.cols, rows: entry.term.rows });
  }

  // 소수 배율(devicePixelRatio 가 정수 아님 — 예: 125%→1.25, 150%→1.5)에선 xterm WebGL
  // 렌더러가 셀 픽셀 위치를 잘못 반올림해 커서가 입력 위치에서 사라지고 텍스트 위에 얇은
  // 가로선으로 깜빡이는 아티팩트가 생긴다(특히 전체화면). DOM 렌더러는 소수 배율을 정상
  // 처리하므로, 이 경우 WebGL 을 dispose 해 DOM 렌더러로 폴백한다.
  function fractionalDpr() { return !Number.isInteger(window.devicePixelRatio); }

  function disposeWebglIfFractional(entry) {
    if (entry && entry.webgl && fractionalDpr()) {
      try { entry.webgl.dispose(); } catch (e) {}
      entry.webgl = null; // → 이후 xterm 기본 DOM 렌더러
    }
  }

  // 배율 변경 감지(다른 배율 모니터로 이동/배율 조정). matchMedia 는 1회성이라 발화마다 재구독.
  function watchDevicePixelRatio() {
    const mq = window.matchMedia('(resolution: ' + window.devicePixelRatio + 'dppx)');
    const onChange = function () {
      for (const id in terms) disposeWebglIfFractional(terms[id]);
      // 전환(커버) 중이면 중간 폭 fit 금지 — reveal/fadeNow 가 최종 폭에서 교정 fit 한다.
      const act = !_fitSuppressed && activeRoomId ? terms[activeRoomId] : null;
      if (act && act.el.clientWidth >= 2 && act.el.clientHeight >= 2) {
        fitKeepBottom(act, activeRoomId); // 다른 배율 모니터로 창 이동 — 바닥 추종 보존
        // 그리드가 안 변해도 셀 픽셀 메트릭이 바뀌었으므로 글리프 전체 재페인트 강제.
        try { act.term.refresh(0, act.term.rows - 1); } catch (e) {}
      }
      watchDevicePixelRatio(); // 새 배율 기준으로 재구독
    };
    try { mq.addEventListener('change', onChange, { once: true }); }
    catch (e) { try { mq.addListener(onChange); } catch (e2) {} }
  }
  watchDevicePixelRatio();

  window.addEventListener('resize', function () {
    // 배율 change(matchMedia) 이벤트를 놓쳐도(모니터 전환 + 최대화/창모드 빠른 연속 토글 시 레이스/누락)
    // resize 에서 소수 배율이면 WebGL 을 폴백한다 — 안 그러면 소수 배율 모니터에 WebGL 이 방치돼
    // 커서가 글자 왼쪽으로 밀리고 우측 정렬이 어긋난다. 커버 억제와 무관하게 항상 먼저 검사.
    for (const id in terms) disposeWebglIfFractional(terms[id]);
    if (_fitSuppressed) return; // 전환(커버) 중 — 중간 폭 fit 억제(reveal 이 최종 폭에서 fit)
    const t = activeRoomId ? terms[activeRoomId] : null;
    if (!t) return;
    // 0/극소폭 가드: 패널 접힘(0폭)에서 fit 하면 FitAddon 이 2x1 을 제안 → ConPTY 가 2컬럼으로
    // 리사이즈돼 TUI 화면이 붕괴된다(다시 펴져도 어긋난 채 남음). 측정 가능할 때만 fit.
    if (t.el.clientWidth < 2 || t.el.clientHeight < 2) return;
    var bc = t.term.cols, br = t.term.rows;
    fitKeepBottom(t, activeRoomId); // 창 가장자리 드래그·Aero snap 등 비커버 리사이즈에서 바닥 추종 보존
    dlog('window.resize fit room=' + activeRoomId + ' ' + bc + 'x' + br + '->' + t.term.cols + 'x' + t.term.rows + ' client=' + t.el.clientWidth + 'x' + t.el.clientHeight);
  });

  window.chrome.webview.addEventListener('message', function (e) {
    const msg = e.data;
    switch (msg.type) {
      case 'init':
        cfg = { theme: msg.theme, fontFamily: msg.fontFamily, fontSize: msg.fontSize, windowsBuild: msg.windowsBuild, enableWebgl: !!msg.enableWebgl };
        document.body.style.background = msg.theme.background || '#0C0C0C';
        // IME 조합 글자(composition-view)가 body 폰트를 상속 — 명시적으로 일치시킴
        document.body.style.fontFamily = msg.fontFamily + ", Cascadia Mono, Consolas, 'D2Coding', 'NanumGothicCoding', 'Malgun Gothic', monospace";
        document.body.style.fontSize = msg.fontSize + 'px';
        // 조합 글자 위치가 입력 박스를 따라가지 않도록 CSS 변수 설정
        document.documentElement.style.setProperty('--term-bg', msg.theme.background || '#0C0C0C');
        document.documentElement.style.setProperty('--term-fg', msg.theme.foreground || '#CCCCCC');
        if (msg.accent) document.documentElement.style.setProperty('--term-accent', msg.accent);
        break;
      case 'externalPreview': {
        const t = terms[msg.roomId];
        if (msg.on) {
          activateExternalPreview(msg.roomId, msg.agent, msg.fontSize, !!msg.create);
          break;
        }
        if (t) {
          t.external = false;
          clearExternalMirrorLayout(t);
        }
        syncExternalOverlay();
        if (msg.reconnect && t) {
          t.dead = false;
          if (!_fitSuppressed && t.el.clientWidth > 1 && t.el.clientHeight > 1) {
            try { t.fit.fit(); } catch (e) {}
          }
          post({ type: 'created', roomId: msg.roomId, cols: t.term.cols, rows: t.term.rows });
        }
        break;
      }
      case 'externalPreviewSize': {
        const t = terms[msg.roomId];
        if (!t || !t.external) break;
        const cols = Math.max(20, Math.min(500, msg.cols | 0));
        const rows = Math.max(5, Math.min(200, msg.rows | 0));
        if (t.term.cols !== cols || t.term.rows !== rows) {
          try { t.term.resize(cols, rows); } catch (e) {}
        }
        requestAnimationFrame(function () { layoutExternalMirror(t); });
        break;
      }
      case 'theme':

      case 'returnResync': {
        // Collapsed 였다 되살아난(preserve) 패널: 틀어진 중간 프레임을 안 보이게 컨테이너를 잠깐 투명
        // (opacity:0, 아래 body 배경색=--term-bg 만 노출)으로 덮은 뒤, 폭이 최종값으로 확정될 때까지 기다려
        // fit + resize-kick(cols-1→cols)으로 ConPTY 를 xterm 의 실제 cols 로 재동기(SIGWINCH→TUI 재렌더)하고,
        // 안정되면 부드럽게 fade-in 한다. gen 검사로 빠른 재전환 시 낡은 타이머를 폐기(폐기 시 opacity 복원).
        const gen = ++_xferGen;
        const room = msg.roomId || activeRoomId;
        const first = terms[room];
        if (!first) break;
        first.el.style.transition = 'none';
        first.el.style.opacity = '0';
        const reveal = function (e) {
          requestAnimationFrame(function () {
            if (gen !== _xferGen) return;
            e.el.style.transition = 'opacity 0.12s ease';
            e.el.style.opacity = '1';
          });
        };
        let waited = 0, kicks = 0;
        const step = function () {
          if (gen !== _xferGen) { first.el.style.transition = 'none'; first.el.style.opacity = ''; return; } // 재전환 — 복원 후 폐기
          const e = terms[room];
          if (!e || room !== activeRoomId) { first.el.style.opacity = ''; return; } // 다른 방 전환 — 복원(show 도 복원)
          if (e.el.clientWidth < 2 || e.el.clientHeight < 2) {  // 아직 최종 폭 미확정 — 잠깐 더 대기
            if (waited < 800) { waited += 40; setTimeout(step, 40); } else reveal(e);
            return;
          }
          try { e.fit.fit(); } catch (err) {}
          const c = e.term.cols, r = e.term.rows;
          if (c > 2 && r > 1) { try { e.term.resize(Math.max(2, c - 1), r); e.term.resize(c, r); } catch (err) {} }
          kicks++;
          if (kicks < 3) { setTimeout(step, 70); } // 폭 확정 후 몇 번 재확정(TUI 재렌더 안정)
          else setTimeout(function () { reveal(e); }, 70);
        };
        step();
        break;
      }
      case 'nudgeScroll': {
        // 재생 후 어긋난 viewport 를 강제 리렌더(위 1줄 → 맨 아래)로 고친다. 사용자가 수동으로
        // 스크롤 올렸다 내리면 정상화되던 것을 자동화 — 인라인 TUI(gjc) resume 직후 호출.
        const t = terms[msg.roomId];
        if (t) {
          try {
            t.term.scrollLines(-1);
            requestAnimationFrame(function () { try { t.term.scrollToBottom(); } catch (e) {} });
          } catch (e) {}
        }
        break;
      }
      case 'show':
        show(msg.roomId, msg.agent, msg.fontSize, !!msg.reemit);
        break;
      case 'preload':
        preload(msg.roomId, msg.agent, msg.fontSize);
        break;
      case 'readyPaintProbe': {
        const t = terms[msg.roomId];
        // xterm write 뒤 두 번의 rAF 를 건너 실제 브라우저 페인트 시점에서 화면 내용을 확인한다.
        // 커서만 있는 초기 Codex 프레임은 ready 로 인정하지 않는다.
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          let chars = 0;
          if (t) {
            const b = t.term.buffer.active;
            for (let row = 0; row < t.term.rows && chars < 4; row++) {
              const line = b.getLine(b.viewportY + row);
              if (!line) continue;
              for (let col = 0; col < t.term.cols && chars < 4; col++) {
                const cell = line.getCell(col);
                const s = cell && cell.getChars();
                if (s && s.trim()) chars += Array.from(s).length;
              }
            }
          }
          post({ type: 'readyPainted', roomId: msg.roomId, generation: msg.generation, hasContent: chars >= 4 });
        }); });
        break;
      }
      case 'resetImeAfterResponse': {
        const t = terms[msg.roomId];
        if (t && t.el && typeof t.el._resetImeAfterResponse === 'function')
          t.el._resetImeAfterResponse();
        break;
      }
      case 'output': {
        const t = terms[msg.roomId];
        if (t) {
          // codex 는 ?2026 마커 없이 그리는 구간도 많아(전체화면 diff 리페인트), 청크 경계에서
          // 쪼개지면 중간 상태(지워졌다 다시 그려지는 글자)가 그대로 렌더된다 → 12ms 코얼레싱으로
          // 리페인트 버스트를 한 write 로 모아 티어링을 줄인다(같은 태스크의 write 들은 xterm 이
          // 한 번에 파싱 후 렌더하므로 중간 상태가 안 보인다). 프로토콜상 100% 보장은 아니고 확률 완화.
          if (t.agent === 'codex') {
            (t._coChunks || (t._coChunks = [])).push(b64ToBytes(msg.data));
            if (!t._coTimer) {
              t._coTimer = setTimeout(function () {
                t._coTimer = 0;
                const chunks = t._coChunks; t._coChunks = [];
                if (!chunks || !chunks.length) return;
                feedSync(t, concatAll(chunks), function (out) {
                  // codex 는 커서를 입력창으로 되돌리는 프레임을 sync 블록 '밖'에서 보내므로,
                  // 6.0 네이티브 ?2026(원자 렌더)으로도 커서 튐이 남는다(WT 에서도 #9081 로 발생).
                  // 엔진 무관 codex 자체 동작 → 커서 숨김 debounce 정책 유지가 유일한 대응.
                  out = applyCodexCursorPolicy(t, out);
                  writeOut(t, out);
                });
              }, 12);
            }
            break;
          }
          // 동기화 업데이트(?2026) 구간을 한 번의 write 로 모아 흘려 입력창 튐을 막는다.
          // pin/suppress 정책은 flush 시점(writeOut)에 적용.
          feedSync(t, b64ToBytes(msg.data), function (out) { writeOut(t, out); });
        }
        break;
      }
      case 'exited': {
        const t = terms[msg.roomId];
        if (t && !t.dead) {
          t.dead = true;
          t.term.write('\r\n\x1b[90m[세션 종료됨 — Enter로 재시작]\x1b[0m\r\n');
        }
        break;
      }
      case 'restarted': {
        const t = terms[msg.roomId];
        if (t) {
          t.dead = false;
          t.inSync = false; t.syncChunks = []; t.syncCarry = null; // 잔여 sync 버퍼 폐기
          // codex 12ms 코얼레싱 버퍼/커서 표시 타이머도 폐기 — 남겨두면 이전 세션의 stale 바이트가
          // reset 직후의 새 터미널에 write 되어 재시작 첫 화면이 깨진다.
          if (t._coTimer) { clearTimeout(t._coTimer); t._coTimer = 0; }
          t._coChunks = [];
          if (t._curShowTimer) { clearTimeout(t._curShowTimer); t._curShowTimer = 0; }
          t.follow = true; // 재시작 = 새 화면 — 추종 상태로 초기화
          t.term.reset();
          t.fit.fit();
          post({ type: 'resize', roomId: msg.roomId, cols: t.term.cols, rows: t.term.rows });
        }
        break;
      }
      case 'loading': {
        // 세션 로딩 스피너 토글(테마 재시작·세션 진입 중). 웹 레이어라 터미널 위에 항상 보인다.
        // expectW/H: C# 이 확정한 최종 레이아웃 크기. HWND 리사이즈가 렌더러에 늦게 반영되는 동안
        // stale 프레임이 클립/스트레치로 표시되는데, 그때 카드를 그리면 옆/아래로 튀었다 돌아와 보인다.
        // → 배경(단색, 스트레치돼도 티 안 남)은 즉시 덮고, 카드(.box)는 뷰포트가 목표 크기와 일치할
        // 때까지 숨겼다가 표시한다(어떤 리사이즈 시맨틱에서도 튈 수 없음). 1.5s 안에 안 오면 그냥 표시.
        // 레이아웃이 로딩 중 바뀌면 C# 이 새 목표로 재전송 → 세대(_loadGen)로 이전 폴링 무효화.
        const ov = document.getElementById('loading-overlay');
        const box = ov.querySelector('.box');
        _loadGen++;
        if (msg.on) {
          box.querySelector('.label').textContent = msg.label || DEFAULT_LOADING_LABEL;
          const gen = _loadGen;
          const ew = msg.expectW || 0, eh = msg.expectH || 0;
          const match = function () {
            return ew <= 2 || (Math.abs(window.innerWidth - ew) < 4 && Math.abs(window.innerHeight - eh) < 4);
          };
          if (match()) box.style.visibility = 'visible';
          else {
            box.style.visibility = 'hidden';
            const t0 = Date.now();
            const step = function () {
              if (gen !== _loadGen) return;
              if (match() || Date.now() - t0 > 1500) { box.style.visibility = 'visible'; return; }
              setTimeout(step, 50);
            };
            setTimeout(step, 50);
          }
        }
        if (msg.on) {
          // 커버를 즉시(불투명) 덮어 터미널을 완전히 가린다. 부팅/리플로우는 이 아래서 안 보이게 진행.
          ov.style.transition = 'none';
          ov.style.opacity = '1';
          ov.classList.add('on');
          // 커버 DOM(classList) 을 켠 '즉시' C# 에 통지 → C# 은 이 ACK 후에 터미널 HWND 를 unpark 한다.
          // (unpark HWND 리사이즈가 어차피 풀 레이아웃/페인트를 유발하므로 커버는 그때 함께 그려진다 →
          //  rAF 로 페인트를 기다릴 필요 없음. 오히려 파킹 0×0 상태에선 rAF 가 throttle 돼 ACK 가 안 와
          //  2.5s 폴백까지 갔다 — 즉시 통지로 해결.)
          post({ type: 'loadingShown' });
        } else {
          // 준비 완료 — 커버를 즉시 지우지 않고 짧게 fade-out 해 '다 로드된' 터미널을 부드럽게 드러낸다
          // (즉시 제거 시 마지막 프레임이 팍 튀어 보이는 것 방지). 그 사이 새 loading 오면 세대(_loadGen)로 폐기.
          const g = _loadGen;
          ov.style.transition = 'opacity 0.15s ease';
          ov.style.opacity = '0';
          setTimeout(function () {
            if (g !== _loadGen) return;
            ov.classList.remove('on');
            ov.style.opacity = ''; ov.style.transition = '';
          }, 180);
        }
        break;
      }
      case 'focus': {
        const roomId = msg.roomId || activeRoomId;
        const t = terms[roomId];
        if (!t) break;
        if (t.external) { syncExternalOverlay(); break; }

        // 탭 전환 때 WebView2 안의 기존 textarea 포커스를 그대로 넘겨 쓰면 Windows IME가 이전
        // 조합창 기준점을 보존해 (0,0)에 조합 글자를 띄우는 경우가 있다. 사용자가 프로젝트 영역을
        // 눌렀다가 터미널로 돌아오는 것처럼 실제 blur→focus 경계를 만들어 IME 컨텍스트를 갱신한다.
        const active = document.activeElement;
        if (active && active.classList && active.classList.contains('xterm-helper-textarea'))
          active.blur();

        // 전역 탭 단축키는 C#에서 탭을 먼저 바꾸고 그 직후 앱 창을 포그라운드로 올린다. 첫 프레임의
        // document.hasFocus()가 false여도 요청을 버리지 말고 창 활성화가 도착할 때까지만 짧게 기다린다.
        // 같은 방의 새 요청이나 빠른 재전환이 오면 generation/activeRoomId 가 이전 재시도를 폐기한다.
        const focusGen = (t._focusGen || 0) + 1;
        t._focusGen = focusGen;
        let retries = 8;
        const applyFocus = function () {
          if (activeRoomId !== roomId || t._focusGen !== focusGen) return;
          if (!document.hasFocus()) {
            if (--retries > 0) setTimeout(applyFocus, 32);
            return;
          }
          t.term.focus();
          try {
            const row = t.term.buffer.active.cursorY;
            t.term.refresh(row, row); // 새 포커스 뒤 helper-textarea 좌표를 현재 커서와 즉시 동기화
          } catch (e) {}
          // show 없이 현재 탭을 다시 클릭한 경우에도 Claude 자체 블록커서를 즉시 다시 준비한다.
          if (t.el && typeof t.el._prepareImeCaret === 'function') t.el._prepareImeCaret();
        };
        requestAnimationFrame(applyFocus);
        break;
      }
      case 'paste': {
        const t = terms[msg.roomId || activeRoomId];
        if (!t || t.dead || t.external) break;
        const data = msg.data || '';
        // 맨 셸(cmd) 프롬프트에 개행 포함 텍스트를 붙여넣으면 줄마다 명령으로 즉시 실행돼
        // '>'·'=>' 등이 예상치 못한 파일을 만든다. "지금 에이전트가 아니라 맨 셸인가"를 두 신호로 판정:
        //  - bracketed paste(?2004h) OFF: 에이전트(claude/codex/gjc/opencode 등)는 켜고 cmd 는 안 켬.
        //  - 메인(normal) 버퍼: alt-screen 에이전트(claude/codex/opencode)는 alternate 버퍼라 제외되고,
        //    인라인 에이전트(gjc 등, alt-screen 없음)는 bracketed 로 제외된다.
        // 둘 다 성립(off + normal)일 때만 = 맨 cmd → 호스트에 확인 요청. force(확인 통과분)면 바로 붙여넣기.
        // (bracketed 는 크래시 종료 시 ?2004l 유실로 stale-on 가능성 있으나, 기동 실패형 giveup 은
        //  애초에 2004h 를 못 켜 off 로 잡힌다 — 지배적 경로는 커버.)
        if (!msg.force && /[\r\n]/.test(data)) {
          let atShell = true;
          try {
            const bracketed = !!(t.term.modes && t.term.modes.bracketedPasteMode);
            const buf = t.term.buffer && t.term.buffer.active;
            const normalBuffer = !buf || buf.type === 'normal';
            atShell = !bracketed && normalBuffer;
          } catch (e) { atShell = true; }
          if (atShell) {
            post({ type: 'confirmPaste', roomId: (msg.roomId || activeRoomId), data: data });
            break;
          }
        }
        t.term.paste(data);
        break;
      }
      case 'adjustFontSize': {
        cfg.fontSize = msg.size;
        const active = terms[activeRoomId];
        if (active) {
          active.term.options.fontSize = msg.size;
          active.fit.fit();
        }
        break;
      }
      case 'setRoomFontSize': {
        // 전역 cfg.fontSize 는 건드리지 않음 — 이 방(roomId)에만 적용, 다른 방/새 방엔 영향 없음.
        const t = terms[msg.roomId];
        if (t) {
          t.term.options.fontSize = msg.size;
          t.fit.fit();
        }
        break;
      }
      case 'dispose': {
        // 방 삭제 시 — xterm 인스턴스·DOM·버퍼 해제 (메모리 회수)
        disposeGen[msg.roomId] = (disposeGen[msg.roomId] || 0) + 1; // 유예된 preload 재시도 폐기(좀비 방지)
        const t = terms[msg.roomId];
        if (t) {
          t.external = false;
          clearExternalMirrorLayout(t);
          // codex 지연 타이머 해제 — dispose 된 term 에 늦은 write/커서 표시가 가지 않게.
          if (t._coTimer) { clearTimeout(t._coTimer); t._coTimer = 0; }
          t._coChunks = [];
          if (t._curShowTimer) { clearTimeout(t._curShowTimer); t._curShowTimer = 0; }
          t.dead = true; // 닫힌 콜백 참조가 남아도 write 경로가 스스로 무시하게
          try { t.ro && t.ro.disconnect(); } catch (e) {}
          try { t.webgl && t.webgl.dispose(); } catch (e) {} // GPU 컨텍스트 즉시 반납
          try { t.term.dispose(); } catch (e) {}
          try { t.el.remove(); } catch (e) {}
          delete terms[msg.roomId];
          if (activeRoomId === msg.roomId) activeRoomId = null;
          syncExternalOverlay();
        }
        break;
      }
    }
  });

  post({ type: 'pageReady' });
})();
</script>
</body>
</html>
