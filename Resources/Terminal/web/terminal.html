  // END xterm-mouse-compat

  // xterm 의 휠 마우스 리포트를 그대로 발생시킨다(인코딩/프로토콜 판단은 xterm 에 맡긴다 —
  // 번들 wheel 경로와 동일한 button=WHEEL(4), action=UP(0)/DOWN(1)). 앱 마우스 모드가 아니면
  // triggerMouseEvent 가 false 를 돌려주므로 그때는 자극을 포기한다(로컬 스크롤은 claude 에 안 먹는다).
  function sendAltWheel(entry, dir) {
    try {
      const svc = terminalMouseState(entry);
      if (!svc) return false;
      if (!svc.activeProtocol || svc.activeProtocol === 'NONE') return false;
      return triggerTerminalMouseEvent(entry, {
        col: 0, row: 0, x: 1, y: 1,
        button: 4, action: dir === 'up' ? 0 : 1,
        ctrl: false, alt: false, shift: false
      });
    } catch (e) { return false; }
  }

  // 휠 정책의 단일 기준 — 홈 있는 휠 한 칸 = 정확히 3줄. 로컬 스크롤백/앱 휠 보고/방향키 폴백이
  // 모두 같은 줄 수를 쓴다. xterm 기본 경로는 픽셀 델타(한 칸 100px) ÷ 셀 높이로 환산해 한 칸이
  // 5줄 이상 튀고, 마우스 모드 on/off 에 따라 이동량이 갈린다.
  const TERMINAL_WHEEL_LINES_PER_NOTCH = 3;
  // 휠 이벤트 하나가 만들 수 있는 줄 이동 상한(폭주 차단). 한 칸 3줄 기준 약 20칸.
  const TERMINAL_WHEEL_LINE_MAX = 60;
  // 마우스 모드가 켜진 TUI 는 휠 보고 1건에 스스로 몇 줄을 움직인다 — 그 값이 CLI 마다 다르다.
  // 한 칸 3줄을 맞추려면 보고 수를 3 ÷ 이 값으로 정해야 한다(1 = 보고 1건이 1줄).
  const TERMINAL_WHEEL_APP_LINES_PER_REPORT = { claude: 1, codex: 3, devezvibe: 3, gajae: 3 };
  function terminalCellHeight(entry) {
    const screen = entry.term.element && entry.term.element.querySelector('.xterm-screen');
    return screen && entry.term.rows > 0 ? screen.clientHeight / entry.term.rows : 16;
  }
  function terminalWheelPixels(entry, ev) {
    let amount = ev.deltaY;
    const cell = terminalCellHeight(entry);
    if (ev.deltaMode === 1) amount *= cell;
    else if (ev.deltaMode === 2) amount *= cell * entry.term.rows;
    return amount;
  }
  // 이벤트 하나의 이동량을 '줄' 단위 실수로 환산한다(+ = 아래). wheelDelta 는 Chromium 이 채우는
  // 휠 칸 수 × 120 이라 트랙패드의 소수 칸까지 그대로 담긴다 — 이게 있으면 항상 이 값을 쓴다.
  function terminalWheelLineDelta(entry, ev) {
    const legacy = Number(ev.wheelDelta);
    if (Number.isFinite(legacy) && legacy !== 0)
      return -legacy / 120 * TERMINAL_WHEEL_LINES_PER_NOTCH;
    // legacy 값이 없는 폴백: 일반 마우스 기본 deltaY(100px 배수)는 칸으로, 그 밖은 픽셀÷셀 높이로.
    if (ev.deltaMode === 0 && Math.abs(ev.deltaY) >= 80
        && Math.abs(Math.abs(ev.deltaY) % 100) < 0.01)
      return ev.deltaY / 100 * TERMINAL_WHEEL_LINES_PER_NOTCH;
    const cell = terminalCellHeight(entry);
    const px = terminalWheelPixels(entry, ev);
    if (!(cell > 0) || !Number.isFinite(px)) return 0;
    return px / cell;
  }
  // 정수 줄만 실행하고 소수 잔여는 이월한다. 시간 간격으로는 잔여를 버리지 않으므로(방향 전환 때만
  // 버린다) 느리게 굴린 휠도 언젠가 반드시 반영된다 = 휠이 중간에 씹히지 않는다.
  function terminalWheelLines(entry, ev) {
    const lines = terminalWheelLineDelta(entry, ev);
    if (!Number.isFinite(lines) || lines === 0) return 0;
    const carry = (entry._wheelLineCarry && Math.sign(entry._wheelLineCarry) === Math.sign(lines))
      ? entry._wheelLineCarry : 0;
    const acc = carry + lines;
    const whole = acc < 0 ? Math.ceil(acc) : Math.floor(acc);
    entry._wheelLineCarry = acc - whole;
    return Math.max(-TERMINAL_WHEEL_LINE_MAX, Math.min(TERMINAL_WHEEL_LINE_MAX, whole));
  }

  function terminalWheelProtocol(entry) {
    const svc = terminalMouseState(entry);
    if (!svc || !svc.activeProtocol || svc.activeProtocol === 'NONE') return null;
    const protocol = svc._protocols && svc._protocols[svc.activeProtocol];
    // X10처럼 wheel event bit가 없는 모드는 일반 버퍼/방향키 경로로 처리한다.
    return protocol && (protocol.events & 16) !== 0 ? svc : null;
  }

  function sendTerminalWheelReport(entry, ev, dir) {
    try {
      const core = entry.term._core;
      const screen = core.screenElement || entry.term.element.querySelector('.xterm-screen');
      let pos = null;
      const coords = core._mouseService && (typeof core._mouseService.getMouseReportCoords === 'function'
        ? core._mouseService : core._mouseService._mouseCoordsService);
      if (coords && typeof coords.getMouseReportCoords === 'function')
        pos = coords.getMouseReportCoords(ev, screen);
      if (!pos && screen) {
        const rect = screen.getBoundingClientRect();
        const px = Math.max(0, Math.min(ev.clientX - rect.left, Math.max(0, rect.width - 1)));
        const py = Math.max(0, Math.min(ev.clientY - rect.top, Math.max(0, rect.height - 1)));
        const cw = rect.width / Math.max(1, entry.term.cols);
        const ch = rect.height / Math.max(1, entry.term.rows);
        pos = {
          col: Math.min(entry.term.cols - 1, Math.floor(px / Math.max(1, cw))),
          row: Math.min(entry.term.rows - 1, Math.floor(py / Math.max(1, ch))),
          x: Math.floor(px), y: Math.floor(py)
        };
      }
      if (!pos) pos = { col: 0, row: 0, x: 1, y: 1 };
      return triggerTerminalMouseEvent(entry, {
        col: pos.col, row: pos.row, x: pos.x, y: pos.y,
        button: 4, action: dir < 0 ? 0 : 1,
        ctrl: ev.ctrlKey, alt: ev.altKey, shift: ev.shiftKey
      });
    } catch (e) { return false; }
  }

  function handleTerminalWheel(entry, ev) {
    // Ctrl+휠은 위의 capture 핸들러가 글꼴 크기로 처리한다. xterm 스크롤까지 중복 실행하지 않는다.
    if (ev.ctrlKey && !ev.altKey && !ev.shiftKey) {
      entry._wheelLineCarry = 0;
      return false;
    }
    if (ev.deltaY === 0) return true;
    if (ev.shiftKey) {
      entry._wheelLineCarry = 0;
      return true;
    }

    // 모든 경로(로컬 스크롤백 / 앱 휠 보고 / 방향키)가 같은 줄 수를 쓴다 — 마우스 모드 on/off 나
    // 버퍼 종류에 따라 한 칸의 이동량이 갈리지 않는다.
    const lines = terminalWheelLines(entry, ev);
    ev.preventDefault();
    ev.stopPropagation();
    if (lines === 0) return false; // 한 줄 미만은 잔여로 이월 — 다음 이벤트에서 이어진다
    const dir = lines < 0 ? -1 : 1;
    const count = Math.abs(lines);

    const svc = terminalWheelProtocol(entry);
    if (svc) {
      // 보고 1건이 앱에서 몇 줄이 되는지로 나눠 보고 수를 정한다. 한 칸에 보고를 줄 수만큼(3건)
      // 보내면 이미 보고당 3줄을 움직이는 CLI(devezvibe/codex)에서 10줄 가까이 튄다.
      const perReport = TERMINAL_WHEEL_APP_LINES_PER_REPORT[entry.agent] || 1;
      const reports = Math.max(1, Math.round(count / perReport));
      if (!sendTerminalWheelReport(entry, ev, dir)) return true; // 보고 실패 — xterm 기본에 맡김
      for (let i = 1; i < reports; i++) sendTerminalWheelReport(entry, ev, dir);
      return false;
    }

    const coreBuffer = entry.term._core && entry.term._core.buffer;
    const buffer = entry.term.buffer.active;
    const hasScrollback = coreBuffer && typeof coreBuffer.hasScrollback === 'boolean'
      ? coreBuffer.hasScrollback : buffer.type === 'normal' && buffer.baseY > 0;
    if (hasScrollback) {
      try { entry.term.scrollLines(lines); } catch (e) { return true; }
      return false;
    }

    // 스크롤백 없는 alt 버퍼 + 마우스 모드 off → 방향키로 전달한다.
    try {
      const core = entry.term._core;
      const appCursor = core && core.coreService && core.coreService.decPrivateModes.applicationCursorKeys;
      const key = '\x1b' + (appCursor ? 'O' : '[') + (dir < 0 ? 'A' : 'B');
      for (let i = 0; i < count; i++) entry.term.input(key, true);
    } catch (e) { return true; }
    return false;
  }
  // 행별 '보이지 않는 글자' 판별 맵 — 버퍼에 글자는 있는데(gap 작음) 화면이 비어 보이는 모순의
  // 최종 판별자. 각 행: '#'=보이는 글자 있음, 'I'=글자 전부 fg==bg(투명 글자 = SGR 색 desync),
  // '.'=빈 행. 'I' 가 나오면 셀 손실도 페인트 낡음도 아니라 '색 상태 오염'이 원인으로 확정된다.
  function attrMap(entry, roomId, tag, logAlways) {
    try {
      const buf = entry.term.buffer.active;
      let map = '', sample = '';
      for (let y = 0; y < entry.term.rows; y++) {
        const line = buf.getLine(y);
        if (!line) { map += '?'; continue; }
        let text = 0, invisible = 0;
        for (let x = 0; x < line.length; x++) {
          const c = line.getCell(x);
          if (!c) continue;
          const ch = c.getChars();
          if (!ch || ch === ' ') continue;
          text++;
          // fg 와 bg 가 같은 모드·같은 값이면 투명 글자. 기본색(fg default 위 bg default)은 정상 표시.
          const fgD = c.isFgDefault(), bgD = c.isBgDefault();
          const same = (!fgD && !bgD)
            ? (c.getFgColor() === c.getBgColor()
               && !!c.isFgRGB() === !!c.isBgRGB() && !!c.isFgPalette() === !!c.isBgPalette())
            : false;
          if (same) {
            invisible++;
            if (!sample) sample = 'y=' + y + ' x=' + x + ' ch=' + ch
              + ' fg=' + c.getFgColor() + (c.isFgRGB() ? 'rgb' : c.isFgPalette() ? 'pal' : 'def')
              + ' bg=' + c.getBgColor() + (c.isBgRGB() ? 'rgb' : c.isBgPalette() ? 'pal' : 'def');
          }
        }
        map += text === 0 ? '.' : (invisible >= text * 0.8 ? 'I' : '#');
      }
      // 'I'(투명 글자 행)가 있을 때만 로그 — 정상 화면에서 매 tick 스팸 방지. logAlways 는 기준선용.
      if (logAlways || map.indexOf('I') !== -1)
        dlog('attrMap(' + tag + ') room=' + roomId + ' [' + map + ']' + (sample ? ' ' + sample : ''));
      return map;
    } catch (e) { dlog('attrMap(' + tag + ') err ' + e); return ''; }
  }

  // fit(리사이즈)마다 무장하는 감시자. 전환 커버·reveal 경로와 완전히 독립이다 — 커버 갈래와
  // 세대 무효화에 걸려 실행되지 않던 문제(실측: 최대화 전환에서 판정 자체가 안 돌았다)를 피한다.
  // pre 는 '리사이즈 직전'(=정상 프레임) 화면의 최대 내부 공백. 기준선이 없으면 손대지 않는다 —
  // 세션 재실행(resume)·신규 생성 직후는 claude 가 히스토리를 다시 그리는 중이라 '비어 있는 게
  // 정상'이고, 그걸 손상으로 오판해 자극하면 claude 가 과거 히스토리 위로 스크롤된 채 남는다.
  function armBlankAudit(entry, roomId, preGap, tag) {
    if (!BLANK_HEAL_SCROLL || preGap < 0) return;
    entry._auditDeadline = Date.now() + BlankAuditWindowMs;
    if (entry._auditTimer) return;     // 이미 감시 중 — 첫(정상 화면) 기준선을 유지하고 창만 연장
    entry._auditPre = preGap;
    entry._auditLastGap = -2;
    entry._auditHeals = 0;
    entry._auditDamageAt = 0;
    dlog('blankAudit armed room=' + roomId + ' pre=' + preGap + ' ' + (tag || ''));
    const tick = function () {
      entry._auditTimer = 0;
      if (entry.dead || terms[roomId] !== entry) return;
      const now = Date.now();
      if (entry._healing || now - (entry._lastAnyInputAt || 0) < 2000) {
        if (now < entry._auditDeadline) entry._auditTimer = setTimeout(tick, 200);
        return;
      }
      // busy(출력이 흐르는 중)엔 개입 금지 — full-repaint claude 는 매 렌더마다 전체 프레임을
      // 다시 그려서 띠가 스스로 메워지고, 프레임 높이도 정상적으로 출렁인다(실측 01:15 gap 1↔7↔9).
      // 그때 치유하면 정상 렌더와 싸워 왕복 깜빡임이 된다. idle 1.2s 이상일 때만 판정한다.
      if (now - (entry._lastOutAt || 0) < 1200) {
        entry._auditDamageAt = 0; // 출력이 흐르면 손상 지속 관측 리셋
        if (now < entry._auditDeadline) entry._auditTimer = setTimeout(tick, 300);
        return;
      }
      const gap = altInteriorGap(entry);
      // '건강한 프레임' 실측 기준선 — 이 방에서 gap<=2 를 한 번이라도 보면 그게 기준이다.
      // 무장 시점 스냅샷(pre)만 쓰면 손상 상태에서 재무장할 때 기준선이 오염돼(실측 pre=22)
      // 이후 손상을 전혀 못 본다(분할 후 "조정 로직이 안 탄다"의 실체).
      if (gap >= 0 && gap <= 2) entry._healthyGap = gap;
      const base = (entry._healthyGap != null) ? entry._healthyGap : entry._auditPre;
      if (gap >= BlankHealMinGap && gap > base) {
        if (!entry._auditDamageAt) {
          // 1차 관측 — 600ms 뒤에도 남아 있어야 손상으로 확정(일시 프레임 오판 방지).
          entry._auditDamageAt = now;
          entry._auditDeadline = Math.max(entry._auditDeadline, now + 4000);
          entry._auditTimer = setTimeout(tick, 700);
          return;
        }
        // 전환 커버가 올라와 있으면(분할 등) 폭이 유동적이고 어차피 가려져 있다 — 끝난 뒤로 미룬다.
        // (실측 01:22 bounce#1 이 이 상태에서 조용히 무시돼 치유 1회를 공쳤다.)
        if (_fitSuppressed) {
          entry._auditDamageAt = now;
          entry._auditTimer = setTimeout(tick, 500);
          return;
        }
        entry._auditHeals++;
        entry._auditDeadline = Math.max(entry._auditDeadline, now + 6000);
        entry._auditDamageAt = 0;
        if (entry._auditHeals <= 2) {
          // 치유 = 캡처 이미지로 덮은 스크롤 버스트. 깊은 스크롤만이 유일하게 유효하다(반복 실측:
          // rows 바운스 무효 01:22 gap 7→7 — full-repaint 도 '프레임'만 다시 그려 프레임 밖 상단
          // 띠는 영영 안 그린다). 현재 화면 캡처로 덮고 진행하면 사용자에게는 정지 화면이
          // 치유된 화면으로 크로스페이드되는 것으로만 보인다(무깜빡).
          entry._healing = true;
          entry._healStarted = false;
          dlog('blankHeal request-cover room=' + roomId + ' gap=' + gap + ' base=' + base);
          dumpMap(roomId, 'blank-heal-before');
          post({ type: 'healCover', roomId: roomId });
          // C# 캡처 응답(healCoverImg)이 버스트를 시작한다. 응답 유실 폴백: 900ms 후 커버 없이 시작.
          setTimeout(function () {
            if (entry._healing && !entry._healStarted) startHealBurst(entry, roomId, null);
          }, 900);
          entry._auditTimer = setTimeout(tick, 1200);
        } else {
          dlog('blankAudit give-up room=' + roomId + ' gap=' + gap + ' base=' + base);
        }
        return;
      }
      entry._auditDamageAt = 0;
      if (gap !== entry._auditLastGap) { // 변화만 기록(로그 스팸 방지)
        entry._auditLastGap = gap;
        dlog('blankAudit clean room=' + roomId + ' gap=' + gap + ' base=' + base);
        dumpMap(roomId, 'blank-audit-clean');
      }
      // claude 재렌더는 수 초에 걸쳐 나뉘어 오고 손상은 유휴 재페인트에서 늦게도 생긴다 — 창이 남은 동안 재검사.
      if (now < entry._auditDeadline) entry._auditTimer = setTimeout(tick, 400);
    };
    entry._auditTimer = setTimeout(tick, 300);
  }
  // 치유 커버(캡처 이미지) 전용 오버레이 — xfer-cover 의 전환 상태기계(gen/suppress)와 분리해
  // 서로의 표시 상태를 오염시키지 않는다. z-index 는 xfer-cover(45)보다 위(46).
  let _healCoverEl = null;
  function ensureHealCover() {
    if (_healCoverEl) return _healCoverEl;
    const d = document.createElement('div');
    d.id = 'heal-cover';
    d.style.cssText = 'position:absolute;inset:0;z-index:46;display:none;pointer-events:none;'
      + 'background-color:var(--term-bg,#0C0C0C);background-repeat:no-repeat;background-position:top left;';
    document.body.appendChild(d);
    _healCoverEl = d;
    return d;
  }
  // 스크롤 버스트 본체(무깜빡판) — 사용자의 실제 회복 조작("휠을 쭉 올렸다 내리면 정상")의 재현.
  // 얕은 왕복(1틱·3틱)은 무효/역효과 실측 — claude 는 깊은 스크롤로 과거 전사가 실제로 뷰에
  // 들어와야 그 행들을 다시 그린다. imgMsg(현재 화면 캡처)가 있으면 그 이미지로 덮은 채 진행해
  // 스크롤이 전혀 보이지 않고, 끝나면 치유된 화면으로 크로스페이드된다.
  function startHealBurst(entry, roomId, imgMsg) {
    if (entry._healStarted) return; // 캡처 응답과 900ms 폴백의 중복 시작 방지
    entry._healStarted = true;
    if (entry.dead || terms[roomId] !== entry) { entry._healing = false; return; }
    if (!sendAltWheel(entry, 'up')) {
      entry._healing = false;
      dlog('blankHeal unavailable room=' + roomId
        + ' proto=' + ((terminalMouseState(entry) && terminalMouseState(entry).activeProtocol) || 'x'));
      return;
    }
    const cov = imgMsg && imgMsg.image ? ensureHealCover() : null;
    if (cov) {
      cov.style.transition = 'none';
      cov.style.backgroundImage = 'url("' + imgMsg.image + '")';
      cov.style.backgroundSize = (imgMsg.imgW > 0 && imgMsg.imgH > 0)
        ? (imgMsg.imgW + 'px ' + imgMsg.imgH + 'px') : '100% 100%';
      cov.style.opacity = '1';
      cov.style.display = 'block';
    }
    dlog('blankHeal scrollburst room=' + roomId + (cov ? ' img-covered' : ' bare'));
    const uncover = function () {
      if (!cov) return;
      cov.style.transition = 'opacity 0.16s ease';
      cov.style.opacity = '0';
      setTimeout(function () { cov.style.display = 'none'; cov.style.backgroundImage = ''; }, 220);
    };
    let up = 0;
    const upT = setInterval(function () {
      sendAltWheel(entry, 'up');
      if (++up >= 12) clearInterval(upT);
    }, 20);
    setTimeout(function () {
      let down = 0;
      const downT = setInterval(function () {
        sendAltWheel(entry, 'down');
        if (++down >= 30) clearInterval(downT);
      }, 20);
      setTimeout(function () {
        entry._healing = false;
        const after = altInteriorGap(entry);
        dlog('blankHeal done room=' + roomId + ' ->' + after);
        dumpMap(roomId, 'blank-heal-after');
        // 바닥 복귀 재렌더가 페인트된 다음 프레임에 걷어 커버 아래 완성 화면만 보이게.
        requestAnimationFrame(function () { requestAnimationFrame(uncover); });
      }, 30 * 20 + 420);
    }, 12 * 20 + 260);
  }

  // ── 극소 박스 가드 ────────────────────────────────────────────────────
  // 패널 인수(분할 보기/분할 닫기)로 세션이 다른 패널의 WebView 로 옮겨질 때, 새 xterm 은 아직
  // 레이아웃되지 않은 컨테이너(실측 26px 등)에서 첫 fit 을 한다. FitAddon 은 그런 박스에 2~3 컬럼을
  // 제안하고, 그 크기가 ConPTY 로 나가면 **살아있는 TUI(claude)가 2컬럼으로 레이아웃을 재계산**한다.
  // 곧 정상 폭으로 되돌려도 TUI 는 차분 갱신이라 위쪽 전사를 다시 그리지 않는다 → "세션 중앙 텅 빔"이
  // 고착된다(§6.5 의 '0폭 fit → 2x1 제안 → TUI 붕괴'와 같은 함정, 임계값이 2px 라 26px 를 통과했다).
  // → 제안 크기가 비정상적으로 작으면 fit 도, ConPTY 로 가는 크기 통보도 하지 않고 폭이 잡힐 때까지 기다린다.
  const MinSaneCols = 20;
  const MinSaneRows = 5;
  function fitProposalSane(entry) {
    if (!entry) return false;
    try {
      if (typeof entry.fit.proposeDimensions === 'function') {
        const d = entry.fit.proposeDimensions();
        return !!d && d.cols >= MinSaneCols && d.rows >= MinSaneRows;
      }
    } catch (e) { /* 폴백: 픽셀 박스로 판정 */ }
    return entry.el.clientWidth >= 160 && entry.el.clientHeight >= 80;
  }
  /// ConPTY 로 크기를 통보해도 되는 상태인지(그리드가 기본값 80x24 로 남아 있는 채 통보하면 살아있는
  /// 세션을 그 크기로 줄여버린다).
  function canPostSize(entry) {
    return !!entry && !entry.dead && fitProposalSane(entry)
      && entry.term.cols >= MinSaneCols && entry.term.rows >= MinSaneRows;
  }

  // OSC 8 링크 provider와 일반 URL provider가 같은 URL을 잡으면 클릭 1회가 두 번 열릴 수 있다.
  // Ctrl+클릭 뒤 늦게 따라오는 xterm fallback까지 같은 URL은 5초간 한 번만 연다.
  let _lastExternalUrl = '';
  let _lastExternalUrlAt = 0;
  function requestOpenExternalUrl(url) {
    const now = Date.now();
    if (url === _lastExternalUrl && now - _lastExternalUrlAt < 5_000) {
      dlog('terminalUrl duplicate skipped ' + url);
      return;
    }
    _lastExternalUrl = url;
    _lastExternalUrlAt = now;
    dlog('terminalUrl request ' + url);
    // xterm의 mouseup 처리와 선택 상태 해제가 모두 끝난 다음 브라우저 열기를 요청한다.
    setTimeout(function () {
      post({ type: 'openExternalUrl', url: url });
    }, 0);
  }

  // xterm의 OSC 8 fallback은 confirm 뒤 window.open을 직접 호출한다. linkHandler가 어떤 이유로
  // 적용되지 않아도 이 페이지 밖으로 새지 않게 여기서 가로채 같은 C# URL 게이트로 보낸다.
  const nativeWindowOpen = window.open.bind(window);
  window.open = function(url, target, features) {
    const value = typeof url === 'string' ? url : String(url || '');
    if (/^https?:\/\//i.test(value)) {
      dlog('terminalUrl window.open intercepted ' + value);
      requestOpenExternalUrl(value);
      return null;
    }
    return nativeWindowOpen(url, target, features);
  };

  // 위 fallback의 xterm 고정 경고창만 생략한다. URL 클릭 자체가 사용자 동작이고,
  // 실제 열기 대상은 Settings의 인앱 탭/기본 브라우저 정책과 http(s) 검증을 그대로 거친다.
  const nativeConfirm = window.confirm.bind(window);
  window.confirm = function(message) {
    const text = String(message || '');
    if (text.startsWith('Do you want to navigate to ') &&
        text.includes('WARNING: This link could potentially be dangerous')) {
      dlog('terminalUrl xterm confirm bypassed');
      return true;
    }
    return nativeConfirm(message);
  };

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // ── 동기화 업데이트(DECSET 2026) 배칭 ────────────────────────────────
  // gjc(멀티플렉서 모드)는 응답 한 줄이 추가될 때마다 변경 구간(새 줄~하단 입력창)을
  // \x1b[2K(줄 지움)+다시그리기로 repaint 하고 그 전체를 \x1b[?2026h … \x1b[?2026l 로
  // 감싸 "한 프레임에 원자적으로 그려라"고 지시한다. 그러나 번들된 xterm 5.5.0 은
  // ?2026 을 지원하지 않고, C# PTY 출력은 chunk 단위로 쪼개 보내므로 repaint 가 여러
  // term.write() 로 나뉘어 입력창이 지워졌다 다시 그려지는 중간 상태가 노출된다(튐).
  // → 여기서 open~close 사이 바이트를 모아 close 가 올 때 한 번의 write 로 흘려보낸다.
  const SYNC_OPEN  = [0x1b, 0x5b, 0x3f, 0x32, 0x30, 0x32, 0x36, 0x68]; // ESC[?2026h
  const SYNC_CLOSE = [0x1b, 0x5b, 0x3f, 0x32, 0x30, 0x32, 0x36, 0x6c]; // ESC[?2026l

  function indexOfSeq(buf, seq, from) {
    outer: for (let i = from; i + seq.length <= buf.length; i++) {
      for (let j = 0; j < seq.length; j++) if (buf[i + j] !== seq[j]) continue outer;
      return i;
    }
    return -1;
  }
  // buf 의 끝이 seq 의 진부분 접두사이면(=마커가 chunk 경계에서 잘림) 그 시작 인덱스, 없으면 -1.
  function trailingPrefixStart(buf, seq) {
    const maxLen = Math.min(seq.length - 1, buf.length);
    for (let len = maxLen; len > 0; len--) {
      let ok = true;
      for (let j = 0; j < len; j++) if (buf[buf.length - len + j] !== seq[j]) { ok = false; break; }
      if (ok) return buf.length - len;
    }
    return -1;
  }
  function concatBytes(a, b) {
    const r = new Uint8Array(a.length + b.length); r.set(a, 0); r.set(b, a.length); return r;
  }
  function concatAll(arr) {
    let n = 0; for (let i = 0; i < arr.length; i++) n += arr[i].length;
    const r = new Uint8Array(n); let o = 0;
    for (let i = 0; i < arr.length; i++) { r.set(arr[i], o); o += arr[i].length; }
    return r;
  }

  // bytes 를 동기화 마커 기준으로 처리. sync 밖은 즉시 flush, open~close 는 모아 한 번에 flush.
  // 마커가 chunk 경계에서 잘릴 수 있어 끝의 부분 접두사는 entry.syncCarry 로 다음 chunk 까지 보류.
  // ── codex 커서 가시성 정책 ─────────────────────────────────────────────
  // codex TUI 는 리페인트마다 커서를 숨김(?25l)→그리기→표시(?25h)로 토글하고, 표시 위치도
  // 프레임마다 다르게 파킹한다(스피너 중 화면 중간에 켜두기도 함). 네이티브 터미널(WT)에서도
  // 커서가 튀고 블링크가 빨라지는 알려진 codex 버그(openai/codex#9081, not planned 로 닫힘).
  // → codex 출력에서 ?25l/?25h 를 전부 걷어내고 우리가 관리한다:
  //    숨김은 즉시 적용, 표시는 CODEX_CURSOR_SHOW_DELAY ms 동안 조용할 때만 적용.
  //    리페인트 폭풍(응답 생성) 동안은 커서가 조용히 숨고, 출력이 멎으면(입력 대기) 정상 표시.
  const CODEX_CURSOR_SHOW_DELAY = 150;
  // 사용자 키 입력 후 이 창(ms) 안의 리페인트는 편집(화살표 이동 등)으로 보고 커서를 강제로 숨기지
  // 않는다. 키 리피트 간격을 덮을 만큼 넉넉히(생성 폭풍은 입력 없이 오므로 이 창 밖 → 기존 정책 유지).
  const CODEX_CURSOR_INTERACTIVE_MS = 400;

  // bytes 에서 ESC[?25h(1b 5b 3f 32 35 68) / ESC[?25l(…6c) 를 모두 제거하고
  // 마지막 op(0=없음, 1=show, 2=hide)를 함께 반환.
  function stripCursorVis(bytes) {
    let found = false;
    for (let i = 0; i + 5 < bytes.length; i++) {
      if (bytes[i] === 0x1b && bytes[i + 1] === 0x5b && bytes[i + 2] === 0x3f &&
          bytes[i + 3] === 0x32 && bytes[i + 4] === 0x35 &&
          (bytes[i + 5] === 0x68 || bytes[i + 5] === 0x6c)) { found = true; break; }
    }
    if (!found) return { bytes, lastOp: 0 };
    const out = new Uint8Array(bytes.length);
    let o = 0, lastOp = 0;
    for (let i = 0; i < bytes.length; i++) {
      if (i + 5 < bytes.length && bytes[i] === 0x1b && bytes[i + 1] === 0x5b && bytes[i + 2] === 0x3f &&
          bytes[i + 3] === 0x32 && bytes[i + 4] === 0x35 &&
          (bytes[i + 5] === 0x68 || bytes[i + 5] === 0x6c)) {
        lastOp = bytes[i + 5] === 0x68 ? 1 : 2;
        i += 5; continue;
      }
      out[o++] = bytes[i];
    }
    return { bytes: out.subarray(0, o), lastOp };
  }

  // 표시 타이머 (재)예약 — CODEX_CURSOR_SHOW_DELAY 동안 새 리페인트가 없으면 그때 커서를 켠다.
  function scheduleCursorShow(entry) {
    if (entry._curShowTimer) clearTimeout(entry._curShowTimer);
    entry._curShowTimer = setTimeout(function () {
      entry._curShowTimer = 0;
      if (!entry.dead) { try { entry.term.write('\x1b[?25h'); } catch (e) {} }
    }, CODEX_CURSOR_SHOW_DELAY);
  }

  // codex 세션의 flush 직전 훅. 가시성 시퀀스를 걷어내고 debounce 정책을 적용한 bytes 를 반환.
  // 핵심: 토글이 포함된 배치 = 리페인트 진행 중 — 배치가 표시(?25h)로 '끝나더라도' 그 끝 위치는
  // 프레임마다 달라(화면 중간 파킹 포함) 그대로 켜두면 커서가 프레임 끝 위치를 따라다니며 튄다.
  // → 토글이 보이면 무조건 즉시 숨기고, 조용해진 뒤(타이머)에만 켠다.
  function applyCodexCursorPolicy(entry, bytes) {
    const r = stripCursorVis(bytes);
    if (r.lastOp === 0) {
      // 토글 없는 배치 — 폭풍 중(표시 대기)이면 표시를 더 미룬다. 평시(셸 프롬프트 등)는 무간섭.
      if (entry._curShowTimer) scheduleCursorShow(entry);
      return r.bytes;
    }
    if (entry._curShowTimer) { clearTimeout(entry._curShowTimer); entry._curShowTimer = 0; }
    // 사용자 입력 직후(편집·화살표 이동)면 리페인트가 자율 생성 폭풍이 아니라 커서 위치가 의미 있는
    // 편집이다 — 강제 숨김 없이 codex 의 마지막 의사(show/hide)를 즉시 반영해 커서가 보이게 한다.
    if (Date.now() - (entry._lastInputAt || 0) < CODEX_CURSOR_INTERACTIVE_MS) {
      entry.term.write(r.lastOp === 1 ? '\x1b[?25h' : '\x1b[?25l');
      return r.bytes;
    }
    entry.term.write('\x1b[?25l'); // 리페인트 중 커서 노출 금지 (끝 위치가 어디든)
    if (r.lastOp === 1) scheduleCursorShow(entry); // 표시를 원하면 조용해진 뒤에
    return r.bytes;
  }

  function feedSync(entry, bytes, flush) {
    let buf = bytes;
    if (entry.syncCarry && entry.syncCarry.length) { buf = concatBytes(entry.syncCarry, bytes); entry.syncCarry = null; }
    let pos = 0;
    while (pos < buf.length) {
      if (!entry.inSync) {
        const open = indexOfSeq(buf, SYNC_OPEN, pos);
        if (open === -1) {
          const pre = trailingPrefixStart(buf, SYNC_OPEN);
          if (pre >= pos) { if (pre > pos) flush(buf.subarray(pos, pre)); entry.syncCarry = buf.slice(pre); }
          else flush(buf.subarray(pos));
          return;
        }
        if (open > pos) flush(buf.subarray(pos, open)); // open 이전은 즉시
        entry.inSync = true;
        entry.syncChunks = [buf.subarray(open, open + SYNC_OPEN.length)]; // 마커도 버퍼에(xterm 무시)
        pos = open + SYNC_OPEN.length;
      } else {
        const close = indexOfSeq(buf, SYNC_CLOSE, pos);
        if (close === -1) {
          const pre = trailingPrefixStart(buf, SYNC_CLOSE);
          if (pre >= pos) { if (pre > pos) entry.syncChunks.push(buf.subarray(pos, pre)); entry.syncCarry = buf.slice(pre); }
          else entry.syncChunks.push(buf.subarray(pos));
          return;
        }
        const end = close + SYNC_CLOSE.length;
        entry.syncChunks.push(buf.subarray(pos, end));
        flush(concatAll(entry.syncChunks)); // open~close 전체를 한 번에
        entry.syncChunks = [];
        entry.inSync = false;
        pos = end;
      }
    }
  }

  // pin/suppress 정책을 적용해 실제 term 에 쓴다(기존 output 분기 로직을 함수화).
  function writeOut(t, bytes) {
    t._lastOutAt = Date.now(); // 리사이즈 후 재렌더 quiet 판정용(armBlankAudit)
    // 비활성(display:none) 탭은 스크롤 위치 계산이 무의미하고, scrollHeight 읽기가 강제 레이아웃을
    // 유발해 5세션 동시 출력 시 큰 비용이 된다. write 만 하고 끝낸다(탭 전환 show 시 scrollToBottom 처리).
    if (t._dbgUntil && Date.now() < t._dbgUntil && (t._dbgCount || 0) < 14) {
      t._dbgCount = (t._dbgCount || 0) + 1;
      var snip = String(bytes).slice(0, 70).replace(/\x1b/g, '\\e').replace(/[\x00-\x1f]/g, function (c) { return '\\x' + c.charCodeAt(0).toString(16); });
      dlog('out room=' + t.roomId + ' len=' + (bytes && bytes.length) + ' "' + snip + '"');
    }
    // 분할 열기 자체의 SIGWINCH 재렌더는 저장 화면과 같은 내용이므로 잠깐 허용한다. 이후 실제 출력이
    // 진행되면(다른 패널이 활성이라도) 오래된 전체폭 스냅샷을 쓰지 않고 닫기 직전
    // pre-redraw 셀을 폴백으로 사용한다.
    if (t._splitWideSnapshot && Date.now() - t._splitWideSnapshot.capturedAt > 1200) {
      t._splitWideSnapshot = null;
      dlog('splitCloseCapture invalidated room=' + t.roomId + ' reason=output');
    }
    if (!activeRoomId || terms[activeRoomId] !== t) { t.term.write(bytes); return; }
    if (Date.now() < _pinBottomUntil) {
      t.term.write(bytes);
      requestAnimationFrame(function () { try { t.term.scrollToBottom(); } catch (e) {} });
    } else if (_scrollSuppress > 0) {
      _scrollSuppress--;
      const vp = t.term.element.querySelector('.xterm-viewport');
      const saved = vp ? vp.scrollTop : 0;
      t.term.write(bytes);
      if (vp) requestAnimationFrame(function () { vp.scrollTop = saved; });
    } else {
      // near-bottom sticky follow — 쓰기 직전 바닥에서 2줄 이내면 쓴 뒤 맨 아래로 붙인다.
      // xterm 은 "정확히 바닥"일 때만 새 출력을 자동 추종하는데, gjc 고빈도 재페인트 중 사용자가
      // 위로 올렸다 바닥 근처까지 내리면 몇 줄 모자라 추종이 끊긴다(맨 아래로 안 붙고 PageDown 필요).
      // 바닥 근처면 추종을 재개해 일반 터미널처럼 동작. 위로 올려 읽는 중(임계값 밖)엔 개입 안 함.
      let stick = false;
      if (t.agent === 'codex' || t.agent === 'gajae') {
        // codex/gjc 는 인라인 TUI 라 매 프레임 clear+rewrite 로 baseY(스크롤백 길이)가 출렁이고,
        // 첫 위쪽 휠의 기본 처리가 반영되기 전 다음 write 가 오면 DOM 위치 판정이 아직 바닥이라
        // scrollToBottom 예약이 첫 스크롤을 되돌린다. 사용자 스크롤 의도(entry.follow: 휠/키
        // 핸들러가 먼저 갱신)만 보고 추종 여부를 정한다(표준 터미널 동작).
        stick = t.follow;
        t.term.write(bytes);
      } else {
        const vp = t.term.element && t.term.element.querySelector('.xterm-viewport');
        if (vp) {
          const cell = (vp.clientHeight / t.term.rows) || 16;
          stick = (vp.scrollHeight - vp.clientHeight - vp.scrollTop) <= cell * 2 + 2;
        }
        t.term.write(bytes);
      }
      if (stick) requestAnimationFrame(function () { try { t.term.scrollToBottom(); } catch (e) {} });
    }
    // 전환 커버가 '리사이즈 후 재렌더 출력'을 기다리는 중이면 통지(청크 크기 포함 — codex 는
    // 큰 프레임=재페인트 판정, gjc 는 quiet 디바운스, 그 외는 첫 호출에 즉시 걷는다).
    if (_xferDataWaiter && terms[_xferDataWaiter.room] === t) { const w = _xferDataWaiter; w.fire((bytes && bytes.length) || 0); }
  }

  // 코얼레싱 창에 모인 청크를 즉시 흘린다(타이머 만료 / 세션 종료 통지 직전).
  function flushCoalesced(t) {
    if (t._coTimer) { clearTimeout(t._coTimer); t._coTimer = 0; }
    const chunks = t._coChunks; t._coChunks = [];
    if (!chunks || !chunks.length) return;
    // 동기화 업데이트(?2026) 구간은 여전히 한 번의 write 로 모아 흘린다(gjc 처럼 마커로 실제
    // 페이로드를 감싸 보내는 경로 보존). pin/suppress 정책은 flush 시점(writeOut)에 적용.
    feedSync(t, concatAll(chunks), function (out) {
      // codex 는 커서를 입력창으로 되돌리는 프레임을 sync 블록 '밖'에서 보내므로, 6.x 네이티브
      // ?2026(원자 렌더)으로도 커서 튐이 남는다(WT 에서도 #9081 로 발생). 엔진 무관 codex 자체
      // 동작 → 커서 숨김 debounce 정책 유지가 유일한 대응.
      if (t.agent === 'codex') out = applyCodexCursorPolicy(t, out);
      writeOut(t, out);
    });
  }

  // ── 마우스 모드 그대로 전달 ──────────────────────────────────────────
  // claude 등 TUI 가 켜는 마우스 트래킹(DECSET ?1000/1002/1003/1006)을 막지 않는다
  // → xterm 이 마우스 모드로 들어가 휠 스크롤/클릭/드래그가 앱으로 직접 전달(일반 WT 정합).
  // 마우스 모드 중 드래그하면 claude 가 자체 선택 후 OSC 52 로 복사한다 — 이를 클립보드에
  // 반영하는 처리는 createTerm 의 registerOscHandler(52) 참고. 마우스 모드를 안 쓰는 일반
  // 셸/화면에서는 xterm 로컬 드래그 선택 + copy-on-select(mouseup) 로 복사된다.
  // WT 스킴 → xterm ITheme (WT의 purple == ANSI magenta)
  function toXtermTheme(s) {
    const t = {
      background: s.background, foreground: s.foreground,
      cursor: s.cursorColor, cursorAccent: s.background,
      black: s.black, red: s.red, green: s.green, yellow: s.yellow,
      blue: s.blue, magenta: s.purple, cyan: s.cyan, white: s.white,
      brightBlack: s.brightBlack, brightRed: s.brightRed,
      brightGreen: s.brightGreen, brightYellow: s.brightYellow,
      brightBlue: s.brightBlue, brightMagenta: s.brightPurple,
      brightCyan: s.brightCyan, brightWhite: s.brightWhite,
    };
    if (s.selectionBackground) t.selectionBackground = s.selectionBackground;
    return t;
  }

  // gjc 전용 드래그 선택색 — claude 선택색(#267F78)과 동일하게. gjc 는 xterm 로컬 선택을
  // 쓰므로(마우스 모드 swallow) 방별로 selectionBackground 만 덮어쓴다. selectionForeground 는
  // 안 건다(단색 고정 시 색-기반 볼드 사라짐) — 원래 글자색/볼드 유지. 셸/타 에이전트는 기본색.
  // 테마별 gjc 선택색(배경색으로 현재 테마 판별 — soft/minimal 은 라이트, 기본은 dark).
  function gjcSelectionBg() {
    const bg = ((cfg.theme && cfg.theme.background) || '').toLowerCase();
    if (bg === '#f2ede6') return '#C2D8B0'; // soft
    if (bg === '#f8fafc') return '#C5D8F8'; // minimal(심플)
    return '#264F78';                        // dark
  }

  // agy 의 terminal 스킴은 표준 16색뿐 아니라 xterm 256색을 직접 사용한다. 밝은 배경에서는
  // diff 문맥/일반 요약(247, 252)이 거의 흰색으로 사라지고, 인라인 코드(124/188)가 삭제 표시처럼
  // 보이므로 해당 인덱스만 앱 테마에 맞춘다. extendedAnsi 는 16~255 전체 배열을 요구하므로
  // 나머지는 xterm 기본 팔레트를 그대로 재생성해 다른 구문색과 diff 의미색을 보존한다.
  function antigravityExtendedAnsi(bg) {
    const colors = [];
    const levels = [0, 95, 135, 175, 215, 255];
    const hex = n => n.toString(16).padStart(2, '0');
    for (let r = 0; r < 6; r++) {
      for (let g = 0; g < 6; g++) {
        for (let b = 0; b < 6; b++) {
          colors.push('#' + hex(levels[r]) + hex(levels[g]) + hex(levels[b]));
        }
      }
    }
    for (let i = 0; i < 24; i++) {
      const v = 8 + i * 10;
      colors.push('#' + hex(v) + hex(v) + hex(v));
    }

    const set = (index, color) => { colors[index - 16] = color; };
    if (bg === '#f2ede6') {
      set(124, '#4B463E'); // markdown inline-code foreground: deep red -> neutral text
      set(188, '#E2D8CB'); // markdown inline-code background
      set(247, '#756E64'); // summary heading / muted text
      set(252, '#756E64'); // diff context / summary body
    } else if (bg === '#f8fafc') {
      set(124, '#334155');
      set(188, '#E2E8F0');
      set(247, '#64748B');
      set(252, '#64748B');
    }
    return colors;
  }

  function themeFor(agent) {
    const t = toXtermTheme(cfg.theme);
    if (agent === 'gajae') t.selectionBackground = gjcSelectionBg();
    if (agent === 'antigravity') {
      const bg = ((cfg.theme && cfg.theme.background) || '').toLowerCase();
      if (bg === '#f2ede6' || bg === '#f8fafc') t.extendedAnsi = antigravityExtendedAnsi(bg);
    }
    return t;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 한글 IME 조합 처리 — 전체 아키텍처 (상세: .knowledge/터미널커스텀동작.md §5)
  // ═══════════════════════════════════════════════════════════════════════
  //
  // [문제 모델]
  // IME 조합 문자열은 확정(compositionend) 전까지 PTY 로 가지 않는다 → TUI 는 조합의
  // 존재 자체를 모른다 → xterm 이 DOM 오버레이(.composition-view)로 미리보기를 그리고,
  // 그 위치를 "논리(하드웨어) 커서"(buffer.x/y)에 붙인다. 여기서 세 가지가 깨진다:
  //
  //  (1) TUI 는 논리 커서를 입력 캐럿에 두지 않는다 — claude 류는 커서를 숨기고 자체
  //      캐럿을 셀로 그리며(커서는 아무데나 파킹), codex/opencode 도 응답 리페인트 중엔
  //      커서가 출력영역/statusLine 을 왕복한다. → 조합뷰가 엉뚱한 곳에 뜨거나 튄다.
  //  (2) xterm 내부 updateCompositionElements 는 커서가 viewport 밖이면 좌표 갱신을
  //      아예 스킵한다 → 조합뷰가 CSS 초기값 (0,0) = 좌상단에 잔류하는 유령 조합.
  //  (3) 확정 글자의 PTY echo 는 왕복 지연이 있다(codex 수십 ms, opencode 는 렌더
  //      배칭으로 수백 ms 도 가능). 한글은 음절마다 compositionend→compositionstart 가
  //      "같은 keydown 안에서" 연달아 발생하므로, 새 조합 시작 시점의 논리 커서는 항상
  //      "직전 음절 echo 도착 전" 좌표다 → 연타 시 직전 글자를 조합뷰가 덮는다.
  //
  // [에이전트 분류] — 새 에이전트 추가 시 첫 판정 (에이전트추가규칙.md §11-2)
  //  A. 자체커서형(gajae/grok): DECTCEM 으로 hw 커서 숨김 + 자체 캐럿 렌더 → 무개입(조합 위치 정상).
  //     claude 도 예전엔 여기였지만 2026-08-03 계측으로 B형 확정(반전셀 스캔 영구 0건).
  //  B. hw커서형(codex/opencode/devezvibe/claude): hw 커서가 입력 캐럿에 있음. pinsLogicalCaret 에
  //     agent id 한 줄 추가하면 아래 처방 4종(pin/chain/ghost/커서숨김) 전부 자동 적용.
  //
  // [처방 요약]
  //  pin   : 조합 중 조합뷰+textarea 좌표 동결(.ime-fixed + !important CSS 변수)
  //  chain : 음절 확정 시 확정 폭만큼 좌표 전진 예약 → 다음 조합이 소비 (echo 레이스 제거)
  //  ghost : 확정 글자를 echo 도착까지 미리 그림 (chain 이 만든 빈칸 깜빡임 제거)
  //  커서숨김: 조합/echo 대기 중 hw 커서를 테마색 위장으로 감춤 (A형과 동일한 UX)
  //
  // [금지 사항 — 실제 겪은 회귀]
  //  · 조합 textarea/조합뷰 display:none 금지(조합 끊김), 오프스크린(-9999px) 이동도
  //    금지(지연 apply 와 결합해 조합 전체가 안 보이는 회귀를 냈음 — 폐기된 접근).
  //  · pin 제거 금지(d89754f 시도 → 응답 중 조합뷰가 입력란↔statusLine 왕복, 원복됨).
  //  · apply() 의 isImeComposing 가드 제거 금지(지연 타이머가 조합 종료 후 발화).
  // ═══════════════════════════════════════════════════════════════════════

  // IME 확정 문자열의 셀 폭 계산. 한글 음절(AC00-D7A3)·자모·CJK·전각 = 2셀, 그 외 1셀.
  // 정밀 wcwidth 는 불필요 — 이 함수는 "방금 한글 IME 가 확정한 문자열"에만 쓰이므로
  // 한글/CJK 위주 근사면 충분하다. (결합문자·제로폭은 IME 확정 경로에 사실상 안 나옴)
  function imeCellWidth(s) {
    let w = 0;
    for (const ch of s) {
      const cp = ch.codePointAt(0);
      w += (cp >= 0x1100 && (cp <= 0x115F || (cp >= 0x2E80 && cp <= 0x303E) ||
            (cp >= 0x3041 && cp <= 0x33FF) || (cp >= 0x3400 && cp <= 0x9FFF) ||
            (cp >= 0xA000 && cp <= 0xA4CF) || (cp >= 0xAC00 && cp <= 0xD7A3) ||
            (cp >= 0xF900 && cp <= 0xFAFF) || (cp >= 0xFE30 && cp <= 0xFE4F) ||
            (cp >= 0xFF00 && cp <= 0xFF60) || (cp >= 0xFFE0 && cp <= 0xFFE6))) ? 2 : 1;
    }
    return w;
  }

  // 방(세션)별로 1회 호출 — 모든 IME 상태는 이 클로저 안에 격리된다(방 간 오염 불가).
  function setupImeCaretFix(term, el, agent, roomId, entry) {
    const ta = el.querySelector('.xterm-helper-textarea'); // IME 조합이 실제로 일어나는 숨은 textarea
    if (!ta) return;
    // B형(hw커서형): 입력 캐럿 = 논리 커서. 조합 중 리페인트가 커서를 viewport 밖/statusLine
    // 으로 옮기면 xterm 이 조합뷰를 못 따라가거나(0,0 잔류) 여기저기 튄다 → 조합 중 고정 대상.
    // 새 B형 에이전트는 여기에 id 만 추가하면 pin/chain/ghost/커서숨김 전부 자동 적용된다.
    // claude 도 2026-08-03 계측으로 B형 확정: 반전/배경/블록글리프 어디에도 캐럿 흔적이 없고
    // (diag 전량 `cands[0]= alt=`) hw 커서가 입력 행에서 음절마다 2칸씩 전진(`cur=38,15→17→19`).
    // 옛 claude 전용 반전셀 스캔은 이 시점에 제거했다(영구 0건) — 자세한 근거는
    // `.knowledge/터미널커스텀동작.md` §5 부류표 주석 참조.
    const pinsLogicalCaret = (agent === 'codex' || agent === 'opencode' || agent === 'devezvibe' || agent === 'claude');
    // 입력란 아래 "캐럿일 수 없는" 하단 행 수. codex/opencode 는 statusLine 1줄, claude 는
    // 계측된 하단 3줄(구분선 + `main | Opus … | ctx` + `⏵⏵ … mode`). 커서가 그 영역에 파킹된
    // 순간 조합이 시작되면 앵커로 쓰지 않는다(잘못된 행 고정 > 폴백/no-pin 자가치유).
    const bottomReserved = (agent === 'claude') ? 3 : 1;
    const needsCaretFix = pinsLogicalCaret; // 그 외(gajae/grok/셸)는 전부 무개입
    let isImeComposing = false;   // compositionstart~end 사이 true. 모든 지연 콜백의 유효성 가드.
    let lastLogicalCaret = null;  // B형: 마지막으로 관측한 유효 논리 커서(커서가 범위 밖일 때 폴백)

    // [chain] 음절 확정→다음 조합이 "같은 keydown 안에서" 연달아 일어나면 PTY echo 가 아직
    // 도착 전이라 논리 커서가 직전 음절 자리에 있다. 이때 확정 문자열의 셀 폭만큼 전진한
    // "예상 좌표"를 예약해 두고, 직후의 compositionstart 가 1회 소비한다. echo 를 기다리지
    // 않는 결정적 계산이므로 타이핑 속도와 무관하게 항상 정확하다. { row, col, at(예약시각) }
    let chainCaret = null;
    let devezVibeComposerColsCache = term.cols;
    let devezVibeComposerRowCache = -1;
    let devezVibeComposerColsSignaled = false;

    // [ghost] chain 이 조합뷰를 예측 위치(확정 글자 뒤)로 옮기면, 확정 글자 자리는 echo 가
    // 도착할 때까지 빈칸이 된다 → 연타 시 음절마다 빈칸이 깜빡. 그 지연 창 동안 확정
    // 문자열을 같은 자리에 우리가 미리 그려서(투명 배경 DOM div) 간극을 채운다.
    // echo 가 같은 글리프를 그리는 순간 픽셀이 정확히 겹치므로 이음새가 안 보인다.
    let ghost = null;      // { row, col, text } — 아직 echo 확인 안 된 확정 문자열(연속 확정은 이어붙임)
    let ghostEl = null;    // .ime-echo-ghost div (lazy 생성, .xterm-screen 에 append)
    let ghostTimer = 0;    // 600ms 안전망 타이머 — echo 가 영영 안 오는 경우(제출로 입력란 비움 등) 정리
    // 마지막으로 Backspace/Delete/Enter/Esc 가 눌린 시각. 조합 중에 눌리면 IME 조합이 강제
    // 확정되는데(Ctrl+Backspace 단어 삭제 경로), 그 확정 글자는 곧바로 지워져 echo 가 영영
    // 오지 않는다 → 확정 시 고스트를 그리면 그 한 글자만 600ms 잔상으로 남는다. 확정이 이
    // 키로 강제된 것인지 판정하는 근거.
    let lineMutateKeyAt = 0;

    // IME 진단 로그 → C# diag.log (C:\devezLog\diag.log). 운영에서는 꺼 둔다.
    // 조합 음절마다 WebView 메시지→UI 스레드 동기 파일 append가 발생하고, 상태 스냅샷은
    // getComputedStyle/getBoundingClientRect로 강제 레이아웃까지 일으켜 입력을 미세하게 끊었다.
    // 새 IME 고착을 수사할 때만 true로 바꿔 임시 빌드하고, 원인 확인 뒤 반드시 false로 복원한다.
    const imeDiagnostics = false;
    function imeDiag(msg) {
      if (!imeDiagnostics) return;
      try { post({ type: 'diag', msg: '[ime ' + agent + ' ' + roomId + '] ' + msg }); } catch (e) {}
    }

    // [커서숨김] 조합/고스트 표시 중 하드웨어 커서 숨김.
    // A형(claude/gajae/grok)은 TUI 가 hw 커서를 직접 숨겨 조합 중 깜빡임이 없는데,
    // B형(codex/opencode)은 hw 커서가 켜진 채라 조합뷰·고스트(배경 투명) 밑/옆에서
    // 블록커서가 계속 깜빡여 부자연스럽다 → 조합 동안 A형과 동일한 UX 로 맞춘다.
    //
    // 방식: 테마의 cursor(블록 배경)를 터미널 배경색으로, cursorAccent(블록 위 글자색)를
    // 전경색으로 위장 → 커서 셀이 일반 셀과 똑같이 렌더되어 시각적으로 소멸. 깜빡임도
    // 배경색↔배경색 교대라 안 보인다.
    //
    // 왜 이 방식인가(대안 검토 결과):
    //  · xterm 에 커서 숨김 공개 API 없음.
    //  · DECTCEM(ESC[?25l) 전송 금지 — PTY 측 상태라 TUI 소유. 우리가 보내면 TUI 가
    //    다시 켜거나 상태가 어긋난다.
    //  · CSS 로 .xterm-cursor 숨기기 — WebGL 렌더러(canvas)에는 안 먹힘.
    //  → 테마 커서색 교체만이 렌더러(DOM/WebGL) 불문 동작 + 완전 원복 가능.
    let savedCursorColors = null; // 숨김 전의 { cursor, cursorAccent } (undefined = 테마에 미지정이었음)
    // 렌더러 태그 — "조합 중 커서 안 숨음" 간헐 재발이 WebGL/DOM 어느 렌더러에서 났는지 로그에 남긴다.
    function rendererTag() {
      const t = terms[roomId];
      return ' r=' + (t && t.webgl ? 'gl' : 'dom');
    }
    function hideHwCursor() {
      // 조합 재개 — 지연 복원이 대기 중이면 취소(콜백 가드로도 무산되지만 상태를 명료하게).
      if (cursorRestoreTimer) { clearTimeout(cursorRestoreTimer); cursorRestoreTimer = 0; }
      // DOM 렌더러 실숨김 — 테마 위장은 스타일시트 고착에 무력하므로 CSS 클래스가 1차 수단
      // (css grep: `ime-hide-cursor`). 멱등이라 이미 숨김 상태여도 무해.
      el.classList.add('ime-hide-cursor');
      const th = term.options.theme || {};
      const bg = th.background || '#0C0C0C';     // 폴백은 기본 다크 배경(테마에 background 항상 있음)
      if (savedCursorColors) {
        // 이미 숨김 상태 — 중복 저장하면 위장색을 원본으로 오인하므로 저장은 건너뛴다.
        // 불변식: savedCursorColors 가 있으면 테마는 반드시 위장 상태(cursor==background)다.
        // 간헐 재발(조합 중 블록커서 깜빡임) 추적: 불변식이 깨져 있으면 증거를 남기고 재위장.
        if (th.cursor !== bg) {
          imeDiag('cursor-hide ANOMALY saved=' + JSON.stringify(savedCursorColors) +
                  ' cursor=' + th.cursor + ' bg=' + bg + rendererTag());
          term.options.theme = Object.assign({}, th, { cursor: bg, cursorAccent: th.foreground || '#CCCCCC' });
        }
        return;
      }
      savedCursorColors = { cursor: th.cursor, cursorAccent: th.cursorAccent };
      term.options.theme = Object.assign({}, th, {
        cursor: bg,
        cursorAccent: th.foreground || '#CCCCCC'
      });
      imeDiag('cursor-hide' + rendererTag());
    }
    // force=true(blur 등)면 조합/고스트 상태 무시하고 무조건 즉시 복원.
    // force 없이 호출하면 "조합 끝났고 고스트도 없음"일 때 **350ms 지연 후** 복원한다.
    //
    // 지연 복원인 이유(2026-07-21 diag 로 확정된 간헐 재발의 근본 원인): 연타 중 음절 사이
    // 틈(compositionend ~ 다음 compositionstart, 수십~수백 ms)에 echo 가 도착하면
    // clearGhost → 복원 조건("조합 아님 + 고스트 없음")이 그 틈에서 성립해 커서가 음절마다
    // ~100ms 씩 나타났다 사라진다(23:16:52.359 cursor-restore ↔ 52.464 cursor-hide 교차).
    // echo 가 다음 조합 시작보다 늦으면 isImeComposing 가드로 계속 숨어 있어 증상이 없다 —
    // "codex 유휴(응답 직후)=echo 빠름=깜빡임, 바쁨=echo 늦음=정상"의 간헐성이 이 레이스다.
    // 350ms 안에 다음 조합이 시작되면 타이머 콜백의 가드가 복원을 무산시켜 숨김이 유지되고,
    // 타이핑을 실제로 멈추면 350ms 뒤 복원된다(정지 시 체감 즉시).
    let cursorRestoreTimer = 0;
    function doRestoreHwCursor(reason) {
      const th = Object.assign({}, term.options.theme || {});
      // 원래 테마에 cursor/cursorAccent 가 아예 없었다면(undefined) 키 자체를 지워
      // xterm 기본값으로 되돌린다. 값이 있었다면 그 값으로 복원.
      if (savedCursorColors.cursor === undefined) delete th.cursor;
      else th.cursor = savedCursorColors.cursor;
      if (savedCursorColors.cursorAccent === undefined) delete th.cursorAccent;
      else th.cursorAccent = savedCursorColors.cursorAccent;
      savedCursorColors = null;
      term.options.theme = th;
      el.classList.remove('ime-hide-cursor');
      imeDiag('cursor-restore ' + reason + rendererTag());
    }
    function maybeRestoreHwCursor(force, reason) {
      if (cursorRestoreTimer) { clearTimeout(cursorRestoreTimer); cursorRestoreTimer = 0; }
      if (!savedCursorColors) return;
      if (force) { doRestoreHwCursor(reason || 'force'); return; }
      if (isImeComposing || ghost) return; // 아직 조합/echo 대기 중 — 숨김 유지
      cursorRestoreTimer = setTimeout(function () {
        cursorRestoreTimer = 0;
        // 지연 중 다음 조합/고스트가 시작됐으면 복원 무산 — 연타 중 숨김 유지의 핵심 가드.
        if (!savedCursorColors || isImeComposing || ghost) return;
        doRestoreHwCursor((reason || '?') + '-deferred');
      }, 350);
    }
    // 라이브 테마 전환(message 'theme')이 term.options.theme 을 통째로 교체하면 저장해둔
    // 이전 테마의 커서색이 낡는다 — 그대로 복원하면 새 테마에 옛 테마 커서색이 박힌다.
    // 새 테마 객체는 커서를 이미 정상 표시하므로 복원할 것도 없음 → 저장분만 폐기.
    // (호출처: 'theme' 핸들러가 setOption 직후 방마다 호출)
    el._onThemeSwapped = function () {
      // 숨김 도중 테마가 통째로 교체되면(새 테마 = 정상 커서) 조합이 아직 진행 중일 수 있다 —
      // 그 조합의 남은 구간은 커서가 보인다(다음 compositionstart 가 재위장). 추적 로그만 남긴다.
      if (savedCursorColors) imeDiag('themeswap-discard-hidden composing=' + isImeComposing);
      savedCursorColors = null;
      el.classList.remove('ime-hide-cursor');
    };

    // 고스트 제거 + (조합도 끝났다면) 커서 복원. 모든 고스트 소멸 경로가 이 함수 하나를
    // 통과하므로 커서 복원 시점을 여기 한 곳에서만 판단하면 된다.
    function clearGhost() {
      ghost = null;
      if (ghostTimer) { clearTimeout(ghostTimer); ghostTimer = 0; }
      if (ghostEl) ghostEl.style.display = 'none'; // div 는 재사용(제거 안 함) — 연타 중 재생성 비용 절약
      maybeRestoreHwCursor(false, 'clearGhost');
    }

    // 고스트를 현재 ghost 상태대로 그린다. 좌표계는 .xterm-screen 기준(조합뷰와 동일 원점).
    function showGhost() {
      if (!ghost) return;
      const screen = el.querySelector('.xterm-screen');
      if (!screen) return;
      if (!ghostEl) {
        ghostEl = document.createElement('div');
        ghostEl.className = 'ime-echo-ghost'; // 스타일은 CSS 정의부 참조(투명 배경 + --term-fg)
        screen.appendChild(ghostEl);          // canvas(WebGL) 위에 DOM 이 그려지므로 렌더러 불문 표시됨
      }
      // 셀 픽셀 크기 = 스크린 실측 / 그리드 — apply() 와 동일한 계산식(둘이 어긋나면 고스트와
      // 조합뷰가 서로 안 맞으므로 반드시 같은 식 유지).
      const cw = screen.clientWidth / term.cols;
      const chh = screen.clientHeight / term.rows;
      // 글자별 절대위치 렌더 — 통짜 텍스트로 흘리면 DOM 글리프 전진폭(폰트 advance)이
      // xterm 의 셀 경계(한글=정확히 2×cw)와 미세하게 달라 여러 글자에서 어긋남이 누적된다.
      // 그 상태로 앞 글자들이 echo 로 실제 그려지면 실글자 위에 고스트가 오프셋으로 겹쳐
      // "좌우로 이중으로 보이는" 아티팩트가 남. xterm 과 동일하게 글자마다 셀 경계에 고정.
      ghostEl.textContent = '';
      let colOff = 0;
      for (const ch of Array.from(ghost.text)) {
        const span = document.createElement('span');
        span.textContent = ch;
        span.style.position = 'absolute';
        span.style.left = Math.round(colOff * cw) + 'px';
        span.style.top = '0';
        ghostEl.appendChild(span);
        colOff += imeCellWidth(ch);
      }
      ghostEl.style.left = Math.round(ghost.col * cw) + 'px';
      ghostEl.style.top = Math.round(ghost.row * chh) + 'px';
      ghostEl.style.height = Math.round(chh) + 'px';
      ghostEl.style.lineHeight = Math.round(chh) + 'px'; // 셀 높이에 수직 정렬(터미널 글리프와 베이스라인 맞춤)
      // 터미널과 동일 폰트 강제 — body 폰트와 다를 수 있어 상속에 맡기지 않는다.
      if (term.options.fontFamily) ghostEl.style.fontFamily = term.options.fontFamily;
      if (term.options.fontSize) ghostEl.style.fontSize = term.options.fontSize + 'px';
      ghostEl.style.display = 'block';
      imeDiag('ghost ' + ghost.row + ',' + ghost.col + ' "' + ghost.text + '"');
      // 600ms 안전망: echo 가 영영 안 오는 경우 대비 — Enter 제출로 입력란이 통째로
      // 비워졌거나(그 글자는 이제 화면에 안 그려짐), 죽은 세션, 응답 출력이 입력란을
      // 밀어낸 경우 등. 정상 echo(수십~수백 ms)보다 넉넉하되 잔상으로 느껴지지 않는 값.
      if (ghostTimer) clearTimeout(ghostTimer);
      ghostTimer = setTimeout(clearGhost, 600);
    }

    // echo 도착 판정 + 부분 echo 트리밍 — 매 렌더마다 호출(onRender).
    // 앞에서부터 "실제 버퍼 셀에 나타난" 글자를 고스트에서 잘라낸다: echo 로 그려진 글자를
    // 고스트가 계속 덮어 그리면 픽셀이 완전히 일치해도 안티앨리어싱이 겹쳐 미세하게 번져
    // 보일 수 있고, 조금이라도 어긋나면 좌우 이중상이 된다 — 실글자가 확인된 부분은 즉시
    // 고스트에서 제외해 이중 描 자체를 없앤다. 전부 echo 되면 고스트 제거.
    function checkGhostEchoed() {
      if (!ghost) return;
      const buf = term.buffer.active;
      const line = buf.getLine(buf.viewportY + ghost.row); // ghost.row 는 viewport 상대 좌표
      if (!line) return;
      const chars = Array.from(ghost.text); // 코드포인트 단위 분해(서러게이트 안전)
      let trimmed = false;
      while (chars.length) {
        if (ghost.col >= term.cols) { clearGhost(); return; } // 그리드 밖 — 좌표 무효, 즉시 정리
        const cell = line.getCell(ghost.col);
        if (!cell) break;
        const cc = cell.getChars();
        if (cc !== chars[0]) {
          // Devez Vibe 컴포저가 줄바꿈되면 같은 화면 행을 새 입력 줄로 재사용한다. 그 사이에는
          // 이전 첫 글자가 이 셀에 남아 있어도 아직 새 글자의 echo 가 도착하지 않은 상태다.
          // 이를 앵커 오류로 오인해 고스트를 즉시 지우면 새 줄에서 글자가 깜빡였다 사라진다.
          if (ghost.waitingForDvzReflow) break;
          // 그 셀에 "다른 실글자"가 그려졌다 = 앵커가 틀렸던 것(직전 키 echo 지연으로 몇 칸
          // 왼쪽에 예약된 경우 등) — 실제 텍스트는 다른 위치에 있고 이 고스트는 그 옆에
          // 이중상으로 보이는 쓰레기다. 600ms 기다리지 말고 즉시 폐기.
          // 셀이 아직 비어 있으면(공백/미기록) echo 미도착일 뿐이니 대기.
          if (cc && cc !== ' ') { clearGhost(); return; }
          break; // 첫 미도착 글자에서 중단(순차 echo 가정)
        }
        ghost.col += imeCellWidth(chars[0]); // 도착분만큼 앵커 전진
        chars.shift();
        trimmed = true;
      }
      if (!chars.length) { clearGhost(); return; } // 전부 도착 — 완료
      if (trimmed) {
        ghost.waitingForDvzReflow = false; // 실제 echo 확인 뒤에는 일반 앵커 검증으로 복귀
        ghost.text = chars.join('');
        showGhost();
      } // 남은 미도착분만 다시 그림
    }
    let frozenImeCaret = null;       // [pin] 이번 조합 동안 동결된 좌표 — 리페인트가 와도 안 바뀜
    let pendingResponseReset = false; // 응답 완료 신호가 조합 중에 도착 — 누락된 end 감시 안전망 플래그
    let responseResetTimer = 0;
    let pointerRecoverGen = 0;       // 창 비활성 클릭 복구 재시도 세대 — 연속 클릭 시 이전 재시도 폐기

    function clearResponseResetTimer() {
      if (!responseResetTimer) return;
      clearTimeout(responseResetTimer);
      responseResetTimer = 0;
    }

    // 실제 textarea blur와 강제 IME 리셋이 공유하는 상태 정리. 고착 시 activeElement가 이미
    // textarea 밖이면 ta.blur()가 blur 이벤트를 다시 내지 않으므로, resetImeNow도 직접 호출한다.
    // 두 경로가 연달아 호출돼도 멱등이어야 한다(실제 blur가 동기 발화한 뒤 강제 정리가 이어짐).
    function clearImeAfterBlur(reason) {
      isImeComposing = false;
      frozenImeCaret = null;
      chainCaret = null;
      clearGhost();
      maybeRestoreHwCursor(true, reason || 'blur');
      pendingResponseReset = false;
      clearResponseResetTimer();
      el.classList.remove('ime-fixed');
      el.classList.remove('ime-hide-cursor');
    }

    function resetImeNow(reason, allowDetachedFocus, syncCaret) {
      clearResponseResetTimer();
      pendingResponseReset = false;
      // 완료 신호는 비활성/백그라운드 방에도 온다. 실제로 이 textarea 를 쓰는 중일 때만
      // 사용자가 수동으로 포커스를 뺐다 넣는 것과 같은 초기화를 수행한다.
      // 단, 사용자가 좌상단 고착 조합을 직접 재클릭한 경우에는 activeElement 자체가 이미
      // 어긋나 있을 수 있으므로 allowDetachedFocus=true 로 DOM 조합 상태까지 강제 정리한다.
      if (roomId !== activeRoomId || !document.hasFocus() ||
          (!allowDetachedFocus && document.activeElement !== ta)) return false;

      const view = el.querySelector('.composition-view');
      const hadComposition = isImeComposing || !!(view && view.classList.contains('active'));
      imeDiag('resetImeNow reason=' + (reason || '?') + ' hadComposition=' + hadComposition);
      isImeComposing = false;
      if (pendingComposeNewline && pendingComposeNewline.roomId === roomId) pendingComposeNewline = null;

      // 먼저 값을 비워야 누락됐던 compositionend 를 강제해도 이전 확정 문자열이 PTY 로 재전송되지 않는다.
      ta.value = '';
      if (hadComposition) {
        try { ta.dispatchEvent(new CompositionEvent('compositionend', { data: '' })); }
        catch (e) { try { ta.dispatchEvent(new Event('compositionend')); } catch (ignore) {} }
      }
      if (view) { view.classList.remove('active'); view.textContent = ''; }

      ta.blur(); // xterm _handleTextAreaBlur 가 textarea/IME 내부 상태를 함께 정리한다.
      clearImeAfterBlur(reason || 'reset'); // textarea가 이미 비활성이어도 우리 상태 정리는 반드시 수행
      requestAnimationFrame(function () {
        if (roomId !== activeRoomId || !document.hasFocus()) return;
        term.focus();
        // 기존 응답완료/최초포커스 리셋은 동작을 바꾸지 않는다. 사용자가 좌상단 고착을
        // 재클릭한 경로만 현재 커서 행과 IME 앵커를 즉시 동기화한다.
        if (syncCaret) {
          try {
            const row = term.buffer.active.cursorY;
            term.refresh(row, row);
          } catch (e) {}
          if (typeof el._prepareImeCaret === 'function') el._prepareImeCaret();
        }
      });
      return true;
    }

    function armStaleCompositionReset() {
      clearResponseResetTimer();
      // 사용자가 응답 완료 직후 이미 다음 문장을 조합 중이면 정상 compositionend 를 우선 기다린다.
      // WebView2 가 end 를 누락한 경우에만 3초 무입력 후 강제 초기화한다.
      responseResetTimer = setTimeout(function () { resetImeNow('response-timeout', false); }, 3000);
    }

    el._resetImeAfterResponse = function () {
      if (roomId !== activeRoomId || !document.hasFocus() || document.activeElement !== ta) return;
      // 정상 idle 에서 blur→focus 하면 Windows IME 컨텍스트가 새로 붙는 동안 다음 입력의
      // compositionstart 가 누락될 수 있다. 그러면 B형의 커서 숨김/pin 이 모두 시작되지 않아
      // 응답을 계속 지켜본 뒤 다음 한글 입력에서 블록커서가 보이고 위치까지 튄다.
      // compositionend 누락으로 실제 조합 상태가 남은 경우에만 안전망을 건다.
      if (!isImeComposing) return;
      pendingResponseReset = true;
      armStaleCompositionReset();
    };

    // 새 xterm 이 처음 포커스를 받을 때 WPF 입력 컨트롤의 Windows IME 컨텍스트가 WebView2 에
    // 이어지는 경우가 있다. 이 상태에서는 한글 확정 문자열이 두 번 들어가며, 사용자가 터미널 밖을
    // 클릭했다 돌아오면 정상화된다. 최초 포커스에 한해서 그 동작을 그대로 재현한다. WebView HWND
    // 포커스가 show 메시지보다 늦게 적용될 수 있어 짧게 재시도한다.
    // 단축키(Ctrl+Shift+T)로 만든 새 세션은 그 사이에 WPF 모달(에이전트 선택·이름 입력)이 끼어
    // 창 활성화가 늦게 돌아온다. 기존 8회(≈256ms) 재시도로는 소진돼 리셋이 통째로 유실됐고,
    // 그 방은 "확정 한글이 두 번 들어가는" 상태로 굳었다. 재시도 창을 늘리고, 그래도 못 하면
    // 예약을 남겨 실제로 포커스가 들어오는 순간(focus 메시지)에 반드시 한 번 수행한다.
    let initialResetPending = false;
    el._resetImeOnInitialFocus = function () {
      initialResetPending = true;
      let retries = 40; // 32ms × 40 ≈ 1.3초
      const tryReset = function () {
        if (!initialResetPending || roomId !== activeRoomId) return;
        term.focus();
        if (document.hasFocus() && document.activeElement === ta) {
          initialResetPending = false;
          resetImeNow('initial-focus', false);
          return;
        }
        if (--retries > 0) setTimeout(tryReset, 32);
        // 소진돼도 initialResetPending 은 남긴다 — _flushPendingImeReset 이 이어받는다.
      };
      requestAnimationFrame(tryReset);
    };

    /// 미완료 최초 리셋을 지금(포커스가 실제로 들어온 시점) 수행. focus 메시지에서 호출.
    el._flushPendingImeReset = function () {
      if (!initialResetPending) return;
      if (roomId !== activeRoomId || !document.hasFocus() || document.activeElement !== ta) return;
      initialResetPending = false;
      resetImeNow('initial-focus-late', false);
    };

    /// 다른 방 전환 로직이 "지금 조합 중인가"를 물어보는 훅(조합 중 강제 blur 방지용).
    el._isImeComposing = function () { return isImeComposing; };

    /// WPF 모달이 뜨기 직전 호출 — ShowDialog 는 부모 HWND 만 disable 해 helper-textarea 의
    /// blur 이벤트가 오지 않는다(1575~ 주석 참고). 조합/고스트 상태가 stale 로 남으면 모달을
    /// 닫은 뒤 첫 입력이 중복된다. resetImeNow 는 hasFocus 가드에 걸리므로 직접 정리한다.
    el._abortIme = function () {
      // xterm CompositionHelper의 내부 composing 플래그는 compositionend 에서만 내려간다.
      // 값을 먼저 비운 뒤 빈 종료 이벤트를 보내야 미완료 문자열을 PTY로 재전송하지 않으면서
      // 브라우저/xterm 양쪽 상태를 함께 닫을 수 있다. blur는 모달 HWND 전환 전에 동기 확정한다.
      try { ta.value = ''; } catch (e) {}
      try { ta.dispatchEvent(new CompositionEvent('compositionend', { data: '' })); }
      catch (e) { try { ta.dispatchEvent(new Event('compositionend')); } catch (ignore) {} }
      try { ta.blur(); } catch (e) {}
      clearImeAfterBlur('modal');
    };

    // B형: 조합 중이 아닐 때 논리 커서를 계속 기억해 둔다(onCursorMove 마다).
    // 조합 시작 시 findBlockCursor 가 라이브 커서를 직접 읽지만, 커서가 순간적으로 범위 밖이거나
    // statusLine 에 파킹돼 있을 때 이 마지막 유효 좌표가 폴백이 된다. 조합 중엔 갱신 금지 —
    // 리페인트가 커서를 출력영역으로 옮긴 좌표를 "입력 위치"로 오염시키면 안 되기 때문.
    // 하단 예약행(bottomReserved)은 기록하지 않는다: TUI 는 statusLine(스피너·토큰카운트)을
    // 주기적으로 재묘화하며 커서를 그 끝에 파킹하는데, 입력란은 구조상 항상 그 위에 있으므로
    // 예약행 좌표는 입력 캐럿일 수 없다(claude 3줄: 구분선/모델줄/모드줄, 그 외 statusLine 1줄).
    function rememberLogicalCaret() {
      if (!pinsLogicalCaret || isImeComposing) return;
      const buf = term.buffer.active;
      const row = buf.cursorY, col = buf.cursorX;
      if (row < 0 || row >= term.rows - bottomReserved) return;
      lastLogicalCaret = { row: row, col: Math.max(0, Math.min(col, term.cols - 1)) };
    }

    // 숨겨졌던 탭이 다시 표시되는 순간엔 커서가 리페인트 도중 좌표(출력영역/statusLine)에
    // 있을 수 있다. show 직후와 리페인트 진정 후 각 1회 읽어, 첫 한글 조합이 폴백 좌표
    // (lastLogicalCaret)를 쓸 수 있게 준비한다 — 없으면 첫 음절만 no-pin 으로 어긋난다.
    el._prepareImeCaret = function () {
      if (!pinsLogicalCaret) return;
      rememberLogicalCaret();
      setTimeout(function () {
        if (roomId === activeRoomId && !isImeComposing) rememberLogicalCaret();
      }, 80);
    };

    // 세션 표면 재클릭으로 좌상단 IME 고착 복구. 정상 조합을 매 클릭마다 blur 하면 현재 음절이
    // 취소되고 WebView2 가 다음 compositionstart 를 떨어뜨릴 수 있으므로, 보이는 조합뷰가
    // 화면 밖이거나 TUI 입력 구조상 불가능한 (0,0)에 있는 경우에만 실제 blur→focus 한다.
    // 프로젝트 영역 클릭→세션 복귀가 우연히 만들던 복구 경계를 터미널 안에서 조건부 재현한다.
    el._recoverStaleImeOnPointerDown = function () {
      if (roomId !== activeRoomId) return false;
      const view = el.querySelector('.composition-view');
      const screen = el.querySelector('.xterm-screen');
      if (!view || !screen || !view.classList.contains('active')) return false;
      if (!view.textContent && !ta.value) return false; // 아직 글자가 없는 정상 compositionstart 순간

      const vr = view.getBoundingClientRect();
      const sr = screen.getBoundingClientRect();
      const tolerance = 2;
      const outside = vr.left < sr.left - tolerance || vr.top < sr.top - tolerance ||
                      vr.left >= sr.right || vr.top >= sr.bottom;
      const atOrigin = Math.abs(vr.left - sr.left) <= tolerance &&
                       Math.abs(vr.top - sr.top) <= tolerance;

      // 예상 캐럿은 진단에도 남겨 실제 고착 좌표와 비교할 수 있게 한다. B형의 라이브 커서는
      // 리페인트 중 출력 좌상단(0,0)에 잠깐 파킹될 수 있으므로 이것만 정상 판정 근거로 쓰지 않는다.
      let expected = frozenImeCaret;
      if (!expected && pinsLogicalCaret) {
        const buf = term.buffer.active;
        if (buf.cursorY >= 0 && buf.cursorY < term.rows - bottomReserved)
          expected = { row: buf.cursorY, col: buf.cursorX };
        else
          expected = lastLogicalCaret;
      }

      // active 조합뷰와 우리 상태가 불일치하면 xterm/WebView2 조합 이벤트가 누락된 상태다.
      // B형(pinsLogicalCaret) TUI의 입력란은 구조상 화면 좌상단 셀이 아니므로, 이 대상들의
      // 보이는 (0,0) 조합은 라이브 논리 커서가 그곳에 파킹됐더라도 고착으로 판정한다.
      // 일반 셸/gajae/grok은 실제 첫 셀 입력 가능성을 보존하고 상태 불일치일 때만 복구한다.
      const stale = outside || (atOrigin && (needsCaretFix || !isImeComposing));
      if (!stale) return false;

      imeDiag('pointer-recover view=' + Math.round(vr.left - sr.left) + ',' +
              Math.round(vr.top - sr.top) + ' composing=' + isImeComposing +
              ' expected=' + (expected ? expected.row + ',' + expected.col : 'none'));
      const recoverGen = ++pointerRecoverGen;
      let retries = 8;
      const recover = function () {
        if (roomId !== activeRoomId || recoverGen !== pointerRecoverGen) return;
        // 비활성 창을 클릭한 첫 mousedown은 WebView2가 이벤트를 먼저 보내고 document 포커스를
        // 한 프레임 뒤에 갱신할 수 있다. case 'focus'와 같은 짧은 재시도로 한 번의 클릭에 복구한다.
        if (!document.hasFocus()) {
          if (--retries > 0) setTimeout(recover, 32);
          return;
        }
        resetImeNow('pointer-stale', true, true);
      };
      if (document.hasFocus()) recover();
      else requestAnimationFrame(recover);
      return true;
    };

    // ── 에이전트별 이벤트 구독 ──
    // B형(codex/opencode): 논리 커서 추적 + 고스트 echo 감시.
    // claude: 렌더마다 블록커서 재스캔(80ms 스로틀) — 숨김 탭에서도 parser 는 돌므로 항상 최신.
    // 조합 중에는 어느 쪽도 앵커를 갱신하지 않는다(리페인트가 커서를 옮겨도 조합뷰는 그대로).
    if (pinsLogicalCaret) {
      rememberLogicalCaret();
      try {
        // [행 고정 추종] 조합 중에도 "같은 행 안의" 커서 이동은 앵커 교정으로 받아들인다.
        // 조합 시작 앵커는 직전 키(영문/스페이스/직전 음절)의 echo 가 아직 도착 전이면 몇 칸
        // 왼쪽으로 틀릴 수 있는데, 그 echo 가 도착하면 커서가 입력란 행 안에서 오른쪽으로
        // 이동한다 — 이를 따라가면 앵커가 스스로 맞춰진다(안 따라가면 chain 이 오차를
        // 음절마다 전파해 확정 텍스트가 좌우로 이중으로 보인다).
        // 행이 다른 이동(응답 리페인트의 출력영역/statusLine 왕복 — 원래 '커서 튐'의 원인)은
        // 무시하므로 동결의 원래 목적은 유지된다. 같은 행 재묘화 스윕도 최종 위치가 입력
        // 캐럿이라 페인트 시점엔 정확하다.
        term.onCursorMove(function () {
          if (isImeComposing && frozenImeCaret) {
            const buf = term.buffer.active;
            if (buf.cursorY === frozenImeCaret.row) {
              const col = Math.max(0, Math.min(buf.cursorX, term.cols - 1));
              if (col !== frozenImeCaret.col) {
                imeDiag('follow ' + frozenImeCaret.row + ',' + frozenImeCaret.col + ' -> ' + col);
                frozenImeCaret = { row: frozenImeCaret.row, col: col };
                apply();
              }
            }
            return;
          }
          rememberLogicalCaret();
        });
        term.onRender(function () {
          syncDevezVibeComposerLayout();
          checkGhostEchoed();
        }); // 렌더 배치마다 패널 전환 감지 + 고스트 echo 확인
        term.onResize(function () {
          clearGhost(); // 그리드가 바뀌면 셀→픽셀 환산이 전부 무효 — 고스트는 즉시 정리
          if (isImeComposing) apply(); // 조합 중이면 동결 좌표를 새 그리드 기준 픽셀로 재적용
        });
        // [스크롤 재고정] pin/ghost 좌표는 viewport 상대 행을 동결한 것 — 타이핑 중 위에서
        // 응답 출력이 스크롤을 밀면 입력란이 행 단위로 이동하고, 동결 좌표는 옛 행에 남아
        // "입력란 + 바로 윗줄 두 줄로 보이는" 유령이 생긴다. 스크롤이 나면:
        //  · 고스트는 즉시 제거 — 행 기준이 무효라 echo 판정(checkGhostEchoed)도 옛 행을
        //    보게 되어 600ms 내내 잔상으로 남기 때문. (출력 스크롤 중 한 음절 빈칸 깜빡은 감수)
        //  · 조합뷰는 스크롤이 진정된 뒤(마지막 onScroll 로부터 80ms) 동결을 풀고 그 시점의
        //    실제 논리 커서로 재고정 — 리페인트가 끝나면 codex/opencode 는 커서를 입력란
        //    캐럿에 되돌려 놓으므로 그 좌표가 새 입력란 행이다. (즉시 재고정하면 리페인트
        //    중간의 바운스 좌표를 잡을 수 있어 디바운스 필수)
        let scrollReanchorTimer = 0;
        term.onScroll(function () {
          if (!isImeComposing && !ghost) return; // 평시 스크롤은 무관
          clearGhost();
          if (!isImeComposing) return;
          if (scrollReanchorTimer) clearTimeout(scrollReanchorTimer);
          scrollReanchorTimer = setTimeout(function () {
            scrollReanchorTimer = 0;
            if (!isImeComposing) return; // 조합이 그새 끝났으면 apply 가드와 이중 방어
            imeDiag('scroll-reanchor');
            frozenImeCaret = null;       // 동결 해제 — findBlockCursor 가 현재 커서를 새로 읽는다
            apply();
          }, 80);
        });
      } catch (e) {}
    }

    // [고착 수사] codex/opencode 가 커서 스타일(DECSCUSR)·블링크(DECSET/RST 12)를 런타임에
    // 바꾸는지 관측 — 위장은 색 기반이라 영향이 없어야 정상이지만, 고착 시점과의 상관관계를
    // 남긴다(예: 특정 UI 상태 진입 후부터 증상 시작). 항상 false 반환 = 기본 처리 계속.
    if (pinsLogicalCaret) {
      let lastDecscusr = null; // codex 는 렌더 프레임마다 DECSCUSR 0 을 연사(~20Hz) — 값 변화만 기록(로그 로테이션 방지)
      try {
        term.parser.registerCsiHandler({ intermediates: ' ', final: 'q' }, function (params) {
          const v = params && params[0];
          if (v !== lastDecscusr) { lastDecscusr = v; imeDiag('DECSCUSR ' + v); }
          return false;
        });
        term.parser.registerCsiHandler({ prefix: '?', final: 'h' }, function (params) {
          for (let i = 0; i < params.length; i++) if (params[i] === 12) imeDiag('DECSET ?12h blink-on');
          return false;
        });
        term.parser.registerCsiHandler({ prefix: '?', final: 'l' }, function (params) {
          for (let i = 0; i < params.length; i++) if (params[i] === 12) imeDiag('DECRST ?12l blink-off');
          return false;
        });
      } catch (e) {}
    }

    // 이번 조합의 앵커 좌표를 결정한다. 우선순위:
    //  ① chain 예약분(직전 확정의 전진 좌표, 250ms 내 1회) → ② 라이브 논리 커서
    //  → ③ 마지막 유효 좌표(커서가 순간 범위 밖이거나 하단 예약행에 파킹됐을 때)
    function findBlockCursor() {
      if (pinsLogicalCaret) {
        // [chain 소비] 직전 음절 확정 직후의 연속 조합 — echo 미도착 논리 커서 대신 예상 좌표.
        // 250ms: 한글 연타의 음절 전환(확정→새 조합)은 같은 keydown 안이라 실질 0ms — 250ms 면
        // 충분히 덮고, 이보다 오래 지난 예약은 그 사이 다른 일이 있었을 가능성이 커서 폐기.
        // (창을 늘리면 stale 예약 오소비 위험만 커진다. Enter/스페이스 등은 keydown/keyup
        // 무효화가 따로 있으니 이 창은 "아무 키도 안 눌린 순수 대기"에만 해당.)
        if (chainCaret && Date.now() - chainCaret.at < 250) {
          const chained = { // 예약~소비 사이 fit 리사이즈가 끼어들 수 있어 현재 그리드로 클램프
            // rows-2 상한: 입력란은 구조상 statusLine(rows-1) 위 — rows-1 로 클램프하면
            // 리사이즈 축소 시 statusLine 에 앵커가 꽂혀 우측 끝 조합 표시가 재발한다.
            row: Math.max(0, Math.min(chainCaret.row, term.rows - bottomReserved - 1)),
            col: Math.max(0, Math.min(chainCaret.col, term.cols - 1))
          };
          chainCaret = null; // 1회 소비 — 같은 예약이 두 조합에 쓰이면 두 번째는 반드시 틀린다
          lastLogicalCaret = chained;
          imeDiag('anchor=chain ' + chained.row + ',' + chained.col + ' rows=' + term.rows);
          return chained;
        }
        chainCaret = null; // 만료된 예약은 폐기(소비 실패 시에도 다음 조합에 새지 않게)
        const buf = term.buffer.active;
        const row = buf.cursorY, col = buf.cursorX;
        // 폴백 좌표는 현재 그리드 기준으로 유효할 때만 신뢰 — 리사이즈로 행수가 줄면 기록해
        // 둔 입력란 행이 지금은 statusLine(rows-1)일 수 있고, 그대로 폴백하면 아래 lastrow
        // 가드를 스스로 무력화한다(statusLine 우측 끝 조합 표시 재발).
        const lastValid = (lastLogicalCaret && lastLogicalCaret.row < term.rows - bottomReserved)
          ? lastLogicalCaret : null;
        if (row < 0 || row >= term.rows) { // 순간적 범위 밖 — 마지막 유효 좌표 폴백
          imeDiag('anchor=oob cur=' + row + ',' + col + ' last=' + JSON.stringify(lastValid));
          return lastValid;
        }
        // 커서가 맨 아랫줄(statusLine)에 파킹된 순간 조합이 시작되면 그 좌표는 입력 캐럿이
        // 아니다(statusLine 재묘화 직후의 잔류 위치) — 마지막으로 기록된 입력란 좌표로 폴백.
        // 행 고정 추종은 "같은 행" 이동만 수용하므로 여기서 틀린 행을 잡으면 조합 내내 못
        // 벗어난다(statusLine 우측 끝에 조합 글자가 표시되다 확정 때 돌아오는 증상의 원인).
        // 폴백조차 없으면 pin 을 포기(null)한다 — statusLine 좌표를 동결하면 chain 이 오류를
        // 음절마다 전파하지만, null 이면 frozenImeCaret 이 비어 있어 compositionupdate 의
        // 재적용이 커서가 입력란으로 복귀하는 즉시 정상 앵커로 자가 치유된다.
        if (row >= term.rows - bottomReserved) {
          imeDiag('anchor=lastrow-fallback cur=' + row + ',' + col + ' -> ' +
            (lastValid ? lastValid.row + ',' + lastValid.col : 'none(no-pin)'));
          return lastValid;
        }
        const caret = { row: row, col: Math.max(0, Math.min(col, term.cols - 1)) };
        lastLogicalCaret = caret;
        imeDiag('anchor=live ' + caret.row + ',' + caret.col + ' rows=' + term.rows + ' cols=' + term.cols);
        return caret;
      }
      return null;
    }

    // [pin 적용] 앵커 좌표를 픽셀로 환산해 CSS 변수(--ime-left/top)에 쓰고 .ime-fixed 를
    // 부착한다. xterm 은 0ms 루프로 조합뷰/textarea 의 인라인 left/top 을 계속 논리 커서로
    // 되돌리므로, 인라인보다 우선하는 !important CSS 변수로 무력화한다(CSS 정의부 참조).
    // 좌표가 없으면(커서가 하단 예약행 파킹 + 폴백 좌표 없음) 아무것도 안 한다 — xterm 기본
    // 동기화가 잠깐 어긋나 보일 수 있지만, 숨기는 시도(-9999px)는 지연 apply 와 결합해
    // "조합 전체 안 보임" 회귀를 냈던 폐기된 접근이다. 어긋남 < 안 보임.
    function apply() {
      if (!needsCaretFix) return; // gajae/grok/셸은 TUI·xterm 기본 동기화가 이미 정확 — 무개입
      // [중요] 지연 apply(compositionstart+60ms / compositionupdate+0ms)는 빠른 타이핑에서
      // 조합이 이미 끝난 뒤 발화할 수 있다. 그때 동작하면 .ime-fixed 를 재부착하고(다음
      // 조합까지 잔류) chain 예약을 오소모해 다음 조합을 깨뜨린다 — 조합 중일 때만 동작.
      if (!isImeComposing) return;
      const caret = frozenImeCaret || findBlockCursor(); // 동결분이 있으면 그대로(조합 중 부동)
      if (!caret) return;
      frozenImeCaret = caret;
      const screen = el.querySelector('.xterm-screen');
      if (!screen) return;
      // 셀 픽셀 크기 실측 환산 — showGhost() 와 동일 식(동일해야 고스트와 조합뷰가 정렬됨).
      const cw = screen.clientWidth / term.cols;
      const chh = screen.clientHeight / term.rows;
      el.style.setProperty('--ime-left', Math.round(caret.col * cw) + 'px');
      el.style.setProperty('--ime-top', Math.round(caret.row * chh) + 'px');
      el.classList.add('ime-fixed');
    }

    // ── 조합 이벤트 핸들러 ──
    // 한글 IME 이벤트 순서(중요 — 이 순서에 로직 전체가 기대고 있다):
    //  · 첫 자모 키:      keydown(229, isComposing=false) → compositionstart → compositionupdate
    //  · 조합 중 자모 키:  keydown(229, isComposing=true) → compositionupdate
    //  · 음절 전환 키:    keydown(229) → compositionend('안') → compositionstart → update('ㄴ')
    //                     ※ 전부 같은 keydown 처리 안 — 이때 echo 는 아직 미도착(chain 이 필요한 이유)
    //  · 스페이스 확정:   keydown(32, isComposing=true) → compositionend → keyup(32, isComposing=false)
    //  · Enter 확정:      keydown(229) → compositionend → keydown(13, isComposing=false) (2번째 keydown)
    // [고착 수사] "한번 발생하면 세션 재실행까지 지속"되는 커서 깜빡임의 층 판별용 스냅샷.
    // 우리 상태 머신 로그(hide/restore)가 깨끗한데도 증상이 보이므로, 고착은 옵션 레벨 아래
    // (테마 서비스 / 렌더러 / textarea 네이티브 캐럿) 어딘가다 — 조합 중 실제 페인트 상태를 찍는다.
    //  · svc: xterm ThemeService 가 실제로 든 커서색(위장이 서비스까지 갔는지)
    //  · cursorEl: 커서 DOM 요소의 계산된 배경색(위장이 페인트까지 갔는지 — DOM 렌더러)
    //  · ta: textarea 계산 스타일(opacity/좌표/크기/caret-color — 네이티브 캐럿 노출 여부)
    //  · view: 조합뷰 active/좌표
    let lastImeStateDumpAt = 0;
    function dumpImeState(tag) {
      try {
        let svc = '?';
        try {
          const c = term._core && term._core._themeService && term._core._themeService.colors;
          if (c && c.cursor && c.cursor.css) svc = c.cursor.css;
        } catch (e) { svc = 'err'; }
        const th = term.options.theme || {};
        const cEl = el.querySelector('.xterm-cursor');
        const tcs = getComputedStyle(ta);
        const vEl = el.querySelector('.composition-view');
        // DOM 렌더러 테마 스타일시트의 실제 커서 규칙 색 — svc 와 다르면 스타일시트 고착 확진.
        const sheetCur = [];
        try {
          el.querySelectorAll('style').forEach(function (s) {
            const m = (s.textContent || '').match(/\.xterm-cursor\.xterm-cursor-block \{ background-color: ([^;]+);/);
            if (m) sheetCur.push(m[1]);
          });
        } catch (e) {}
        imeDiag('state ' + tag +
          ' svc=' + svc + ' sheet=' + (sheetCur.join('|') || 'none') +
          ' themeCur=' + th.cursor + ' bg=' + th.background +
          ' blink=' + term.options.cursorBlink + ' saved=' + (savedCursorColors ? 1 : 0) +
          ' cursorEl=' + (cEl ? getComputedStyle(cEl).backgroundColor : 'none') +
          ' ta=[op:' + tcs.opacity + ' ' + tcs.left + ',' + tcs.top + ' ' + tcs.width + 'x' + tcs.height +
          ' caret:' + (tcs.caretColor || '?') + ']' +
          ' view=' + (vEl ? ((vEl.classList.contains('active') ? 'on' : 'off') + ' ' +
                             getComputedStyle(vEl).left + ',' + getComputedStyle(vEl).top) : 'none') +
          rendererTag());
      } catch (e) { try { imeDiag('state err ' + (e && e.message)); } catch (e2) {} }
    }

    // [모니터 좌상단 조합창 수사] 조합 미리보기가 터미널 안이 아니라 "모니터 (0,0)"에 뜨는
    // 간헐 고착은 DOM 층이 아니라 Win32 IME 컨텍스트 층의 문제로 추정된다 — 조합 이벤트는
    // 정상 유입되고(글자는 들어감), 터미널 밖(WPF) 클릭 = 실제 HWND 포커스 이동만이 해결.
    // DOM 상태를 실어 보내면 C#(case 'imeProbe')이 Win32 포커스/기본 IME 창 위치·가시성을
    // 같은 줄에 덧붙여 diag.log 에 남긴다. 판독법: .knowledge/ime-모니터좌상단-조합창-고착.md
    let lastImeProbeAt = 0;
    function sendImeProbe() {
      if (!imeDiagnostics) return;
      const now = Date.now();
      if (now - lastImeProbeAt < 2000) return; // 음절마다 발화하므로 스로틀(연속 타이핑이면 2초마다 1줄)
      lastImeProbeAt = now;
      try {
        const sr = (el.querySelector('.xterm-screen') || el).getBoundingClientRect();
        const tr = ta.getBoundingClientRect();
        const vEl = el.querySelector('.composition-view');
        const vr = vEl ? vEl.getBoundingClientRect() : null;
        post({ type: 'imeProbe', msg: '[ime ' + agent + ' ' + roomId + '] probe' +
          ' focus=' + (document.hasFocus() ? 1 : 0) +
          ' act=' + (document.activeElement === ta ? 1 : 0) +
          ' ta=' + Math.round(tr.left - sr.left) + ',' + Math.round(tr.top - sr.top) +
          ' view=' + (vEl ? (vEl.classList.contains('active') ? 'on' : 'off') + ':' +
                      Math.round(vr.left - sr.left) + ',' + Math.round(vr.top - sr.top) : 'none') });
      } catch (e) {}
    }

    function beginComposition() {
      isImeComposing = true;
      // 컴포저가 전체선택(Ctrl+A)된 상태에서 조합이 시작되면 — CLI 는 조합의 시작을
      // 볼 수 없다(확정 전까지 PTY 로 아무것도 안 간다). 그대로 두면 선택은 남고
      // 조합뷰만 오른쪽에 겹쳐 보이다가, 한참 뒤 확정 시점에야 지워진다. 선택 삭제를
      // 여기서 대신 보내면 확정 글자는 비워진 입력창에 들어간다. 플래그는 CLI 가
      // devez-select-v1 로 다시 알려 준다.
      if (agent === 'devezvibe' && entry && entry.devezComposerSelectAll) {
        entry.devezComposerSelectAll = false;
        post({ type: 'input', roomId: roomId, data: '\x7f' });
      }
      sendImeProbe();
      frozenImeCaret = null;              // 새 조합 — 앵커를 새로 잡는다(직전 동결분 폐기)
      if (pinsLogicalCaret) hideHwCursor(); // B형: 조합 동안 블록커서 깜빡임 제거(A형과 동일 UX)
      if (pendingResponseReset) armStaleCompositionReset();
      apply();                            // 여기서 chain 예약이 있으면 소비되어 앵커가 된다
      // 60ms 재시도: 앵커를 못 잡아 no-pin 으로 시작한 경우(커서가 하단 예약행에 파킹 + 폴백 없음)
      // 그 사이 커서가 입력란으로 복귀하면 그때 동결한다. 이미 동결됐으면 no-op.
      // (조합이 60ms 안에 끝나면 apply 의 isImeComposing 가드가 무해하게 흡수)
      setTimeout(apply, 60);
      // 고착 수사 스냅샷 — 조합/pin 이 자리잡은 뒤(120ms) 실제 페인트 상태. 500ms 스로틀(저볼륨).
      if (imeDiagnostics && pinsLogicalCaret) {
        const now = Date.now();
        if (now - lastImeStateDumpAt > 500) {
          lastImeStateDumpAt = now;
          setTimeout(function () { if (isImeComposing) dumpImeState('compose'); }, 120);
        }
      }
    }
    ta.addEventListener('compositionstart', beginComposition);
    ta.addEventListener('compositionupdate', function (e) {
      // compositionstart 누락 자가치유: WebView2 는 IME 컨텍스트 재부착 직후(blur→focus 뒤 등)
      // start 이벤트를 간헐적으로 떨어뜨린다. 그러면 B형 커서숨김/pin/chain 이 통째로 시작되지
      // 않아 "조합 중 블록커서가 글자 왼쪽에서 깜빡"이는 재발 증상이 된다. update 가 왔는데
      // 조합 상태가 아니면 start 로 간주해 동일하게 처리하고, 발생 증거를 diag 에 남긴다.
      if (!isImeComposing) {
        imeDiag('update-without-start data="' + ((e && e.data) || '') + '"');
        beginComposition();
      }
      if (pendingResponseReset) armStaleCompositionReset();
      // setTimeout 0: xterm 이 같은 이벤트에서 조합뷰 textContent/inline 좌표를 갱신한 "다음에"
      // 우리 좌표를 다시 얹기 위한 태스크 양보. (no-pin 시작분의 교정 경로이기도 함)
      setTimeout(apply, 0);
    });

    // Devez Vibe의 패널 전환은 터미널 cols를 바꾸지 않고 컴포저만 다시 배치한다. 화면 하단의
    // 실제 컴포저 행을 찾아 폭을 캐시하고, 폭/행이 바뀌는 즉시 이전 패널 기준 IME 예약을 버린다.
    function findDevezVibeComposerLayout() {
      if (agent !== 'devezvibe') return null;
      try {
        const buf = term.buffer.active;
        const firstRow = Math.max(0, term.rows - bottomReserved - 14);
        for (let row = term.rows - bottomReserved - 1; row >= firstRow; row--) {
          const line = buf.getLine(buf.viewportY + row);
          if (!line) continue;
          const inputRow = line.getCell(0)?.getChars() === '│' &&
            line.getCell(1)?.getChars() === ' ' &&
            (line.getCell(2)?.getChars() === '>' || line.getCell(2)?.getChars() === ' ');
          if (!inputRow) continue;
          // 오른쪽에서 찾으면 입력 내용의 │는 건너뛴다. 패널 오른쪽 테두리는 끝 여백이 하나뿐이라
          // x+2 공백 조건을 만족하지 않고, 컴포저 닫는 테두리만 선택된다.
          for (let x = term.cols - 3; x >= 4; x--) {
            if (line.getCell(x)?.getChars() === '│' &&
                line.getCell(x - 1)?.getChars() === ' ' &&
                line.getCell(x - 2)?.getChars() === ' ' &&
                line.getCell(x + 1)?.getChars() === ' ' &&
                line.getCell(x + 2)?.getChars() === ' ') {
              return { row: row, cols: Math.min(term.cols, x + 2) };
            }
          }
          // 패널이 닫힌 전체 폭에서는 닫는 테두리가 끝에서 두 번째 셀이라 x+2가 없다.
          // 내부 경계를 먼저 찾은 뒤에만 검사해 열린 패널의 바깥 테두리와 혼동하지 않는다.
          const edge = term.cols - 2;
          if (line.getCell(edge)?.getChars() === '│' &&
              line.getCell(edge - 1)?.getChars() === ' ' &&
              line.getCell(edge - 2)?.getChars() === ' ' &&
              line.getCell(edge + 1)?.getChars() === ' ') {
            return { row: row, cols: term.cols };
          }
        }
      } catch (e) {}
      return null;
    }

    function updateDevezVibeComposerLayout(cols, row, source) {
      const changed = cols !== devezVibeComposerColsCache || row !== devezVibeComposerRowCache;
      if (!changed) return;
      const before = devezVibeComposerColsCache + '@' + devezVibeComposerRowCache;
      devezVibeComposerColsCache = cols;
      devezVibeComposerRowCache = row;
      chainCaret = null;
      clearGhost();
      lastLogicalCaret = null;
      frozenImeCaret = null;
      imeDiag('composer-layout[' + source + '] ' + before + ' -> ' + cols + '@' + row);
      if (isImeComposing) setTimeout(apply, 0);
      else setTimeout(rememberLogicalCaret, 0);
    }

    // 최신 dvz는 패널을 그리는 실제 본문 폭을 OSC로 직접 보낸다. 신호를 한 번 받은 뒤에는
    // 전환 중인 화면 셀을 추정해 새 값을 되돌리지 않고, 화면 스캔은 구버전 dvz 폴백으로만 쓴다.
    el._setDevezVibeComposerCols = function (cols) {
      if (agent !== 'devezvibe' || !Number.isInteger(cols) || cols < 20 || cols > term.cols) return;
      devezVibeComposerColsSignaled = true;
      updateDevezVibeComposerLayout(cols, -1, 'signal');
    };
    if (Number.isInteger(el._devezVibeComposerCols)) {
      el._setDevezVibeComposerCols(el._devezVibeComposerCols);
    }

    function syncDevezVibeComposerLayout() {
      if (agent !== 'devezvibe') return term.cols;
      if (devezVibeComposerColsSignaled) return devezVibeComposerColsCache;
      const layout = findDevezVibeComposerLayout();
      if (!layout) return devezVibeComposerColsCache;
      updateDevezVibeComposerLayout(layout.cols, layout.row, 'scan');
      return devezVibeComposerColsCache;
    }

    // ── 결정적 조합 확정 전송 (xterm 6.1 에이전트 한정, grep: deterministicImeCommit) ──
    // xterm 6.1 의 compositionend 는 0ms 타이머로 textarea 를 되읽어 확정 문자열을 만든다.
    // 렌더러가 잠시 멈췄다 몰린 이벤트를 한꺼번에 처리하면(연타 중 순간 멈춤) 그 타이머는
    // 큐에 쌓인 keydown/keyup 들 "뒤"로 밀리는데, 그 사이 xterm 이 textarea 를 비우는 키
    // (Enter 등)나 새 조합이 끼면 되읽은 문자열이 비거나 어긋난다 → 확정 글자 유실·중복
    // (2026-08-28 diag 실측: commit "제","가" 이벤트는 정상인데 dvz 커서가 전진하지 않음.
    //  ConPTY+crossterm 은 하네스 실측으로 무죄 — 유실은 이 웹 레이어가 유일한 구간).
    // 확정 문자열의 원본은 compositionend 의 e.data 다. textarea 되읽기를 버리고
    // e.data 를 즉시 복사하되, 같은 이벤트 밀림에서 연속 확정된 음절은 0ms 큐 하나로
    // 묶어 보낸다. 음절마다 동기 전송하면 dvz 전체 컴포저 리페인트도 같이 몰려
    // 유실·중복은 없어도 입력이 미세하게 끊겨 보인다. 다음 일반 키 입력이 먼저 나가려
    // 하면 term.onData 가 대기 중인 확정값을 앞에 붙여 순서를 보존한다. xterm 의 textarea
    // 지연 전송·229 폴백 diff 전송은 무력화한다.
    // 키 확정(스페이스/화살표가 조합을 끊는 경우)은 xterm 원본과 같은 동기 전송을 유지해
    // "글자 → 키" 순서를 보존하고, 직후 compositionend 가 같은 문자열을 다시 보내지 않게
    // 1회 소거한다. 한글·일어·중국어 IME 는 모두 composition 이벤트를 발화하므로 229 폴백
    // 무력화의 영향이 없다. 헬퍼 내부 접근이 실패하면(향후 번들 교체) 원래 경로를 그대로 둔다.
    let keydownCommitSent = null; // { data, at } — 키 확정이 방금 보낸 문자열(1회 소거용)
    let pendingImeCommitData = '';
    let pendingImeCommitTimer = 0;
    const imeCore = (agent === 'devezvibe' || agent === 'codex') && term._core;
    const imeHelper = imeCore && imeCore._compositionHelper;
    const deterministicImeCommit = !!(imeHelper && imeHelper._compositionView &&
      imeHelper._coreService && typeof imeHelper._finalizeComposition === 'function');
    if (deterministicImeCommit) {
      function takePendingImeCommit() {
        if (pendingImeCommitTimer) {
          clearTimeout(pendingImeCommitTimer);
          pendingImeCommitTimer = 0;
        }
        const data = pendingImeCommitData;
        pendingImeCommitData = '';
        return data;
      }
      function flushPendingImeCommit() {
        pendingImeCommitTimer = 0;
        const data = pendingImeCommitData;
        pendingImeCommitData = '';
        if (data) imeHelper._coreService.triggerDataEvent(data, true);
      }
      function queueImeCommit(data) {
        pendingImeCommitData += data;
        if (!pendingImeCommitTimer) pendingImeCommitTimer = setTimeout(flushPendingImeCommit, 0);
      }
      // compositionend 직후 Space/Enter 등 일반 키가 이 타이머보다 먼저
      // onData 에 도달하면 확정 문자열을 그 키 앞에 합친다.
      entry._takePendingImeCommit = takePendingImeCommit;
      imeHelper._finalizeComposition = function (waitForPropagation) {
        this._compositionView.classList.remove('active');
        this._isComposing = false;
        this._isSendingComposition = false;
        if (!waitForPropagation) {
          // 키가 조합을 끊었다 — 이 키의 문자보다 먼저, 지금 이 자리에서 동기 전송해야
