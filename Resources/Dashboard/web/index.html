<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f1e">
  <title>DevezCode LAN</title>
  <link rel="stylesheet" href="/terminal-assets/xterm.min.css">
  <link rel="stylesheet" href="dashboard.css">
  <script src="/terminal-assets/xterm.min.js"></script>
  <script>window.__xterm5 = window.Terminal;</script>
  <script src="/terminal-assets/xterm6.min.js"></script>
  <script>window.Terminal6 = window.Terminal; window.Terminal = window.__xterm5;</script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button id="sidebar-toggle" class="icon-button mobile-only" aria-label="세션 목록">☰</button>
      <div class="brand"><span class="brand-mark">D</span><span>DevezCode</span><span class="lan-badge">LAN</span></div>
      <div class="top-actions">
        <span id="connection" class="connection"><i></i><span>연결 중</span></span>
        <button id="control" class="control-button">제어권 가져오기</button>
      </div>
    </header>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div><strong>실행 중인 세션</strong><span id="session-count">0</span></div>
        <button id="refresh" class="icon-button" title="새로 고침">↻</button>
      </div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-foot">DevezCode가 실행 중일 때만 연결됩니다.</div>
    </aside>

    <main class="workspace">
      <div id="session-header" class="session-header hidden">
        <div class="session-title-wrap">
          <strong id="session-title"></strong>
          <span id="session-project"></span>
        </div>
        <div class="session-meta"><span id="agent-pill"></span><span id="size-label"></span></div>
      </div>
      <div id="terminal-scroll" class="terminal-scroll">
        <div id="empty" class="empty-state">
          <div class="empty-icon">›_</div>
          <strong>세션을 선택하세요</strong>
          <span>DevezCode에서 실행 중인 터미널을 그대로 제어할 수 있습니다.</span>
        </div>
        <div id="terminal" aria-label="터미널"></div>
      </div>
      <div id="mobile-keys" class="mobile-keys">
        <button data-code="esc">Esc</button><button data-code="ctrlc">Ctrl+C</button>
        <button data-code="up">↑</button><button data-code="down">↓</button>
        <button data-code="left">←</button><button data-code="right">→</button>
        <button data-code="enter" class="enter-key">Enter</button>
      </div>
    </main>
  </div>
  <div id="scrim" class="scrim"></div>
  <div id="toast" class="toast"></div>
  <script src="dashboard.js"></script>
</body>
</html>
